<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
<!-- FORWARDER (feature "reimbursement", session S7, 8 Nov 2026). Expense claims now live inside the LINE app (index.html,
     route #claim, plus Manage › Expenses and #expenses). This page only keeps the old address working (the reimbursement
     LIFF app, the rich menu, Home's "New expense claim" button, links already shared): it opens
     https://liff.line.me/<LIFF.home>?claim=1 (or ?claim=<eventId> when the old link named an event). Other query values are
     kept (?demo too). No loop: the app never sends anyone back here while it has the route "claim" (tools/check.js
     section 9). No personal data, no PromptPay, no receipts and no server call on this page. -->
<meta name="forwards-to" content="claim">
<title>เบิกค่าใช้จ่าย | Expense claim</title>
<style>
:root{--bg:#F3F6F5;--ink:#0F1F1E;--muted:#526361;--primary:#136B66;--on-primary:#FFFFFF;color-scheme:light dark}
@media (prefers-color-scheme: dark){:root{--bg:#0C1615;--ink:#E6F0EE;--muted:#9DB0AD;--primary:#66C7BF;--on-primary:#04211F}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans Thai","Sarabun","Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:24px;padding:24px 16px}
main{max-width:360px;text-align:center}
p{margin:0 0 6px}
.muted{color:var(--muted);font-size:14px;line-height:20px}
a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;margin-top:20px;padding:0 20px;border-radius:12px;background:var(--primary);color:var(--on-primary);font-weight:600;text-decoration:none}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <p id="msgTh">กำลังเปิดหน้าเบิกค่าใช้จ่ายในแอป…</p>
  <p class="muted" id="msgEn">Opening expense claims in the app…</p>
  <a class="btn" id="goBtn" href="index.html?claim=1" hidden>เปิดหน้าเบิกค่าใช้จ่าย / Open expense claims</a>
</main>
<script src="config.js"></script>
<script>
/* Shared settings come from config.js (one file for all pages, see config.example.js). Missing or broken file = demo mode. */
(function () {
  var SHARED = window.COMMUNITY_CONFIG || {}, SHARED_LIFF = SHARED.LIFF || {};
  var cfgText = function (x) { x = typeof x === "string" ? x.trim() : ""; return /^YOUR-/i.test(x) ? "" : x; };
  var cfgLiffId = function (x) { return cfgText(x).replace(/^https?:\/\/liff\.line\.me\//i, "").replace(/[\/?#].*$/, ""); };
  var homeId = cfgLiffId(SHARED_LIFF.home), demo = !cfgText(SHARED.API_URL);
  var p = new URLSearchParams(location.search);
  Array.from(p.keys()).forEach(function (k) { if (/^liff\./i.test(k)) p.delete(k); });   // LINE's own values are not passed on
  // the old page's demo screens: ?demo=blocked (not allowed) -> a member without the right; the form -> an organizer
  var DEMO = { blocked: "new" };
  if (p.has("demo")) p.set("demo", DEMO[p.get("demo")] || p.get("demo"));
  else if (demo) p.set("demo", "organizer");
  var ev = (p.get("event") || "").replace(/[^A-Za-z0-9_-]/g, "").slice(0, 40);  // an old link that named an event
  p.delete("event");
  p.set("claim", ev || "1");
  // the app itself: its LIFF link when configured, otherwise index.html next to this page (demo mode, or no home LIFF ID yet)
  var target = !demo && homeId ? "https://liff.line.me/" + homeId + "?" + p.toString()
    : location.pathname.replace(/[^\/]*expense-reimbursement\.html$/, function (f) { return f.replace("expense-reimbursement.html", "index.html"); }) + "?" + p.toString();
  var b = document.getElementById("goBtn"); b.href = target;
  setTimeout(function () { b.hidden = false; }, 2500);        // if the phone does not move on by itself, one tap does it
  location.replace(target);
})();
</script>
</body>
</html>
