<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://static.line-scdn.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.line-scdn.net; connect-src https://script.google.com https://script.googleusercontent.com https://*.line.me https://*.line-scdn.net; frame-src https://*.line.me; object-src 'none'; base-uri 'none'">
<title>สมัครสมาชิก | Join the community</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<!-- LINE Front-end Framework (LIFF) SDK -->
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{
  --bg:#E6ECF2; --slip:#FFFFFF; --field:#F3F6F9; --ink:#0E1726; --muted:#586477; --line:#D3DBE5;
  --accent:#2447D6; --accent-ink:#FFFFFF; --accent-soft:#E7ECFD; --err:#B42318; --err-bg:#FDECEA;
  --ok:#0F7A55; --ok-bg:#E3F4EC; --warn:#8A5A00; --warn-bg:#FFF3D1; --grey-bg:#EDF1F5; --bar:#0E1726;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0C121B; --slip:#161F2C; --field:#0F1722; --ink:#E8EDF4; --muted:#9AA7B8; --line:#2A3647;
    --accent:#8AA2FF; --accent-ink:#0C121B; --accent-soft:#1E2A4A; --err:#FF9189; --err-bg:#3A1C1C;
    --ok:#5CD0A3; --ok-bg:#12302A; --warn:#F2C26B; --warn-bg:#33290F; --grey-bg:#1C2633; --bar:#223046;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai","Sarabun","Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5;
  padding:env(safe-area-inset-top,0) 0 calc(40px + env(safe-area-inset-bottom,0))}
body.has-bar{padding-bottom:calc(110px + env(safe-area-inset-bottom,0))}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;gap:12px;padding:18px 0 4px}
.avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;background:var(--accent-soft);color:var(--accent);flex:none;display:grid;place-items:center;font-weight:600;font-size:18px;border:2px solid var(--slip)}
.hello{flex:1;min-width:0}
.hello small{display:block;font-size:13px;color:var(--muted)}
.hello b{display:block;font-size:17px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lang{flex:none;min-width:48px;height:36px;border:1px solid var(--line);background:var(--slip);border-radius:18px;font-size:14px;font-weight:500;padding:0 12px;cursor:pointer}
.banner{margin:12px 0 0;padding:10px 12px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:14px}
h1{font-size:22px;line-height:1.3;font-weight:600;margin:20px 0 6px}
.lead{margin:0 0 16px;color:var(--muted);font-size:15px}
.skel{background:var(--slip);border-radius:16px;height:300px;border:1px solid var(--line);position:relative;overflow:hidden;margin-top:20px}
.skel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:sh 1.2s infinite}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@media (prefers-reduced-motion:reduce){.skel::after{animation:none}}

/* form */
.back{background:none;border:0;color:var(--accent);font-weight:500;font-size:15px;min-height:44px;padding:0;margin-top:6px;cursor:pointer}
.panel{background:var(--slip);border-radius:16px;padding:16px;border:1px solid var(--line)}
.block{margin-top:18px}
.field{display:block;margin:0 0 14px;min-width:0}
fieldset.field{border:0;padding:0}
.field:last-child{margin-bottom:0}
.lbl{display:block;font-size:14px;font-weight:500;color:var(--muted);margin-bottom:6px;padding:0}
.hint{margin:6px 0 0;font-size:13px;color:var(--muted)}
.err{margin:6px 0 0;font-size:13px;color:var(--err);font-weight:500}
input[type=text]{width:100%;min-height:48px;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink);font:inherit;font-size:16px;appearance:none;-webkit-appearance:none}
[aria-invalid=true]{border-color:var(--err)!important}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:360px){.row2{grid-template-columns:1fr}}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{display:block;position:relative;border:1.5px solid var(--line);border-radius:12px;padding:12px;min-height:64px;cursor:pointer;background:var(--field)}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice b{display:block;font-size:15.5px}
.choice span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.choice:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.choice:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.consent{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:var(--ink);cursor:pointer}
.consent input{width:22px;height:22px;margin:2px 0 0;flex:none;accent-color:var(--accent)}
.consent small{display:block;color:var(--muted);font-size:13px;margin-top:4px}

/* buttons + bar */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:16px;cursor:pointer;text-decoration:none}
.btn.sec{background:transparent;color:var(--accent)}
.btn.block{width:100%}
.btn[disabled]{opacity:.55;cursor:default}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:500;font-size:15px;min-height:44px;padding:0 8px;cursor:pointer}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bar);color:#fff;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0));box-shadow:0 -6px 18px rgba(0,0,0,.14);z-index:10}
.bar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:14px}
.bar-l{flex:1;min-width:0;font-size:13px;color:#AEB9CB;line-height:1.35}
.bar-l b{display:block;color:#fff;font-size:15px;font-weight:600}
.bar .btn{background:#fff;color:#0E1726;border-color:#fff;min-width:150px}
@media (prefers-color-scheme: dark){.bar .btn{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}}

/* slip (pending, denied, member card) */
.slip{position:relative;background:var(--slip);border-radius:16px 16px 0 0;padding:22px 18px 20px;margin-top:20px}
.slip::after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:10px;
  background:linear-gradient(135deg,var(--slip) 5px,transparent 0) 0 0/14px 10px repeat-x,linear-gradient(225deg,var(--slip) 5px,transparent 0) 0 0/14px 10px repeat-x}
.icon{width:52px;height:52px;border-radius:50%;display:grid;place-items:center}
.icon svg{width:26px;height:26px}
.icon.wait{background:var(--warn-bg);color:var(--warn)}
.icon.lock{background:var(--grey-bg);color:var(--muted)}
.icon.ok{background:var(--ok-bg);color:var(--ok)}
.slip h2{font-size:22px;line-height:1.3;margin:12px 0 4px}
.sub{color:var(--muted);margin:0;font-size:14.5px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:14px;font-size:13px;font-weight:500;background:var(--grey-bg);color:var(--muted);margin-top:10px}
.chip.wait{background:var(--warn-bg);color:var(--warn)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.sid-l{margin:16px 0 0;color:var(--muted);font-size:13.5px}
.sid{font-size:26px;font-weight:600;letter-spacing:.03em;font-variant-numeric:tabular-nums;margin:0;word-break:break-all}
.dash{border:0;border-top:1.5px dashed var(--line);margin:16px 0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:15px}
.kv span:first-child{color:var(--muted);flex:none}
.kv span:last-child{font-weight:500;text-align:right;overflow-wrap:anywhere}
.steps{margin:14px 0 0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:8px;padding:6px 0;font-size:14.5px}
.steps li::before{content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:13px;font-weight:600}
.note{margin:14px 0 0;font-size:13px;color:var(--muted)}

/* home */
.notice{display:flex;gap:12px;align-items:flex-start;background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:14px;margin-top:16px;font-size:14.5px}
.notice b{display:block;font-size:15.5px}
.notice .btn{min-height:40px;margin-top:10px;background:transparent;border-color:var(--warn);color:var(--warn);font-size:14.5px}
.tiles{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.tile{display:grid;grid-template-columns:48px 1fr 20px;gap:14px;align-items:center;background:var(--slip);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:left;width:100%;cursor:pointer;min-height:76px}
.tile .ti{width:48px;height:48px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:24px}
.tile b{display:block;font-size:17px;font-weight:600}
.tile span.d{display:block;font-size:13.5px;color:var(--muted)}
.tile .go{color:var(--muted);font-size:20px}

.toast{position:fixed;left:16px;right:16px;bottom:calc(92px + env(safe-area-inset-bottom,0));max-width:528px;margin:0 auto;background:var(--err-bg);color:var(--err);border:1px solid var(--err);padding:12px 14px;border-radius:12px;font-weight:500;font-size:14.5px;z-index:11}
.toast.good{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.fatal{margin-top:20vh;text-align:center;color:var(--muted)}
.fatal b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <div class="avatar" id="avatarBox" aria-hidden="true"></div>
    <div class="hello"><small data-i18n="hello"></small><b id="lineName">&nbsp;</b></div>
    <button type="button" class="lang" id="langBtn" aria-label="Language"></button>
  </header>
  <div class="banner" id="demoBanner" hidden data-i18n="demo"></div>

  <!-- LOADING -->
  <section id="vLoading"><div class="skel"></div></section>

  <!-- APPLY / COMPLETE / EDIT FORM -->
  <section id="vApply" hidden>
    <button type="button" class="back" id="backBtn" hidden data-i18n="back"></button>
    <h1 id="applyTitle"></h1>
    <p class="lead" id="applySub"></p>
    <form id="joinForm" novalidate>
      <section class="block">
        <div class="panel">
          <div class="row2">
            <label class="field" data-f="firstName"><span class="lbl" data-i18n="firstName"></span>
              <input type="text" id="firstName" autocomplete="given-name" maxlength="60" required><p class="err" role="alert" hidden></p></label>
            <label class="field" data-f="lastName"><span class="lbl" data-i18n="lastName"></span>
              <input type="text" id="lastName" autocomplete="family-name" maxlength="60" required><p class="err" role="alert" hidden></p></label>
          </div>
          <fieldset class="field" data-f="occupation">
            <legend class="lbl" data-i18n="nowL"></legend>
            <div class="choices">
              <label class="choice"><input type="radio" name="occ" value="studying"><b data-i18n="studying"></b><span data-i18n="studyingD"></span></label>
              <label class="choice"><input type="radio" name="occ" value="working"><b data-i18n="working"></b><span data-i18n="workingD"></span></label>
            </div>
            <p class="err" role="alert" hidden></p>
          </fieldset>
          <label class="field" data-f="organization" id="orgField" hidden><span class="lbl" id="orgLbl"></span>
            <input type="text" id="org" autocomplete="organization" maxlength="120" required><p class="err" role="alert" hidden></p></label>
        </div>
      </section>
      <section class="block">
        <div class="panel field" data-f="consent">
          <label class="consent"><input type="checkbox" id="consent">
            <span><span data-i18n="consent"></span><small data-i18n="consentSmall"></small></span></label>
          <p class="err" role="alert" hidden></p>
        </div>
      </section>
    </form>
  </section>

  <!-- PENDING REVIEW -->
  <section id="vPending" hidden>
    <div class="slip">
      <div class="icon wait" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
      <h2 data-i18n="pendingTitle"></h2>
      <p class="sub" data-i18n="pendingSub"></p>
      <span class="chip wait" data-i18n="pendingChip"></span>
      <p class="sid-l" data-i18n="sidL"></p>
      <p class="sid" id="pSid"></p>
      <p class="hint" data-i18n="sidHint"></p>
      <hr class="dash">
      <div id="pKv"></div>
      <p class="note" data-i18n="pendingNext"></p>
    </div>
    <div class="stack">
      <button type="button" class="btn block" id="refreshBtn" data-i18n="refresh"></button>
      <button type="button" class="btn sec block" id="editBtn" data-i18n="editBtn"></button>
      <button type="button" class="linkbtn" id="pChatBtn" data-i18n="contact"></button>
    </div>
  </section>

  <!-- ACCESS DENIED (application not approved) -->
  <section id="vDenied" hidden>
    <div class="slip">
      <div class="icon lock" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
      <h2 data-i18n="deniedTitle"></h2>
      <p class="sub" data-i18n="deniedSub"></p>
      <p class="sid-l" data-i18n="sidL"></p>
      <p class="sid" id="dSid"></p>
      <p class="hint" data-i18n="deniedSid"></p>
      <hr class="dash">
      <b data-i18n="deniedWhat"></b>
      <ol class="steps">
        <li data-i18n="deniedS1"></li>
        <li data-i18n="deniedS2"></li>
        <li data-i18n="deniedS3"></li>
      </ol>
      <p class="note" data-i18n="deniedPrivacy"></p>
    </div>
    <div class="stack">
      <button type="button" class="btn block" id="chatBtn" data-i18n="chat"></button>
      <p class="hint" id="noChat" hidden data-i18n="noChat"></p>
      <button type="button" class="btn sec block" id="copyBtn" data-i18n="copySid"></button>
      <button type="button" class="linkbtn" id="closeBtn" data-i18n="close"></button>
    </div>
  </section>

  <!-- HOME (approved) -->
  <section id="vHome" hidden>
    <div class="slip">
      <div class="icon ok" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h2 id="hName"></h2>
      <span class="chip ok" id="hChip"></span>
      <hr class="dash">
      <div id="hKv"></div>
    </div>
    <div class="notice" id="incomplete" hidden>
      <span aria-hidden="true">✎</span>
      <div><b data-i18n="incompleteT"></b><span data-i18n="incompleteD"></span><br>
        <button type="button" class="btn" id="completeBtn" data-i18n="completeBtn"></button></div>
    </div>
    <div class="tiles">
      <button type="button" class="tile" id="tileEvents"><span class="ti" aria-hidden="true">🗓</span><span><b data-i18n="menuEvents"></b><span class="d" data-i18n="menuEventsD"></span></span><span class="go" aria-hidden="true">›</span></button>
      <button type="button" class="tile" id="tileClaims" hidden><span class="ti" aria-hidden="true">🧾</span><span><b data-i18n="menuClaims"></b><span class="d" data-i18n="menuClaimsD"></span></span><span class="go" aria-hidden="true">›</span></button>
    </div>
  </section>

  <div class="fatal" id="vFatal" hidden><b id="fatalT"></b><span id="fatalD"></span></div>
</main>

<div class="bar" id="bar" hidden>
  <div class="bar-in">
    <div class="bar-l"><b id="barName"></b><span id="barSub"></span></div>
    <button type="button" class="btn" id="submitBtn"></button>
  </div>
</div>
<div class="toast" id="toast" role="alert" hidden></div>

<script>
/* =====================================================================
   CONFIG - edit this block only. Nothing here is secret.
   ===================================================================== */
const CONFIG = {

   Text
   ===================================================================== */
const T = {
 th:{

/* =====================================================================
   Helpers
   ===================================================================== */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const store = { get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };
let lang = CONFIG.DEFAULT_LANG;
const t = (k, v) => { let s = (T[lang] && T[lang][k]) ?? T.en[k] ?? k; if (v) for (const [a,b] of Object.entries(v)) s = s.split("{"+a+"}").join(b); return s; };
function h(tag, attrs, ...kids){                          // safe DOM builder: text is never parsed as HTML
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs || {})){
    if (v == null || v === false) continue;
    if (k === "class") el.className = v; else if (k === "text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v === true ? "" : v);
  }
  kids.flat().forEach(c => { if (c != null && c !== false) el.append(c instanceof Node ? c : document.createTextNode(String(c))); });
  return el;
}
let toastT;
function toast(msg, good){ const el = $("#toast"); el.textContent = msg; el.className = "toast" + (good ? " good" : ""); el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 5000); }

const state = { token:null, inClient:false, name:"", picture:"", member:null, view:"loading", mode:"apply", sending:false };

function applyLang(){
  document.documentElement.lang = lang;
  $$("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  $("#langBtn").textContent = t("langBtn");
  $('[data-i18n="consent"]').textContent = t("consent", {org: CONFIG.ORG_NAME || t("orgFallback")});
  render();
}
function show(view){
  state.view = view;
  ["Loading","Apply","Pending","Denied","Home"].forEach(n => $("#v"+n).hidden = view !== n.toLowerCase());
  $("#vFatal").hidden = view !== "fatal";
  $("#bar").hidden = view !== "apply"; document.body.classList.toggle("has-bar", view === "apply");
  $("#toast").hidden = true;
  window.scrollTo(0,0);
}

/* =====================================================================
   API (the LINE ID token travels in the body; Code.gs checks it with LINE)
   ===================================================================== */
class ApiError extends Error { constructor(m, c){ super(m); this.code = c; } }
async function post(action, data){
  if (demo) return demoApi(action, data || {});
  let res;
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 60000);
  try{
    const r = await fetch(CONFIG.API_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify(Object.assign({}, data, {action, lineIdToken:state.token})), signal:ctl.signal});
    res = await r.json();
  }catch(e){ throw new ApiError(t("errNet"), "NET"); }
  finally{ clearTimeout(to); }
  if (res.ok) return res;
  const map = {AUTH:"errAuth", RATE:"errRate", SERVER:"errNet", SETUP:"errSetup"};
  throw new ApiError(map[res.code] ? t(map[res.code]) : res.error, res.code);
}

const occLabel = o => o === "studying" ? t("occStudying") : o === "working" ? t("occWorking") : "";
function kv(k, v){ return h("div",{class:"kv"}, h("span",{text:k}), h("span",{text:v})); }
function memberRows(m){
  const p = m.profile || {};
  return [kv(t("kName"), ((p.firstName||"") + " " + (p.lastName||"")).trim()), kv(t("kStatus"), occLabel(p.occupation)),
          kv(p.occupation === "studying" ? t("kSchool") : t("kWork"), p.organization || "")].filter(r => r.lastChild.textContent);
}
function render(){
  const m = state.member; if (!m) return;
  if (state.view === "pending") renderPending();
  else if (state.view === "denied") renderDenied();
  else if (state.view === "home") renderHome();
  else if (state.view === "apply") renderApply();
}
function route(){
  const m = state.member;
  if (m.status === "approved"){ show("home"); renderHome(); }
  else if (m.status === "pending"){ show("pending"); renderPending(); }
  else if (m.status === "rejected"){ show("denied"); renderDenied(); }
  else { state.mode = "apply"; show("apply"); renderApply(); fillForm(); }
}
function renderPending(){
  const m = state.member;
  $("#pSid").textContent = m.serviceId;
  $("#pKv").replaceChildren(...memberRows(m));
  $("#pChatBtn").hidden = !CONFIG.ADMIN_OA_ID;
}
function renderDenied(){
  const m = state.member;
  $("#dSid").textContent = m.serviceId;
  $("#chatBtn").hidden = !CONFIG.ADMIN_OA_ID; $("#noChat").hidden = !!CONFIG.ADMIN_OA_ID;
}
function renderHome(){
  const m = state.member, p = m.profile || {};
  $("#hName").textContent = ((p.firstName||"") + " " + (p.lastName||"")).trim() || state.name;
  $("#hChip").textContent = "✓ " + t("member");
  $("#hKv").replaceChildren(kv(t("sidL"), m.serviceId), ...memberRows(m).slice(1));
  $("#incomplete").hidden = m.profileComplete;
  $("#tileClaims").hidden = !(m.role === "organizer" || m.role === "approver");
}
function renderApply(){
  const titles = {apply:["applyTitle","applySub","submit","barSub"], complete:["completeTitle","completeSub","saveDetails","barSubSave"], edit:["editTitle","editSub","saveDetails","barSub"]}[state.mode];
  $("#applyTitle").textContent = t(titles[0]); $("#applySub").textContent = t(titles[1]);
  $("#backBtn").hidden = state.mode === "apply";
  $("#barName").textContent = state.name || " "; $("#barSub").textContent = t(titles[3]);
  $("#submitBtn").textContent = state.sending ? t("submitting") : t(titles[2]); $("#submitBtn").disabled = state.sending;
  updateOrgLabel();
}
function selectedOcc(){ const r = $('input[name="occ"]:checked'); return r ? r.value : ""; }
function updateOrgLabel(){
  const o = selectedOcc();
  $("#orgField").hidden = !o;
  if (!o) return;
  $("#orgLbl").textContent = t(o === "studying" ? "orgStudying" : "orgWorking");
  $("#org").placeholder = t(o === "studying" ? "orgStudyingPh" : "orgWorkingPh");
}
function fillForm(){
  const p = (state.member && state.member.profile) || {};
  $("#firstName").value = p.firstName || ""; $("#lastName").value = p.lastName || "";
  $$('input[name="occ"]').forEach(r => r.checked = r.value === p.occupation);
  $("#org").value = p.organization || "";
  $("#consent").checked = false;
  $$("#joinForm [data-f]").forEach(f => setErr(f, null));
  updateOrgLabel();
}

/* =====================================================================
   Form
   ===================================================================== */
function setErr(field, key){
  const e = $(".err", field), i = $("input", field);
  if (key){ e.textContent = t(key); e.hidden = false; i && i.setAttribute("aria-invalid","true"); }
  else { e.hidden = true; $$("input", field).forEach(x => x.removeAttribute("aria-invalid")); }
}
function readForm(){
  return { firstName:$("#firstName").value.trim(), lastName:$("#lastName").value.trim(), occupation:selectedOcc(), organization:$("#org").value.trim() };
}
function validate(v){
  const errs = [], chk = (f, key) => { const el = $(`[data-f="${f}"]`); setErr(el, key); if (key) errs.push(el); };
  chk("firstName", v.firstName ? null : "req");
  chk("lastName", v.lastName ? null : "req");
  chk("occupation", v.occupation ? null : "pickOne");
  if (v.occupation) chk("organization", v.organization.length >= 2 ? null : "req");
  chk("consent", $("#consent").checked ? null : "consentReq");
  return errs;
}
async function submit(){
  if (state.sending) return;
  const v = readForm(), errs = validate(v);
  if (errs.length){
    toast(t("fixN",{n:errs.length})); errs[0].scrollIntoView({behavior:"smooth",block:"center"});
    const i = $("input", errs[0]); i && setTimeout(() => i.focus({preventScroll:true}), 300); return;
  }
  state.sending = true; renderApply();
  try{
    const r = await post("member.apply", {profile:v, consent:true, consentVersion:CONFIG.CONSENT_VERSION});
    state.member = r; route();
  }catch(e){
    if (e.code === "FORBIDDEN"){ await refresh(true); }       // an admin rejected it in the meantime
    else toast(e.message);
  }finally{
    state.sending = false; if (state.view === "apply") renderApply();
  }
}
async function refresh(silent){
  try{
    const before = state.member && state.member.status;
    const r = await post("member.bootstrap");
    state.member = r; route();
    if (!silent && before === "pending" && r.status === "pending") toast(t("stillPending"), true);
  }catch(e){ toast(e.message); }
}

function chatUrl(){
  const id = CONFIG.ADMIN_OA_ID;
  if (!/^@?[A-Za-z0-9._-]{1,40}$/.test(id)) return "";
  const text = t("chatPrefill", {sid: (state.member && state.member.serviceId) || ""});
  return "https://line.me/R/oaMessage/" + (id.startsWith("@") ? id : "@" + id) + "/?" + encodeURIComponent(text);
}
function openChat(){
  const url = chatUrl(); if (!url){ toast(t("noChat")); return; }
  if (window.liff && state.inClient && !demo) liff.openWindow({url, external:false}); else window.open(url, "_blank", "noopener");
}
async function copySid(){
  const sid = (state.member && state.member.serviceId) || "";
  try{ await navigator.clipboard.writeText(sid); toast(t("copied"), true); return; }catch(e){}
  try{                                                        // older LINE webviews
    const ta = h("textarea",{style:"position:fixed;opacity:0",readonly:true}); ta.value = sid; document.body.append(ta); ta.select();
    const ok = document.execCommand("copy"); ta.remove(); if (ok){ toast(t("copied"), true); return; }
  }catch(e){}
  toast(sid, true);
}
function go(url){ if (!url){ toast(t("noLink")); return; } location.href = url; }

async function demoApi(action, data){
  await new Promise(r => setTimeout(r, 350));
  if (action === "member.bootstrap") return Object.assign({ok:true}, JSON.parse(JSON.stringify(DEMO.m[demoMode] || DEMO.m.none)));
  if (action === "member.apply"){
    const prev = state.member, st = prev && prev.status === "approved" ? "approved" : "pending";

    box.replaceWith(img); img.id = "avatarBox";
  } else box.textContent = (state.name || "?").trim().charAt(0).toUpperCase();

async function initLiff(){
  if (demo || !CONFIG.LIFF_ID || !window.liff){ state.name = "Kim (demo)"; return true; }
  await liff.init({liffId:CONFIG.LIFF_ID});
  if (!liff.isLoggedIn()){ liff.login({redirectUri:location.href}); return false; }
  state.inClient = liff.isInClient();
  state.token = liff.getIDToken();        // LINE ID token (needs the openid scope); Code.gs checks it with LINE
  try{ const p = await liff.getProfile(); state.name = p.displayName || ""; state.picture = p.pictureUrl || ""; }catch(e){}
  if (!store.get("join.lang")){ const l = (liff.getLanguage && liff.getLanguage() || "").toLowerCase(); if (l) lang = l.startsWith("th") ? "th" : "en"; }
  return true;
}

  try{ if (!(await initLiff())) return; }
  catch(e){ console.error(e); applyLang(); fatal(t("liffFail"), t("errLoadD")); return; }
  applyLang(); renderHeader();
  try{ state.member = await post("member.bootstrap"); }
  catch(e){ fatal(t("errLoad"), e.code === "AUTH" || e.code === "SETUP" ? e.message : t("errLoadD")); return; }
  route();
})();

$("#langBtn").addEventListener("click", () => { lang = lang === "th" ? "en" : "th"; store.set("join.lang", lang); applyLang(); });
$("#submitBtn").addEventListener("click", submit);
$("#joinForm").addEventListener("submit", e => { e.preventDefault(); submit(); });
$("#joinForm").addEventListener("input", e => { const f = e.target.closest("[data-f]"); if (f) setErr(f, null); });
$("#joinForm").addEventListener("change", e => { if (e.target.name === "occ") updateOrgLabel(); });
$("#backBtn").addEventListener("click", () => route());
$("#refreshBtn").addEventListener("click", () => refresh(false));
$("#editBtn").addEventListener("click", () => { state.mode = "edit"; show("apply"); renderApply(); fillForm(); });
$("#completeBtn").addEventListener("click", () => { state.mode = "complete"; show("apply"); renderApply(); fillForm(); });
$("#pChatBtn").addEventListener("click", openChat);
$("#chatBtn").addEventListener("click", openChat);
$("#copyBtn").addEventListener("click", copySid);
$("#closeBtn").addEventListener("click", () => { if (window.liff && state.inClient) liff.closeWindow(); else window.close(); });
$("#tileEvents").addEventListener("click", () => go(CONFIG.REGISTER_LIFF_URL));
$("#tileClaims").addEventListener("click", () => go(CONFIG.REIMBURSE_LIFF_URL));
</script>
</body>
</html>
