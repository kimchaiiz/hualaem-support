<head>

<style>
:root{
  --bg:#E6ECF2; --slip:#FFFFFF; --field:#F3F6F9; --ink:#0E1726; --muted:#586477; --line:#D3DBE5;
  --accent:#2447D6; --accent-ink:#FFFFFF; --accent-soft:#E7ECFD; --err:#B42318; --err-bg:#FDECEA;
  --ok:#0F7A55; --ok-bg:#E3F4EC; --warn:#8A5A00; --warn-bg:#FFF3D1; --grey-bg:#EDF1F5;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  .seg button[aria-selected=true]{background:var(--line)}
  :root{
    --bg:#0C121B; --slip:#161F2C; --field:#0F1722; --ink:#E8EDF4; --muted:#9AA7B8; --line:#2A3647;
    --accent:#8AA2FF; --accent-ink:#0C121B; --accent-soft:#1E2A4A; --err:#FF9189; --err-bg:#3A1C1C;
    --ok:#5CD0A3; --ok-bg:#12302A; --warn:#F2C26B; --warn-bg:#33290F; --grey-bg:#1C2633;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai","Sarabun","Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5;
  padding:env(safe-area-inset-top,0) 0 calc(40px + env(safe-area-inset-bottom,0))}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;gap:12px;padding:18px 0 4px}
.avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;background:var(--accent-soft);color:var(--accent);flex:none;display:grid;place-items:center;font-weight:600;font-size:18px;border:2px solid var(--slip)}
.hello{flex:1;min-width:0}
.hello small{display:block;font-size:13px;color:var(--muted)}
.hello b{display:block;font-size:17px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lang{flex:none;min-width:48px;height:36px;border:1px solid var(--line);background:var(--slip);border-radius:18px;font-size:14px;font-weight:500;padding:0 12px;cursor:pointer}
.banner{margin:12px 0 0;padding:10px 12px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:14px}

/* summary */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:10px;margin-top:18px}
.stat{background:var(--slip);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;text-align:left;cursor:pointer;min-height:76px}
.stat b{display:block;font-size:24px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:13px;color:var(--muted);line-height:1.35}
.stat.hot b{color:var(--accent)}

/* sections */
.block{margin-top:26px}
.block>h2{font-size:18px;font-weight:600;margin:0 0 10px}
.seg{display:flex;gap:4px;background:var(--grey-bg);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{flex:1;min-height:40px;border:0;border-radius:9px;background:transparent;font-size:14.5px;font-weight:500;color:var(--muted);cursor:pointer;padding:0 8px}
.seg button[aria-selected=true]{background:var(--slip);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.list{display:flex;flex-direction:column;gap:10px}

/* event row */
.ev{display:grid;grid-template-columns:56px 1fr 16px;gap:12px;align-items:center;background:var(--slip);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;width:100%;cursor:pointer;min-height:76px}
.datebox{width:56px;height:60px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.datebox b{font-size:22px;font-weight:600}
.datebox span{font-size:12.5px;font-weight:500}
.ev .ename{font-size:16px;font-weight:600;line-height:1.35}
.meta{display:block;font-size:13.5px;color:var(--muted);margin-top:2px}
.go{color:var(--muted);font-size:20px}
.tag{display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:2px 10px;border-radius:13px;font-size:12.5px;font-weight:500;background:var(--grey-bg);color:var(--muted);margin-top:6px}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.info{background:var(--accent-soft);color:var(--accent)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.bad{background:var(--err-bg);color:var(--err)}

/* status rows */
.item{background:var(--slip);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;width:100%;display:block}
button.item{cursor:pointer}
.item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.item-top b{font-size:15.5px;font-weight:600;line-height:1.35}
.item-top .tag{margin-top:0;flex:none}
.amount{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:6px}
.steps{display:flex;align-items:center;margin-top:12px;font-size:12px;color:var(--muted)}
.steps .s{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none;width:64px;text-align:center;line-height:1.2}
.steps .dot{width:12px;height:12px;border-radius:50%;background:var(--line)}
.steps .s.done .dot{background:var(--ok)}
.steps .s.done{color:var(--ok)}
.steps .s.bad .dot{background:var(--err)}
.steps .s.bad{color:var(--err)}
.steps .ln{flex:1;height:2px;background:var(--line);margin:0 -14px 16px}
.steps .ln.done{background:var(--ok)}
.empty{background:var(--slip);border-radius:14px;padding:26px 18px;text-align:center;color:var(--muted);border:1px dashed var(--line);font-size:14.5px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:2px}
.more{font-size:13px;color:var(--muted);text-align:center;margin:8px 0 0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:16px;cursor:pointer;width:100%;margin-top:12px}
.btn.sec{background:transparent;color:var(--accent)}
.btn.top{margin:0 0 12px}
.hint{display:block;font-size:13px;color:var(--err);margin-top:8px}
.links{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:28px}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:500;font-size:15px;min-height:44px;padding:0 10px;cursor:pointer}
.asof{text-align:center;font-size:12.5px;color:var(--muted);margin-top:4px}

.skel{background:var(--slip);border-radius:14px;height:76px;border:1px solid var(--line);position:relative;overflow:hidden;margin-top:10px}
.skel.tall{height:110px;margin-top:18px}
.skel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:sh 1.2s infinite}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@media (prefers-reduced-motion:reduce){.skel::after{animation:none}}
.toast{position:fixed;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0));max-width:528px;margin:0 auto;background:var(--err-bg);color:var(--err);border:1px solid var(--err);padding:12px 14px;border-radius:12px;font-weight:500;font-size:14.5px;z-index:11}
.fatal{margin-top:20vh;text-align:center;color:var(--muted)}
.fatal b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <div class="avatar" id="avatarBox" aria-hidden="true"></div>
    <div class="hello"><small data-i18n="hello"></small><b id="lineName">&nbsp;</b></div>

    </section>

    <div class="links">
      <button type="button" class="linkbtn" id="memberBtn" data-i18n="myMembership"></button>

<div class="toast" id="toast" role="alert" hidden></div>

<script>
/* =====================================================================
   Settings. Shared IDs and addresses come from config.js (one file for all pages). Only page-specific settings live here.
   ===================================================================== */
/* Shared settings come from config.js (one file for all pages, see config.example.js). Missing or broken file = demo mode. */
const SHARED = window.COMMUNITY_CONFIG || {}, SHARED_LIFF = SHARED.LIFF || {};
if (!window.COMMUNITY_CONFIG) console.warn("config.js not found or has an error: running in demo mode");
const cfgText = x => { x = typeof x === "string" ? x.trim() : ""; return /^YOUR-/i.test(x) ? "" : x; };
const cfgLiffId = x => cfgText(x).replace(/^https?:\/\/liff\.line\.me\//i, "").replace(/[\/?#].*$/, "");
const cfgLiffUrl = x => { const id = cfgLiffId(x); return id ? "https://liff.line.me/" + id : ""; };
const CONFIG = {
  LIFF_ID: cfgLiffId(SHARED_LIFF.home),                  // HOME LIFF (this page)
  API_URL: cfgText(SHARED.API_URL),
  EVENT_JOIN_LIFF_URL: cfgLiffUrl(SHARED_LIFF.event),    // event-join.html
  REIMBURSE_LIFF_URL: cfgLiffUrl(SHARED_LIFF.reimburse), // expense-reimbursement.html
  JOIN_LIFF_URL: cfgLiffUrl(SHARED_LIFF.join),           // sign-up.html. People who are not approved members are sent here
  DEFAULT_LANG: "th"
};

/* =====================================================================
   Text
   ===================================================================== */
const T = {
 th:{
  hello:"สวัสดี", langBtn:"EN", demo:"โหมดทดลอง: ข้อมูลตัวอย่าง ดูแบบอื่นได้โดยเติม ?demo=organizer หรือ ?demo=new ท้ายลิงก์",

  regOpen:"เปิดรับสมัคร · ปิด {d}", regUpcoming:"เปิดรับสมัคร {d}", regClosed:"ปิดรับสมัครแล้ว", registered:"✓ ลงทะเบียนแล้ว",
  emptyUpT:"ยังไม่มีกิจกรรมที่กำลังจะมาถึง", emptyUpD:"เมื่อมีกิจกรรมใหม่ จะแสดงที่นี่",
  emptyTodoT:"ลงทะเบียนครบทุกกิจกรรมแล้ว", emptyTodoD:"ดูรายละเอียดได้ในแท็บ “ทั้งหมด”",
  statusT:"ติดตามสถานะ", segEvents:"กิจกรรมของฉัน", segClaims:"คำขอเบิก",
  stUpcoming:"กำลังจะมาถึง", stEnded:"จบแล้ว", stCancelled:"ยกเลิกแล้ว",

  stepSent:"ส่งคำขอ", stepApproved:"อนุมัติ", stepPaid:"โอนเงิน", stepRejected:"ไม่อนุมัติ",
  rejectedHint:"ติดต่อผู้อนุมัติทางแชทนี้เพื่อสอบถามเหตุผล",
  refL:"เลขอ้างอิง {ref}", sentL:"ส่งเมื่อ {d}", itemsL:"{n} รายการ",
  emptyEvT:"ยังไม่เคยลงทะเบียนกิจกรรม", emptyEvD:"เลือกกิจกรรมด้านบนเพื่อลงทะเบียน",
  emptyClT:"ยังไม่มีคำขอเบิก", emptyClD:"คำขอเบิกค่าใช้จ่ายที่คุณส่งจะแสดงที่นี่",
  moreN:"แสดง {n} รายการล่าสุด",
  newClaim:"ขอเบิกค่าใช้จ่าย", myMembership:"บัตรสมาชิกของฉัน", refresh:"รีเฟรช", asOf:"ข้อมูล ณ {d}",
  noLink:"เมนูนี้ยังไม่ได้ตั้งค่า แจ้งผู้ดูแล",
  errAuth:"การเชื่อมต่อ LINE หมดอายุ ปิดหน้านี้แล้วเปิดใหม่จากแชท", errRate:"เปิดบ่อยเกินไป รอสักครู่แล้วลองใหม่",
  errNet:"โหลดไม่สำเร็จ ลองอีกครั้ง", errLoad:"โหลดข้อมูลไม่สำเร็จ", errLoadD:"ปิดหน้านี้แล้วเปิดใหม่จาก LINE", liffFail:"เชื่อมต่อ LINE ไม่สำเร็จ",
  notMemberT:"ต้องเป็นสมาชิกก่อน", notMemberD:"สมัครสมาชิกและรอผู้ดูแลอนุมัติ แล้วกลับมาที่หน้านี้"
 },
 en:{
  hello:"Hello", langBtn:"ไทย", demo:"Demo mode: sample data. Add ?demo=organizer or ?demo=new to the address to see other versions.",
  sTodo:"Events you haven't registered for", sMine:"Events you're registered for", sClaims:"Claims in progress",
  upcomingT:"Upcoming events", segAll:"All ({n})", segTodo:"Not registered ({n})",
  regOpen:"Open · closes {d}", regUpcoming:"Opens {d}", regClosed:"Registration closed", registered:"✓ Registered",
  emptyUpT:"No upcoming events", emptyUpD:"New events will show up here.",
  emptyTodoT:"You're registered for every event", emptyTodoD:"See them all in the “All” tab.",
  statusT:"Track status", segEvents:"My events", segClaims:"My claims",
  stUpcoming:"Upcoming", stEnded:"Ended", stCancelled:"Cancelled",
  cPending:"Waiting for approval", cApproved:"Approved, payment pending", cRejected:"Not approved", cPaid:"Paid",
  stepSent:"Sent", stepApproved:"Approved", stepPaid:"Paid", stepRejected:"Not approved",
  rejectedHint:"Message the approvers in this chat to ask why.",
  refL:"Reference {ref}", sentL:"Sent {d}", itemsL:"{n} items",
  emptyEvT:"No registrations yet", emptyEvD:"Pick an event above to register.",
  emptyClT:"No claims yet", emptyClD:"Expense claims you send will show up here.",
  moreN:"Showing your latest {n}",
  newClaim:"New expense claim", myMembership:"My membership", refresh:"Refresh", asOf:"Updated {d}",
  noLink:"This menu isn't set up yet. Tell an admin.",
  errAuth:"Your LINE session expired. Close this page and open it again from the chat.", errRate:"Too many tries. Wait a moment and try again.",
  errNet:"Couldn't load. Try again.", errLoad:"Couldn't load your page", errLoadD:"Close this page and open it again from LINE.", liffFail:"Couldn't connect to LINE.",
  notMemberT:"Members only", notMemberD:"Join the community and wait for an admin to approve you, then come back here."
 }
};

/* =====================================================================
   Helpers
   ===================================================================== */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const store = { get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };
let lang = CONFIG.DEFAULT_LANG;
const t = (k, v) => { let s = (T[lang] && T[lang][k]) ?? T.en[k] ?? k; if (v) for (const [a,b] of Object.entries(v)) s = s.split("{"+a+"}").join(b); return s; };
function h(tag, attrs, ...kids){                     // builds elements; text is always set as text, never as HTML
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs || {})){
    if (v == null || v === false) continue;
    if (k === "class") el.className = v; else if (k === "text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v === true ? "" : v);
  }
  kids.flat().forEach(c => { if (c != null && c !== false) el.append(c instanceof Node ? c : document.createTextNode(String(c))); });
  return el;
}
const loc = () => lang === "th" ? "th-TH" : "en-GB";
function fmtDate(d, o){ if (!d) return ""; return new Intl.DateTimeFormat(loc(), Object.assign({weekday:"short",day:"numeric",month:"short",year:"numeric",timeZone:"UTC"}, o||{})).format(new Date(d.slice(0,10)+"T00:00:00Z")); }
const fmtDT = s => s ? fmtDate(s, {weekday:undefined}) + " " + s.slice(11,16) : "";
const fmtTime = ev => ev.startTime ? ev.startTime + (ev.endTime ? "–" + ev.endTime : "") : "";
const money = n => "฿" + new Intl.NumberFormat("en-US", {minimumFractionDigits:2, maximumFractionDigits:2}).format(Number(n) || 0);
let toastT;
function toast(msg){ const el = $("#toast"); el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 5000); }

/* =====================================================================
   State
   ===================================================================== */
const params = new URLSearchParams(location.search);
const demo = !CONFIG.API_URL, demoMode = params.get("demo") || "participant";
const state = { token:null, inClient:false, name:"", picture:"", data:null, view:"loading", upTab:"all", stTab:"events" };

function applyLang(){
  document.documentElement.lang = lang;
  $$("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  $("#langBtn").textContent = t("langBtn");
  if (state.view === "home") renderHome();
}
function show(view){
  state.view = view;
  $("#vLoading").hidden = view !== "loading"; $("#vHome").hidden = view !== "home"; $("#vFatal").hidden = view !== "fatal";
}
function fatal(title, detail){ $("#fatalT").textContent = title; $("#fatalD").textContent = detail || ""; show("fatal"); }
function go(url){ if (!url){ toast(t("noLink")); return; } location.href = url; }
function eventUrl(id){ return CONFIG.EVENT_JOIN_LIFF_URL ? CONFIG.EVENT_JOIN_LIFF_URL.replace(/\/$/, "") + "?event=" + encodeURIComponent(id) : ""; }

/* =====================================================================
   API (the LINE ID token travels in the body; Code.gs checks it with LINE and decides who you are)
   ===================================================================== */
class ApiError extends Error { constructor(m, c){ super(m); this.code = c; } }
function goJoin(){
  if (CONFIG.JOIN_LIFF_URL){ location.replace(CONFIG.JOIN_LIFF_URL); return; }
  fatal(t("notMemberT"), t("notMemberD"));
}
async function post(action, data){
  if (demo) return demoApi(action);
  let res;
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 60000);
  try{
    const r = await fetch(CONFIG.API_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify(Object.assign({}, data, {action, lineIdToken:state.token})), signal:ctl.signal});
    res = await r.json();
  }catch(e){ throw new ApiError(t("errNet"), "NET"); }
  finally{ clearTimeout(to); }
  if (res.ok) return res;
  const map = {AUTH:"errAuth", RATE:"errRate", SERVER:"errNet"};
  throw new ApiError(map[res.code] ? t(map[res.code]) : res.error, res.code);
}

/* =====================================================================
   Render
   ===================================================================== */
function setSeg(btns, active){ btns.forEach(([el, on]) => el.setAttribute("aria-selected", on ? "true" : "false")); }
function renderHome(){
  const d = state.data; if (!d) return;
  const todo = d.upcoming.filter(e => !e.myReference);
  const mine = d.myEvents.filter(e => e.status === "upcoming");
  const openClaims = d.myClaims.filter(c => c.status === "Pending" || c.status === "Approved");
  const showClaims = d.canClaim || d.myClaims.length > 0;

  const stat = (n, label, hot, onclick) => h("button",{type:"button",class:"stat" + (hot ? " hot" : ""),onclick}, h("b",{text:String(n)}), h("span",{text:label}));
  $("#stats").replaceChildren(...[
    stat(todo.length, t("sTodo"), todo.length > 0, () => { state.upTab = "todo"; renderHome(); $("#secUpcoming").scrollIntoView({behavior:"smooth"}); }),
    stat(mine.length, t("sMine"), false, () => { state.stTab = "events"; renderHome(); $("#secStatus").scrollIntoView({behavior:"smooth"}); }),
    showClaims ? stat(openClaims.length, t("sClaims"), false, () => { state.stTab = "claims"; renderHome(); $("#secStatus").scrollIntoView({behavior:"smooth"}); }) : null
  ].filter(Boolean));

  // upcoming
  $("#upAll").textContent = t("segAll", {n:d.upcoming.length}); $("#upTodo").textContent = t("segTodo", {n:todo.length});
  setSeg([[$("#upAll"), state.upTab === "all"], [$("#upTodo"), state.upTab === "todo"]]);
  const list = state.upTab === "todo" ? todo : d.upcoming;
  $("#upList").replaceChildren(...(list.length ? list.map(evRow) :
    [state.upTab === "todo" && d.upcoming.length ? empty("emptyTodoT","emptyTodoD") : empty("emptyUpT","emptyUpD")]));

  // status
  if (!showClaims) state.stTab = "events";
  $("#stSeg").hidden = !showClaims;
  $("#stEvents").textContent = t("segEvents"); $("#stClaims").textContent = t("segClaims");
  setSeg([[$("#stEvents"), state.stTab === "events"], [$("#stClaims"), state.stTab === "claims"]]);
  const rows = state.stTab === "claims" ? d.myClaims : d.myEvents;
  $("#stList").replaceChildren(...(rows.length ? rows.map(state.stTab === "claims" ? claimRow : myEventRow) :
    [state.stTab === "claims" ? empty("emptyClT","emptyClD") : empty("emptyEvT","emptyEvD")]));
  $("#stMore").hidden = rows.length < 20; $("#stMore").textContent = t("moreN", {n:rows.length});
  $("#newClaimBtn").hidden = !(d.canClaim && state.stTab === "claims");
  $("#asOf").textContent = t("asOf", {d:fmtDT(d.now)});
}
function empty(tk, dk){ return h("div",{class:"empty"}, h("b",{text:t(tk)}), t(dk)); }
function dateBox(date){
  const x = new Date(date.slice(0,10) + "T00:00:00Z");
  return h("div",{class:"datebox","aria-hidden":"true"},
    h("b",{text:String(x.getUTCDate())}), h("span",{text:new Intl.DateTimeFormat(loc(), {month:"short",timeZone:"UTC"}).format(x)}));
}
function evTag(ev){
  if (ev.myReference) return h("span",{class:"tag ok",text:t("registered")});
  if (ev.regState === "open") return h("span",{class:"tag info",text:t("regOpen",{d:fmtDT(ev.regClose)})});
  if (ev.regState === "upcoming") return h("span",{class:"tag warn",text:t("regUpcoming",{d:fmtDT(ev.regOpen)})});
  return h("span",{class:"tag",text:t("regClosed")});
}
function evRow(ev){
  const when = [fmtDate(ev.date, {year:undefined}), fmtTime(ev)].filter(Boolean).join(" · ");
  return h("button",{type:"button",class:"ev","data-event":ev.id,onclick:() => go(eventUrl(ev.id))},
    dateBox(ev.date),
    h("div",{}, h("div",{class:"ename",text:ev.name}), h("span",{class:"meta",text:when}), ev.location ? h("span",{class:"meta",text:"📍 " + ev.location}) : null, evTag(ev)),
    h("span",{class:"go","aria-hidden":"true",text:"›"}));
}
function myEventRow(r){
  const tag = {upcoming:["tag info","stUpcoming"], ended:["tag","stEnded"], cancelled:["tag bad","stCancelled"]}[r.status] || ["tag",""];
  const when = [fmtDate(r.date), fmtTime(r)].filter(Boolean).join(" · ");
  const body = [h("div",{class:"item-top"}, h("b",{text:r.eventName}), h("span",{class:tag[0],text:t(tag[1])})),
    when ? h("span",{class:"meta",text:when}) : null, r.location ? h("span",{class:"meta",text:"📍 " + r.location}) : null,
    h("span",{class:"meta",text:t("refL",{ref:r.reference})})];
  return r.status === "upcoming"
    ? h("button",{type:"button",class:"item","data-ref":r.reference,onclick:() => go(eventUrl(r.eventId))}, ...body)
    : h("div",{class:"item","data-ref":r.reference}, ...body);
}
function claimRow(c){
  const cls = {Pending:"tag warn", Approved:"tag info", Rejected:"tag bad", Paid:"tag ok"}[c.status] || "tag";
  const reached = {Pending:1, Approved:2, Paid:3, Rejected:1}[c.status] || 1;
  const step = (i, key, bad) => h("div",{class:"s" + (bad ? " bad" : i <= reached ? " done" : "")}, h("span",{class:"dot"}), t(key));
  const line = i => h("span",{class:"ln" + (c.status !== "Rejected" && i < reached ? " done" : "")});
  const steps = c.status === "Rejected"
    ? h("div",{class:"steps","aria-hidden":"true"}, step(1,"stepSent"), line(1), step(2,"stepRejected",true))
    : h("div",{class:"steps","aria-hidden":"true"}, step(1,"stepSent"), line(1), step(2,"stepApproved"), line(2), step(3,"stepPaid"));
  return h("div",{class:"item","data-ref":c.reference},
    h("div",{class:"item-top"}, h("b",{text:c.eventName}), h("span",{class:cls,text:t("c" + c.status)})),
    h("div",{class:"amount",text:money(c.total)}),
    h("span",{class:"meta",text:t("itemsL",{n:c.items}) + " · " + t("sentL",{d:fmtDT(c.submittedAt)})}),
    h("span",{class:"meta",text:t("refL",{ref:c.reference})}),
    steps,
    c.status === "Rejected" ? h("span",{class:"hint",text:t("rejectedHint")}) : null);
}

/* =====================================================================
   Header (LINE picture + name)
   ===================================================================== */
function renderHeader(){
  $("#lineName").textContent = state.name || " ";
  const box = $("#avatarBox");
  if (state.picture && /^https:\/\/[a-z0-9.-]+\.line-scdn\.net\//i.test(state.picture)){
    const img = h("img",{class:"avatar",alt:"",src:state.picture + "/small",referrerpolicy:"no-referrer"});
    img.onerror = () => { img.replaceWith(initials()); };
    box.replaceWith(img); img.id = "avatarBox";
  } else box.textContent = (state.name || "?").trim().charAt(0).toUpperCase();
  function initials(){ const d = h("div",{class:"avatar",id:"avatarBox","aria-hidden":"true"}); d.textContent = (state.name || "?").trim().charAt(0).toUpperCase(); return d; }
}

/* =====================================================================
   Boot
   ===================================================================== */
async function initLiff(){
  if (demo || !CONFIG.LIFF_ID || !window.liff){ state.name = "Kim (demo)"; return true; }
  await liff.init({liffId:CONFIG.LIFF_ID});
  if (!liff.isLoggedIn()){ liff.login({redirectUri:location.href}); return false; }
  state.inClient = liff.isInClient();
  state.token = liff.getIDToken();        // LINE ID token (needs the openid scope); Code.gs checks it with LINE
  try{ const p = await liff.getProfile(); state.name = p.displayName || ""; state.picture = p.pictureUrl || ""; }catch(e){}
  if (!store.get("home.lang")){ const l = (liff.getLanguage && liff.getLanguage() || "").toLowerCase(); if (l) lang = l.startsWith("th") ? "th" : "en"; }
  return true;
}
async function load(){
  try{
    state.data = await post("home.bootstrap");
  }catch(e){
    if (e.code === "NOT_MEMBER"){ goJoin(); return; }        // sign-up.html shows sign-up, "waiting for review" or "not approved"
    if (state.data){ toast(e.message); return; }              // a refresh failed: keep what is on screen
    fatal(t("errLoad"), e.code === "AUTH" ? t("errAuth") : e.code === "RATE" ? t("errRate") : t("errLoadD")); return;
  }
  show("home"); renderHome();
}
(async function boot(){
  const saved = store.get("home.lang"); if (saved) lang = saved;
  applyLang();
  $("#demoBanner").hidden = !demo;
  try{ if (!(await initLiff())) return; }
  catch(e){ console.error(e); applyLang(); fatal(t("liffFail"), t("errLoadD")); return; }
  applyLang(); renderHeader();
  await load();
})();

$("#langBtn").addEventListener("click", () => { lang = lang === "th" ? "en" : "th"; store.set("home.lang", lang); applyLang(); });
$("#upAll").addEventListener("click", () => { state.upTab = "all"; renderHome(); });
$("#upTodo").addEventListener("click", () => { state.upTab = "todo"; renderHome(); });
$("#stEvents").addEventListener("click", () => { state.stTab = "events"; renderHome(); });
$("#stClaims").addEventListener("click", () => { state.stTab = "claims"; renderHome(); });
$("#newClaimBtn").addEventListener("click", () => go(CONFIG.REIMBURSE_LIFF_URL));
$("#memberBtn").addEventListener("click", () => go(CONFIG.JOIN_LIFF_URL));
$("#refreshBtn").addEventListener("click", load);
</script>
