:"Ended","stDraft":"Draft","stClosed":"Closed","manageT":"Manage event","segTeam":"Collaborators {n}","eventPage":"View event page","you":"(you)","leadLine":"Organizer · adds and removes collaborators","collabLine":"Collaborator · edits the event, checks in, adds expenses","noLead":"No organizer yet. An admin can choose one in the admin website.","removeAria":"Remove {name} from collaborators","addT":"Add a collaborator","addInvite":"Send an invite link in LINE (works once)","addSearch":"Search members by name","addPeople":"Choose from registered participants","openInvites":"Cancel unused invite links ({n})","collabNote":"Only this event's organizer can add or remove collaborators.","closedNote":"This event is closed: nobody new can join the team (you can still remove collaborators).","fullNote":"This team already has {n} collaborators.","notTeamT":"You're not on this event's team","notTeamD":"Ask the event's organizer to send you an invite link.","notFoundT":"Event not found","notFoundD":"It may have been deleted.","toList":"See events I manage","inviteT":"Collaborator invite link","inviteD":"This link works for one person and expires {d}. They must be an approved member.","inviteMsg":"Help me organize \"{event}\". Tap this link in LINE (it works once).","inviteSend":"Send in LINE","inviteCopy":"Copy link","linkLabel":"Invite link","copied":"Link copied","copyFail":"Couldn't copy. Press and hold the link to copy it yourself.","making":"Creating the link…","cancelInvT":"Cancel invite links?","cancelInvD":"The {n} link(s) sent but not used yet will stop working.","cancelInvBtn":"Cancel links","cancelledN":"Cancelled {n} link(s)","searchT":"Search members","searchLabel":"Name or nickname","searchPh":"Type at least 2 letters","searchHint":"Shows only the name and nickname of approved members.","searching":"Searching…","searchNone":"No member with this name","searchMore":"More than {n} found: type more of the name.","peopleT":"Choose from registered participants","peopleEmpty":"No members have registered for this event yet.","loading":"Loading…","addBtn":"Add","addAria":"Add {name} as a collaborator","onTeam":"On the team","addedToast":"{name} is now a collaborator","removeT":"Remove {name} from the team?","removeD":"{name} will no longer be able to manage this event (edit, check in, add expenses). You can add them back later.","removeBtn":"Remove from team","removedToast":"{name} was removed from the team","busy":"Sending…","joinT":"Invitation","joinLead":"{name} invited you to help organize this event","joinLeadNone":"You're invited to help organize this event","joinCan":"What collaborators can do","joinCan1":"Edit the event details","joinCan2":"See participants and check people in","joinCan3":"Add the event's expenses","joinPdpa":"Collaborators see participants' names. Use them for this event only.","joinExpires":"Link expires {d}","joinBtn":"Accept invitation","joining":"Joining…","joinedT":"You're on the team","joinedD":"Open Manage from here, or later from Events I manage.","alreadyT":"You're already on this event's team","goManage":"Open Manage","usedT":"This link has already been used","expiredT":"This link has expired","cancelledT":"This link was cancelled","closedT":"This event is closed","askNew":"Ask the organizer for a new link (each invite link works once).","invalidT":"This invite link isn't valid","invalidD":"Check that the whole link was opened, or ask the organizer for a new one.","goHome":"Back to Home","errForbidden":"You can't do this for this event.","errClosed":"This event is closed: its team can't change.","errLimit":"The limit is reached. Cancel old links or remove a collaborator first.","errGone":"This is no longer there. Try reloading."}}, function (App, t) {
// Manage › Collaborators in the LINE app (event-team). Runs inside its own function: App (the shell) and t (this feature's text).
// Routes:  #manage                 events I organize or help with (team.mine; saved copy on the phone = event names and my role)
//          #manage/<eventId>       the team of one event (team.manage; never saved on the phone: it holds other people's names)
//          #team-join/<token>      accept a one-time invite link (team.invitePreview, team.acceptInvite)
// Links from outside the app: ?teamjoin=<token> (the invite link) and ?manage=1 or ?manage=<eventId> (rich menu, Home, Events)
// open these routes. Who may do what is decided on the server on every request; the page only hides buttons.
const $ = App.$, h = App.h, F = App.fmt;
const cfg = App.config;
const S = { eventId: "", data: null, panel: "", joinToken: "", join: null, joinState: "", joinErr: "" };

/* ---------- small icons this screen needs (24 px stroke, DESIGN.md); the shell has the others ---------- */
const PATHS = {
  link: ["M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1", "M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"],
  search: ["M11 17.5a6.5 6.5 0 1 0 0-13 6.5 6.5 0 0 0 0 13z", "m20 20-4.2-4.2"],
  userPlus: ["M9 11.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z", "M2.5 20c.8-3.4 3.4-5.5 6.5-5.5s5.7 2.1 6.5 5.5", "M19 8v6M16 11h6"],
  copy: ["M9 9h11v11H9z", "M5 15H4V4h11v1"],
  users: ["M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z", "M2.5 20c.8-3.4 3.4-5.5 6.5-5.5s5.7 2.1 6.5 5.5", "M16 4.5a3.5 3.5 0 0 1 0 6.5M18 14.8c1.8.7 3 2.5 3.5 5.2"]
};
function ico(name, cls){
  const NS = "http://www.w3.org/2000/svg", svg = document.createElementNS(NS, "svg");
  [["viewBox", "0 0 24 24"], ["fill", "none"], ["stroke", "currentColor"], ["stroke-width", "1.75"], ["stroke-linecap", "round"], ["stroke-linejoin", "round"], ["aria-hidden", "true"]]
    .forEach(([k, v]) => svg.setAttribute(k, v));
  if (cls) svg.setAttribute("class", cls);
  (PATHS[name] || []).forEach(d => { const p = document.createElementNS(NS, "path"); p.setAttribute("d", d); svg.append(p); });
  return svg;
}

/* ---------- helpers ---------- */
const chip = (cls, ic, text) => h("span", {class: "chip " + cls}, ic ? App.icon(ic) : null, text);
const when = ev => [F.date(ev.date), F.time(ev)].filter(Boolean).join(" · ");
const initial = p => (String(p.nickname || p.name || "?").replace(/^(พี่|น้อง)\s*/, "").trim().charAt(0) || "?").toUpperCase();   // "พี่เมฆ" -> "ม"
const label = p => p.name + (p.nickname ? " (" + p.nickname + ")" : "") + (p.isMe ? " " + t("you") : "");
function errText(e){
  const k = {FORBIDDEN: "errForbidden", CLOSED: "errClosed", LIMIT: "errLimit", NOT_FOUND: "errGone"}[e && e.code];
  return k ? t(k) : (e && e.message) || App.t("errNet");
}
function busyBtn(btn, on, text){ if (!btn) return; btn.disabled = on; if (text != null) btn.textContent = text; }
function eventPageUrl(id){ return cfg.EVENT_JOIN_LIFF_URL ? cfg.EVENT_JOIN_LIFF_URL + "?event=" + encodeURIComponent(id) : ""; }
function inviteUrl(token){
  const base = cfg.LIFF_ID ? "https://liff.line.me/" + cfg.LIFF_ID : location.origin + location.pathname;
  return base + "?teamjoin=" + encodeURIComponent(token);
}
function statusChip(ev){
  if (ev.status === "Draft") return chip("warn", "clock", t("stDraft"));
  if (ev.status === "Closed") return chip("", "x", t("stClosed"));
  return null;
}

/* ---------- #manage: events I manage ---------- */
const listView = App.view({
  key: "event-team.mine", action: "team.mine", cache: true, el: $("#event-team-events"),
  skeleton(){ $("#event-team-events").replaceChildren(App.skeleton([104, 104])); },
  render(d){
    const evs = d.events || [];
    $("#event-team-listIntro").textContent = t("listIntro");
    $("#event-team-events").replaceChildren(...(evs.length ? evs.map(evCard) : [App.emptyState(t("listEmptyT"), t("listEmptyD"))]));
  }
});
function evCard(ev){
  return h("button", {type: "button", class: "card event-team-ev", "data-event": ev.id, onclick: () => App.go("manage", ev.id)},
    h("span", {class: "event-team-when", text: when(ev)}),
    h("span", {class: "event-team-name", text: ev.name}),
    ev.location ? h("span", {class: "event-team-meta"}, App.icon("pin"), h("span", {text: ev.location})) : null,
    h("span", {class: "event-team-chips"},
      ev.myRole === "lead" ? chip("info", "check", t("roleLead")) : chip("", null, t("roleCollab")),
      chip("", null, t("teamN", {n: ev.teamCount})),
      ev.past ? chip("", "check", t("ended")) : statusChip(ev)));
}

/* ---------- #manage/<eventId>: Manage › Collaborators ---------- */
const manageView = App.view({
  key: "event-team.manage", action: "team.manage", cache: false, el: $("#event-team-people"),
  body: () => ({eventId: S.eventId}),
  skeleton(){
    $("#event-team-head").replaceChildren(App.skeleton([104]));
    $("#event-team-seg").hidden = true; $("#event-team-otherPanel").hidden = true; $("#event-team-teamPanel").hidden = false;
    $("#event-team-people").replaceChildren(App.skeleton([64, 64])); $("#event-team-add").replaceChildren();
  },
  render(d){
    if (d.event && d.event.id !== S.eventId){ setTimeout(() => manageView.refresh(), 0); return; }   // an answer for the event before
    S.data = d; renderManage();
  },
  onError(e){
    if (e.code !== "FORBIDDEN" && e.code !== "NOT_FOUND") return false;
    S.data = null; App.setTitle();
    $("#event-team-head").replaceChildren(); $("#event-team-seg").hidden = true; $("#event-team-add").replaceChildren();
    $("#event-team-people").replaceChildren(App.emptyState(t(e.code === "FORBIDDEN" ? "notTeamT" : "notFoundT"), t(e.code === "FORBIDDEN" ? "notTeamD" : "notFoundD"),
      {text: t("toList"), onclick: () => App.go("manage")}));
    return true;
  }
});
// Other features (registration: Participants, reimbursement: Expenses) can add a segment here once the shell offers
// App.addPanel / App.panelsFor (core request in FEATURE.md). Until then the screen shows the team only.
function panels(){
  const ctx = {eventId: S.eventId, event: S.data.event, myRole: S.data.myRole};
  const others = typeof App.panelsFor === "function" ? (App.panelsFor("manage") || []) : [];
  return others.map(p => ({key: p.name, order: p.order || 50, label: () => (p.label ? p.label(ctx) : p.name), mount: el => p.mount(el, ctx)}))
    .concat([{key: "team", order: 20, label: () => t("segTeam", {n: S.data.team.length})}])
    .sort((a, b) => a.order - b.order);
}
function renderManage(){
  const d = S.data; if (!d) return;
  App.setTitle();
  const ev = d.event;
  $("#event-team-head").replaceChildren(h("div", {class: "card event-team-headcard"},
    h("span", {class: "event-team-when", text: when(ev)}),
    ev.location ? h("span", {class: "event-team-meta"}, App.icon("pin"), h("span", {text: ev.location})) : null,
    h("span", {class: "event-team-headrow"},
      d.myRole === "lead" ? chip("info", "check", t("roleLead")) : chip("", null, t("roleCollab")), statusChip(ev),
      h("button", {type: "button", class: "btn quiet event-team-link", id: "event-team-eventPage", onclick: () => App.open("event", ev.id, eventPageUrl(ev.id)), text: t("eventPage")}))));

  const tabs = panels();
  if (!tabs.some(x => x.key === S.panel)) S.panel = tabs[0].key;
  const seg = $("#event-team-seg");
  seg.hidden = tabs.length < 2;
  seg.setAttribute("aria-label", t("manageT"));
  seg.replaceChildren(...tabs.map(x => h("button", {type: "button", role: "tab", "aria-selected": x.key === S.panel ? "true" : "false", "data-panel": x.key,
    onclick: () => { S.panel = x.key; renderManage(); }, text: x.label()})));
  const mine = S.panel === "team";
  $("#event-team-teamPanel").hidden = !mine; $("#event-team-otherPanel").hidden = mine;
  if (!mine){ const other = tabs.find(x => x.key === S.panel); other.mount($("#event-team-otherPanel")); return; }
  renderTeam(d);
}
function renderTeam(d){
  const people = d.team.map(p => h("div", {class: "card event-team-person", "data-ref": p.ref, "data-role": p.role},
    h("span", {class: "event-team-av" + (p.role === "lead" ? " event-team-lead" : ""), "aria-hidden": "true", text: initial(p)}),
    h("span", {class: "event-team-who"}, h("b", {text: label(p)}), h("span", {text: p.role === "lead" ? t("leadLine") : t("collabLine")})),
    d.canRemove && p.role === "collaborator"
      ? h("button", {type: "button", class: "icon-btn event-team-x", "aria-label": t("removeAria", {name: p.name}), onclick: () => askRemove(p)}, App.icon("x"))
      : null));
  if (!d.team.some(p => p.role === "lead")) people.unshift(h("div", {class: "banner"}, App.icon("alert"), h("span", {text: t("noLead")})));
  $("#event-team-people").replaceChildren(...people);

  const add = [];
  const collaborators = d.team.filter(p => p.role === "collaborator").length;
  if (d.canEdit && collaborators < d.max){
    const row = (icn, text, id, onclick) => h("button", {type: "button", class: "row event-team-addrow", id, onclick},
      ico(icn, "lead"), h("span", {class: "grow", text}), App.icon("chevron", "chev"));
    add.push(h("h2", {class: "event-team-h2", text: t("addT")}),
      h("div", {class: "rows"},
        row("link", t("addInvite"), "event-team-addInvite", e => makeInvite(e.currentTarget)),
        d.canSearch ? row("search", t("addSearch"), "event-team-addSearch", openSearch) : null,
        row("userPlus", t("addPeople"), "event-team-addPeople", openPeople)));
  } else if (d.canEdit) add.push(h("p", {class: "event-team-note", text: t("fullNote", {n: d.max})}));
  if (d.myRole === "lead" && d.openInvites > 0) {
    add.push(h("button", {type: "button", class: "btn quiet", id: "event-team-cancelInv", style: "margin-top:8px", onclick: askCancelInvites, text: t("openInvites", {n: d.openInvites})}));
  }
  if (d.myRole === "lead" && !d.editable) add.push(h("p", {class: "event-team-note", text: t("closedNote")}));
  if (d.myRole !== "lead") add.push(h("p", {class: "event-team-note", text: t("collabNote")}));
  $("#event-team-add").replaceChildren(...add);
}
function afterChange(r){ S.data = r; renderManage(); }

/* invite link: made on the server (one time, expires), shared through LINE's share screen or copied */
let making = false;
async function makeInvite(btn){
  if (making) return;
  making = true; const old = btn.lastChild ? btn.querySelector(".grow").textContent : "";
  btn.disabled = true; btn.querySelector(".grow").textContent = t("making");
  try{
    const r = await App.api("team.invite", {eventId: S.eventId});
    showInvite(r);
    if (S.data){ S.data.openInvites = (S.data.openInvites || 0) + 1; renderTeam(S.data); }
  }catch(e){ App.toast(errText(e)); if (e.code === "FORBIDDEN" || e.code === "CLOSED") manageView.refresh(); }
  finally{ making = false; btn.disabled = false; if (btn.isConnected) btn.querySelector(".grow").textContent = old; }
}
function showInvite(r){
  const url = inviteUrl(r.token);

  const input = h("input", {class: "event-team-input", id: "event-team-linkInput", type: "text", readonly: true, value: url, onfocus: e => e.target.select()});
  App.sheet(t("inviteT"),
    h("p", {text: t("inviteD", {d: F.dateTime(r.expiresAt)})}),
    h("label", {class: "event-team-lbl", for: "event-team-linkInput", text: t("linkLabel")}), input,

      h("button", {type: "button", class: "btn", id: "event-team-sendLine", onclick: () => App.openExternal("https://line.me/R/share?text=" + encodeURIComponent(text))}, App.icon("chat"), t("inviteSend")),
      h("button", {type: "button", class: "btn secondary", id: "event-team-copy", onclick: () => copyLink(url, input)}, ico("copy"), t("inviteCopy"))));

async function copyLink(url, input){
  try{ await navigator.clipboard.writeText(url); App.toast(t("copied")); return; }catch(e){}
  try{ input.focus(); input.select(); if (document.execCommand && document.execCommand("copy")){ App.toast(t("copied")); return; } }catch(e){}
  App.toast(t("copyFail"));
}

/* search by name (lead who is an organizer or approver) and promote from participants */
function resultRow(x, via){
  const name = x.name + (x.nickname ? " (" + x.nickname + ")" : "");
  const done = () => chip("ok", "check", t("onTeam"));
  const btn = x.onTeam ? done() : h("button", {type: "button", class: "btn secondary", "aria-label": t("addAria", {name}), text: t("addBtn"), onclick: async e => {
    const b = e.currentTarget; busyBtn(b, true, t("busy"));
    try{
      const r = await App.api("team.add", {eventId: S.eventId, ref: x.ref, via});
      x.onTeam = true; b.replaceWith(done()); afterChange(r);
      App.toast(t("addedToast", {name: r.added || x.name}));
    }catch(err){ busyBtn(b, false, t("addBtn")); App.toast(errText(err)); }
  }});
  return h("div", {class: "event-team-result", "data-ref": x.ref},
    h("span", {class: "event-team-av", "aria-hidden": "true", text: initial(x)}),
    h("span", {class: "event-team-who"}, h("b", {text: name})), btn);
}
const note = text => h("p", {class: "event-team-note", text});
function openSearch(){
  const input = h("input", {class: "event-team-input", id: "event-team-q", type: "search", autocomplete: "off", enterkeyhint: "search", placeholder: t("searchPh")});
  const out = h("div", {class: "event-team-sheetlist", id: "event-team-results", "aria-live": "polite"});
  let timer = 0, seq = 0;
  async function run(){
    const q = input.value.trim(), my = ++seq;
    if (q.length < 2){ out.replaceChildren(); return; }
    out.replaceChildren(note(t("searching")));
    try{
      const r = await App.api("team.search", {eventId: S.eventId, q});
      if (my !== seq) return;
      const rows = r.results.length ? r.results.map(x => resultRow(x, "search")) : [note(t("searchNone"))];
      if (r.more) rows.push(note(t("searchMore", {n: r.results.length})));
      out.replaceChildren(...rows);
    }catch(e){ if (my === seq) out.replaceChildren(note(errText(e))); }
  }
  input.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(run, 350); });
  input.addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); clearTimeout(timer); run(); } });
  App.sheet(t("searchT"), h("label", {class: "event-team-lbl", for: "event-team-q", text: t("searchLabel")}), input,
    h("p", {class: "event-team-hint", text: t("searchHint")}), out);
  input.focus();
}
async function openPeople(){
  const out = h("div", {class: "event-team-sheetlist", id: "event-team-peopleList", "aria-live": "polite"}, note(t("loading")));
  App.sheet(t("peopleT"), out);
  try{
    const r = await App.api("team.participants", {eventId: S.eventId});
    out.replaceChildren(...(r.results.length ? r.results.map(x => resultRow(x, "participant")) : [note(t("peopleEmpty"))]));
  }catch(e){ out.replaceChildren(note(errText(e))); }
}
function askRemove(p){
  App.sheet(t("removeT", {name: p.name}), h("p", {text: t("removeD", {name: p.name})}),
    h("div", {class: "event-team-btns"}, h("button", {type: "button", class: "btn", id: "event-team-removeOk", text: t("removeBtn"), onclick: async e => {
      const b = e.currentTarget; busyBtn(b, true, t("busy"));
      try{ const r = await App.api("team.remove", {eventId: S.eventId, ref: p.ref}); App.closeSheet(); afterChange(r); App.toast(t("removedToast", {name: r.removed || p.name})); }
      catch(x){ busyBtn(b, false, t("removeBtn")); App.toast(errText(x)); if (x.code === "NOT_FOUND"){ App.closeSheet(); manageView.refresh(); } }
    }})));
}

/* ---------- #team-join/<token>: accept an invite link ---------- */
async function loadJoin(){
  S.join = null; S.joinErr = "";
  if (!/^[a-f0-9]{40}$/i.test(S.joinToken)){ S.joinState = "invalid"; renderJoin(); return; }
  S.joinState = "loading"; renderJoin();
  try{ S.join = await App.api("team.invitePreview", {token: S.joinToken}); S.joinState = S.join.state; }
  catch(e){
    if (e.code === "NOT_MEMBER"){ App.notMember(); return; }
    S.joinState = e.code === "NOT_FOUND" ? "invalid" : "error"; S.joinErr = e.message;
  }
  renderJoin();
}
function renderJoin(){
  const body = $("#event-team-joinBody"), st = S.joinState, d = S.join || {};
  const center = (iconEl, title, text, ...btns) => h("div", {class: "card stack event-team-center"}, iconEl, h("h2", {text: title}), text ? h("p", {text}) : null, ...btns);
  const home = h("button", {type: "button", class: "btn secondary", id: "event-team-goHome", onclick: () => App.go("home"), text: t("goHome")});
  if (st === "loading") return body.replaceChildren(App.skeleton([120, 180]));
  if (st === "error") return body.replaceChildren(App.emptyState(App.t("errLoad"), S.joinErr, {text: App.t("retry"), onclick: loadJoin}));
  if (st === "invalid") return body.replaceChildren(center(h("span", {class: "event-team-done", style: "background:var(--error-soft);color:var(--error)"}, App.icon("alert")), t("invalidT"), t("invalidD"), home));
  if (["used", "expired", "cancelled", "closed"].indexOf(st) >= 0) {
    return body.replaceChildren(center(h("span", {class: "event-team-done", style: "background:var(--warning-soft);color:var(--warning)"}, App.icon("clock")), t(st + "T"), t("askNew"), home));
  }
  if (st === "joined" || st === "already") {
    return body.replaceChildren(center(h("span", {class: "event-team-done"}, App.icon("check")), t(st === "joined" ? "joinedT" : "alreadyT"), st === "joined" ? t("joinedD") : "",
      h("button", {type: "button", class: "btn", id: "event-team-goManage", onclick: () => App.go("manage", d.eventId), text: t("goManage")})));
  }
  const ev = d.event || {};
  body.replaceChildren(
    h("p", {class: "t-lead", style: "margin:0", text: d.leadName ? t("joinLead", {name: d.leadName}) : t("joinLeadNone")}),
    h("div", {class: "card event-team-headcard", style: "margin:0"},
      h("span", {class: "event-team-when", text: when(ev)}),
      h("span", {class: "event-team-name", text: ev.name || ""}),
      ev.location ? h("span", {class: "event-team-meta"}, App.icon("pin"), h("span", {text: ev.location})) : null),
    h("div", {class: "card stack"},
      h("b", {text: t("joinCan")}),
      h("ul", {class: "event-team-steps"}, ["joinCan1", "joinCan2", "joinCan3"].map(k => h("li", {}, App.icon("check"), h("span", {text: t(k)})))),
      h("p", {class: "event-team-note", style: "margin:0", text: t("joinPdpa")})),
    d.expiresAt ? h("p", {class: "event-team-note", style: "margin:0", text: t("joinExpires", {d: F.dateTime(d.expiresAt)})}) : null,
    h("button", {type: "button", class: "btn", id: "event-team-accept", onclick: e => accept(e.currentTarget), text: t("joinBtn")}));
}
async function accept(btn){
  busyBtn(btn, true, t("joining"));
  try{
    const r = await App.api("team.acceptInvite", {token: S.joinToken});
    S.join = Object.assign({}, S.join, {eventId: r.eventId}); S.joinState = r.already ? "already" : "joined";
    renderJoin();
  }catch(e){
    if (e.code === "NOT_MEMBER"){ App.notMember(); return; }
    const st = {USED: "used", EXPIRED: "expired", CANCELLED: "cancelled", CLOSED: "closed"}[e.code];
    if (st){ S.joinState = st; renderJoin(); return; }
    busyBtn(btn, false, t("joinBtn")); App.toast(errText(e));
  }
}

/* ---------- links from outside the app: ?teamjoin=<token>, ?manage=1, ?manage=<eventId> ----------
   The shell opens ?event=ID and ?tab=x by itself; these two are read here once LINE login is done (core request: a general
   ?<route>=<arg> in the shell). The parameter is removed from the address so a reload or Back doesn't open it again. */
function dropParam(name){
  try{
    const p = new URLSearchParams(location.search); if (!p.has(name)) return;
    p.delete(name); const q = p.toString();
    history.replaceState(history.state, "", location.pathname + (q ? "?" + q : "") + location.hash);
  }catch(e){}
}
App.ready.then(() => {
  const p = new URLSearchParams(location.search), tok = p.get("teamjoin"), man = p.get("manage");
  if (tok != null){ dropParam("teamjoin"); if (!/^#team-join\//.test(location.hash)) App.go("team-join", tok); return; }
  if (man != null){ dropParam("manage"); if (!/^#manage/.test(location.hash)) App.go("manage", /^[A-Za-z0-9_-]{1,40}$/.test(man) && man !== "1" ? man : ""); }
});

App.register({
  name: "event-team",
  routes: {
    manage: {
      screen: "event-team-manage",
      title(){
        if (!S.eventId) return t("listT");
        const ev = S.data && S.data.event;
        return ev ? {title: ev.name, sub: t("manageT")} : t("manageT");
      },
      show(ctx){
        const id = String(ctx.arg || "");
        $("#event-team-listView").hidden = !!id; $("#event-team-detailView").hidden = !id;
        if (!id){ S.eventId = ""; App.setTitle(); return ctx.first ? listView.start() : listView.refresh(); }
        if (id !== S.eventId){ S.eventId = id; S.data = null; S.panel = ""; manageView.reset(); App.setTitle(); }
        return manageView.refresh();
      }
    },
    "team-join": {
      screen: "event-team-join",
      title: () => t("joinT"),
      show(ctx){
        const tok = String(ctx.arg || "");
        if (tok !== S.joinToken || !S.joinState){ S.joinToken = tok; loadJoin(); } else renderJoin();
      }
    }
  },
  onLang(){
    if (!$("#event-team-listView").hidden) listView.rerender();
    if (S.data) renderManage();
    if (S.joinState) renderJoin();
  }
});

/* ---------- demo answers (no API_URL in config.js): ?demo=organizer = the lead, ?demo=participant = a collaborator ----------
   Every name below is made up. */
const DEMO = (() => {
  const d = new Date(), iso = n => { const x = new Date(d); x.setDate(x.getDate() + n); return x.toISOString().slice(0, 10); };
  const P = (ref, name, nickname) => ({ref, name, nickname});
  return {
    iso,
    events: {
      "EV-DEMO-02": {id: "EV-DEMO-02", name: "Board Game Night", date: iso(0), startTime: "13:00", endTime: "17:00", location: "บ้านหัวแหลม อโศก", status: "Approved"},
      "EV-DEMO-03": {id: "EV-DEMO-03", name: "Hualaem-X Session", date: iso(27), startTime: "13:00", endTime: "16:00", location: "บ้านหัวแหลม อโศก + ออนไลน์", status: "Approved"}
    },
    lead: P("r-lead", "เมฆา ส.", "พี่เมฆ"),
    team: {"EV-DEMO-02": [P("r-fon", "ฝนทิพย์ ก.", "ฝน")], "EV-DEMO-03": []},
    people: [P("r-mint", "ปภาวี ส.", "มิ้นท์"), P("r-oat", "อรรถพล ก.", "โอ๊ต"), P("r-nat", "ณัฐชา ร.", "แนท"), P("r-poom", "ภูมิ ท.", "ภูมิ")],
    others: [P("r-hom", "ข้าวหอม พ.", "หอม"), P("r-wipa", "วิภา บ.", "วิว")],
    invites: 0
  };
})();
function demoRole(id, mode){ return mode === "organizer" ? (id === "EV-DEMO-02" ? "lead" : "collaborator") : (id === "EV-DEMO-02" ? "collaborator" : ""); }
function demoManage(id, mode){
  const ev = DEMO.events[id], role = ev ? demoRole(id, mode) : "";
  if (!ev) throw new App.ApiError("Event not found.", "NOT_FOUND");
  if (!role) throw new App.ApiError("You are not on the team of this event.", "FORBIDDEN");
  const meLead = role === "lead";
  const lead = Object.assign({role: "lead", isMe: meLead}, id === "EV-DEMO-02" ? DEMO.lead : {ref: "r-other", name: "อรุณ ท.", nickname: "พี่อรุณ"});
  const team = [lead].concat(DEMO.team[id].map(p => Object.assign({role: "collaborator", isMe: !meLead && p.ref === "r-fon"}, p)));
  if (!meLead && id === "EV-DEMO-03") team.push({ref: "r-me", name: "สมชาย ใ.", nickname: "ชาย", role: "collaborator", isMe: true});
  return {ok: true, now: DEMO.iso(0) + " 10:00", event: ev, myRole: role, editable: true, canEdit: meLead, canRemove: meLead, canSearch: meLead,
    team, max: 20, openInvites: meLead ? DEMO.invites : 0, inviteHours: 72};
}
const onTeam = (id, ref) => ref === "r-lead" || DEMO.team[id].some(p => p.ref === ref);
App.demo["team.mine"] = (b, mode) => ({ok: true, now: DEMO.iso(0) + " 10:00", events: Object.keys(DEMO.events).filter(id => demoRole(id, mode))
  .map(id => Object.assign({}, DEMO.events[id], {myRole: demoRole(id, mode), teamCount: 1 + DEMO.team[id].length + (mode !== "organizer" && id === "EV-DEMO-03" ? 1 : 0), past: false}))});
App.demo["team.manage"] = (b, mode) => demoManage(b.eventId, mode);
App.demo["team.invite"] = () => { DEMO.invites++; return {ok: true, token: "a".repeat(40), expiresAt: DEMO.iso(3) + " 10:00", inviteHours: 72}; };
App.demo["team.cancelInvites"] = () => { const n = DEMO.invites; DEMO.invites = 0; return {ok: true, cancelled: n}; };
App.demo["team.search"] = b => {
  const q = String(b.q || "").trim().toLowerCase();
  if (q.length < 2) return {ok: true, results: [], tooShort: true};
  const all = DEMO.people.concat(DEMO.others, DEMO.team[b.eventId] || []);
  return {ok: true, results: all.filter(p => (p.name + " " + p.nickname).toLowerCase().indexOf(q) >= 0).map(p => Object.assign({onTeam: onTeam(b.eventId, p.ref)}, p)), more: false};
};
App.demo["team.participants"] = b => ({ok: true, results: DEMO.people.map(p => Object.assign({onTeam: onTeam(b.eventId, p.ref)}, p))});
App.demo["team.add"] = (b, mode) => {
  const p = DEMO.people.concat(DEMO.others).find(x => x.ref === b.ref);
  if (!p) throw new App.ApiError("This member was not found. Search again.", "NOT_FOUND");
  const already = onTeam(b.eventId, p.ref);
  if (!already) DEMO.team[b.eventId].push(p);
  return Object.assign(demoManage(b.eventId, mode), {added: already ? "" : p.name, already});
};
App.demo["team.remove"] = (b, mode) => {
  const list = DEMO.team[b.eventId], i = list.findIndex(x => x.ref === b.ref);
  if (i < 0) throw new App.ApiError("This person is not a collaborator of this event (any more).", "NOT_FOUND");
  const p = list.splice(i, 1)[0];
  return Object.assign(demoManage(b.eventId, mode), {removed: p.name});
};
// demo tokens: "a" x 40 = a fresh link, "b" x 40 = used, "c" x 40 = expired
App.demo["team.invitePreview"] = b => {
  const tok = String(b.token || "");
  const st = tok === "a".repeat(40) ? "open" : tok === "b".repeat(40) ? "used" : tok === "c".repeat(40) ? "expired" : "";
  if (!st) throw new App.ApiError("This invite link is not valid.", "NOT_FOUND");
  return {ok: true, now: DEMO.iso(0) + " 10:00", state: st, eventId: "", expiresAt: st === "open" ? DEMO.iso(3) + " 10:00" : "",
    event: st === "open" ? DEMO.events["EV-DEMO-03"] : null, leadName: st === "open" ? "อรุณ ท." : ""};
};
App.demo["team.acceptInvite"] = () => ({ok: true, already: false, eventId: "EV-DEMO-03"});
});

async function hold(btn){
  if (S.sending) return;
  const d = S.join, id = S.eventId;
  S.sending = true; btn.disabled = true; btn.textContent = t("sending");
  try{
    const r = await App.api("reg.hold", {eventId: id});

    d.registration = {reference: r.reference, status: r.status};
    if (r.status === "Registered"){ showJoin({arg: id}); return; }
    renderInvite(d);

  }catch(e){
    if (e.code === "ALREADY_MEMBER"){ showJoin({arg: id}); return; }

function validate(){
  const f = S.form, sec = S.join.event.sections || {}, a = f.a, e = {};

  if (sec.study){
    ["addrLine", "addrSubdistrict", "addrDistrict", "addrProvince"].forEach(k => need(k, a[k].trim(), t("eRequired")));
    need("addrZip", /^\d{5}$/.test(a.addrZip.trim()), t("eZip"));
  }
  if (sec.sessions){
    need("sessions", a.sessions.some(n => sec.sessionNames.indexOf(n) >= 0), t("eSessions"));
    need("attendMode", a.attendMode === "onsite" || a.attendMode === "online", t("eMode"));
    if (sec.teams && a.attendMode === "online"){
      const m = a.teamsEmail.trim();
      if (!m) e.teamsEmail = t("eTeams");
      else if (m.indexOf("@") >= 0 && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(m)) e.teamsEmail = t("eTeamsEmail");
    }
  }
  if (sec.food){
    if (f.food.text.trim() && !f.food.consent) e.food = t("eFood");
    need("friendsComing", !!a.friendsComing, t("ePick"));
    need("igFollowed", !!a.igFollowed, t("ePick"));
  }
  f.errors = e;
  showErrors();
  return Object.keys(e);
}
function showErrors(){
  const e = (S.form && S.form.errors) || {};
  jBody.querySelectorAll("[data-key]").forEach(el => {
    const k = el.dataset.key, msg = e[k] || "";
    if (el.classList.contains("field")){
      const input = el.querySelector(".input"), err = el.querySelector(".err");
      el.classList.toggle("bad", !!msg); if (input) input.setAttribute("aria-invalid", msg ? "true" : "false");
      if (err){ if (msg){ err.replaceChildren(App.icon("alert"), h("span", {text: msg})); err.hidden = false; } else err.hidden = true; }
    } else {
      el.classList.toggle("registration-bad", !!msg);
      let p = el.querySelector(":scope > .registration-err");
      if (msg){ if (!p){ p = h("p", {class: "registration-err", role: "alert"}); el.append(p); } p.replaceChildren(App.icon("alert"), h("span", {text: msg})); }
      else if (p) p.remove();
    }
  });

async function submit(){
  if (S.sending || !S.join || !S.form) return;
  const bad = validate();
  if (bad.length){
    App.toast(t("eCheck"));
    const first = jBody.querySelector("[data-key=\"" + bad[0] + "\"]");
    if (first){ first.scrollIntoView({block: "center"}); const i = first.querySelector("input, textarea, button"); if (i) i.focus({preventScroll: true}); }
    return;
  }
  const d = S.join, ev = d.event, sec = ev.sections || {}, f = S.form, id = S.eventId;
  const wasReg = !!(d.registration && d.registration.status === "Registered");
  const answers = Object.assign({}, f.a, {sessions: f.a.sessions.slice()});
  Object.keys(answers).forEach(k => { if (typeof answers[k] === "string") answers[k] = answers[k].trim(); });
  const body = {eventId: id, answers, consent: true, consentVersion: App.consent().version, idempotencyKey: f.key};
  if (sec.food) body.food = {text: f.food.text.trim(), consent: !!f.food.text.trim() && f.food.consent};
  const btn = $("#registration-submit");
  S.sending = true; if (btn){ btn.disabled = true; btn.textContent = t("sending"); }
  try{
    await App.api("reg.register", body);
    if (App.isDemo) App.toast(t("demoDone"));
    S.fresh[id] = wasReg ? "saved" : "done";
    S.form = null; S.join = null;
    const v = tickets.get(id); if (v) v.reset();
    App.go("ticket", id, {replace: true});              // Back from the ticket skips the form
  }catch(e){
    if (e.code === "PROFILE"){ d.profileComplete = false; renderForm(d); return; }
    if (e.code === "FOOD_CONSENT"){ f.errors = Object.assign({}, f.errors, {food: t("eFood")}); showErrors(); }
    App.toast(e.message);
    if (e.code === "NOT_OPEN") showJoin({arg: id});
  }finally{
    S.sending = false;
    const b = $("#registration-submit"); if (b){ b.disabled = false; b.textContent = wasReg ? t("save") : t("submit"); }
  }
}

function wrapText(g, text, maxW, maxLines){
  let words;
  try{ words = Array.from(new Intl.Segmenter(en() ? "en" : "th", {granularity: "word"}).segment(text), s => s.segment); }catch(e){ words = Array.from(text); }
  const lines = []; let cur = "";
  words.forEach(w => {
    const next = cur + w;
    if (g.measureText(next).width <= maxW || !cur) cur = next;
    else { lines.push(cur.trim()); cur = w.trimStart(); }
  });
  if (cur.trim()) lines.push(cur.trim());
  if (lines.length > maxLines){ lines.length = maxLines; lines[maxLines - 1] = lines[maxLines - 1].replace(/.{1}$/, "") + "…"; }
  return lines;
}
function roundRect(g, x, y, w, hh, r){ g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + hh, r); g.arcTo(x + w, y + hh, x, y + hh, r); g.arcTo(x, y + hh, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
async function storyImage(ev, url){

    }
    if (!drawn){
      g.fillStyle = "#72B5B3"; g.fillRect(px, py, pw, ph);
      g.fillStyle = "#FFFFFF"; g.font = "700 96px " + FONT;
      wrapText(g, String(ev.name || "").split(/\s+/)[0] || "", pw - 120, 2).forEach((l, i) => g.fillText(l, px + 60, py + ph - 80 - (1 - i) * 110));

    wrapText(g, ev.name || "", 540, 3).forEach(l => { g.fillText(l, 110, y); y += 70; });
    g.fillStyle = "#526361"; g.font = "400 36px " + FONT; y += 10;
    [whenLine(ev), ev.location].filter(Boolean).forEach(line => wrapText(g, line, 540, 2).forEach(l => { g.fillText(l, 110, y); y += 50; }));
    const m = QR.encode(url), n = m.length, size = 300, cell = size / (n + 2), qx = 680, qy = 1350;

    g.fillStyle = "#0F1F1E";
    for (let yy = 0; yy < n; yy++) for (let xx = 0; xx < n; xx++) if (m[yy][xx]) g.fillRect(qx + (xx + 1) * cell, qy + (yy + 1) * cell, Math.ceil(cell), Math.ceil(cell));
    g.fillStyle = "#136B66"; g.font = "600 30px " + FONT; g.textAlign = "center";
    g.fillText(t("igScan"), qx + size / 2, qy + size + 50);
    g.textAlign = "left";
    const dataUrl = c.toDataURL("image/png");
    const blob = await new Promise(res => c.toBlob(res, "image/png"));

      h("div", {class: "registration-sheetBtns"},
        h("button", {type: "button", class: "btn", id: "registration-igSave", onclick: () => saveImage(blob, name, dataUrl)}, App.icon("image"), t("igSave")),
        h("button", {type: "button", class: "btn secondary", id: "registration-igOpen", onclick: () => App.link("instagram://story-camera")}, App.icon("camera"), t("igOpen"))),

}
async function saveImage(blob, name, dataUrl){
  try{

  }catch(e){ if (e && e.name === "AbortError") return; }
  const a = h("a", {href: blob ? URL.createObjectURL(blob) : dataUrl, download: name, style: "display:none"});

  App.toast(t("igSaved"));

/* =====================================================================

const P = { eventId: "", data: null, at: 0, busy: null, q: "", el: null, pending: {} };      // the participant list

/* ---------- Manage › Participants ---------- */
function loadPeople(eventId, force){
  if (P.busy && P.eventId === eventId) return P.busy;
  if (!force && P.data && P.eventId === eventId && Date.now() - P.at < 3000) return Promise.resolve(P.data);
  P.busy = App.api("reg.participants", {eventId}).then(d => {
    if (P.eventId !== eventId) return null;
    P.data = d; P.at = Date.now(); P.pending = {};
    drawPeople();
    return d;
  }).catch(e => {
    if (P.eventId !== eventId) return null;
    if (e.code === "NOT_MEMBER"){ App.notMember(); return null; }
    if (P.data){ App.toast(chkErr(e)); return null; }
    if (P.el && P.el.isConnected) P.el.replaceChildren(App.emptyState(App.t("errLoad"), chkErr(e), {text: App.t("retry"), onclick: () => loadPeople(eventId, true)}));
    return null;
  }).finally(() => { P.busy = null; });
  return P.busy;
}
function mountPeople(el, ctx){

function drawList(){
  const box = $("#registration-plist"); if (!box || !P.data) return;

function personRow(p){

async function toggle(p, on, sw){
  const id = P.eventId;
  P.pending[p.reference] = true; sw.disabled = true;
  try{
    const r = await App.api(on ? "reg.checkin" : "reg.uncheck", {eventId: id, reference: p.reference});
    applyPerson(id, r.person, r.count);
    App.toast(t(on ? "pDoneToast" : "pUndoToast", {name: (r.person && (r.person.nickname || r.person.name)) || p.name}));
  }catch(e){
    sw.set(!on);
    App.toast(chkErr(e));
    if (e.code === "NOT_FOUND" || e.code === "CLOSED") loadPeople(id, true);
  }finally{
    delete P.pending[p.reference];
    if (P.eventId === id) drawList();
  }
}

/* ---------- the camera ---------- */
// Resolves to the QR text, null when the person closed the camera, or NO_CAMERA when it can't open here.
function scanCode(){
  if (App.isDemo) return demoScan();
  const L = window.liff;
  try{
    if (!L || typeof L.scanCodeV2 !== "function") return Promise.resolve(NO_CAMERA);
    if (typeof L.isApiAvailable === "function" && !L.isApiAvailable("scanCodeV2")) return Promise.resolve(NO_CAMERA);
    return L.scanCodeV2().then(r => (r && typeof r.value === "string" && r.value) ? r.value : null).catch(() => NO_CAMERA);
  }catch(e){ return Promise.resolve(NO_CAMERA); }
}
async function scanAndCheck(eventId){
  if (C.scanning) return;
  C.scanning = true;
  let code;
  try{ code = await scanCode(); }finally{ C.scanning = false; }
  if (code == null) return;                                  // closed the camera: stay where we are
  C.eventId = eventId;
  if (code === NO_CAMERA){ C.state = "camera"; C.res = null; showScanScreen(eventId); return; }
  await sendCode(eventId, code);
}
async function sendCode(eventId, code){
  C.eventId = eventId; C.qr = code; C.state = "busy"; C.res = null; C.err = null;
  showScanScreen(eventId);
  try{
    const r = await App.api("reg.checkin", {eventId, qr: code});
    if (C.eventId !== eventId || C.qr !== code) return;
    C.res = r; C.state = r.result;                           // checked | already | wrong
    applyPerson(eventId, r.person, r.count);
  }catch(e){
    if (C.eventId !== eventId) return;
    if (e.code === "NOT_MEMBER"){ App.notMember(); return; }
    C.state = "fail"; C.err = e;
  }
  if (S.scanShown === eventId) drawScan();
}
function showScanScreen(eventId){
  if (S.scanShown === eventId && location.hash.indexOf("#scan/") === 0) drawScan();
  else App.go("scan", eventId);
}
async function undoScan(btn){
  const r0 = C.res, id = C.eventId; if (!r0 || !r0.person) return;
  btn.disabled = true; btn.textContent = t("undoing");
  try{
    const r = await App.api("reg.uncheck", {eventId: id, reference: r0.person.reference});
    applyPerson(id, r.person, r.count);
    C.res = Object.assign({}, r0, {person: r.person, count: r.count}); C.state = "undone";
  }catch(e){ App.toast(chkErr(e)); }
  drawScan();
}

/* ---------- #scan/<eventId> ---------- */
function showScan(ctx){
  const id = String(ctx.arg || "");
  if (!id){ App.go("manage", "", {replace: true}); return; }
  S.scanShown = id;
  if (C.eventId !== id){ C.eventId = id; C.state = ""; C.res = null; }
  if (!P.data || P.eventId !== id){ P.eventId = id; P.data = null; loadPeople(id, true).then(() => { if (S.scanShown === id) App.setTitle(); }); }
  drawScan();
  App.setTitle();
}
function scanTitle(){
  const ev = P.data && P.data.event && P.data.event.id === S.scanShown ? P.data.event : null;
  return ev ? {title: t("scanT"), sub: ev.name} : t("scanT");
}
function drawScan(){
  const st = C.state, r = C.res || {}, p = r.person, c = r.count || (P.data && P.data.count) || null;
  const big = (cls, ic, title, ...lines) => h("div", {class: "registration-result " + cls, role: "status"},
    h("span", {class: "registration-bigIcon", "aria-hidden": "true"}, ic), h("h1", {text: title}), ...lines.filter(Boolean));
  const line = (text, cls) => text ? h("p", {class: cls || "registration-rLine", text}) : null;
  let body;
  if (st === "busy") body = h("div", {class: "registration-result"}, App.skeleton([152]), h("p", {class: "registration-rLine", text: t("scanBusy")}));
  else if (st === "checked") body = h("div", {class: "registration-result registration-rOk", role: "status"},
    h("div", {class: "registration-stamp", "aria-hidden": "true"}, App.icon("check"), h("span", {text: t("stampIn")})),
    h("h1", {text: t("okT")}), h("p", {class: "registration-rName", id: "registration-rName", text: personLabel(p)}),
    line([p.reference, inTime(p.checkedInAt), c ? t("okNth", {c: c.checkedIn, n: c.total}) : ""].filter(Boolean).join(" · ")));
  else if (st === "already") body = big("registration-rAgain", App.icon("alert"), t("againT"),
    h("p", {class: "registration-rName", id: "registration-rName", text: personLabel(p)}),
    line(t("againD", {name: p.nickname || p.name, t: inTime(p.checkedInAt), by: p.byName ? t("againBy", {by: p.byName}) : ""})), line(t("againD2")));
  else if (st === "wrong") body = big("registration-rWrong", App.icon("x"), t("wrongT"), line(t("wrongD")), line(t("wrongD2")));
  else if (st === "undone") body = big("registration-rUndone", App.icon("refresh"), t("undoneT"), line(t("undoneD", {name: personLabel(p)})));
  else if (st === "fail") body = big("registration-rWrong", App.icon("alert"), t("failT"), line(chkErr(C.err)));
  else if (st === "camera") body = big("registration-rAgain", App.icon("camera"), t("camT"), line(t("camD")), line(t("camAdmin"), "registration-rSmall"));
  else body = big("registration-rIdle", scanIcon(), t("scanIdleT"), line(t("scanIdleD")));
  sBody.replaceChildren(body);
  if (st === "checked" && !matchMedia("(prefers-reduced-motion: reduce)").matches){ const s = $(".registration-stamp", sBody); if (s) s.classList.add("registration-thump"); }

  const id = C.eventId || S.scanShown;
  const primary = st === "fail"
    ? h("button", {type: "button", class: "btn", id: "registration-retry", onclick: () => sendCode(id, C.qr), text: t("retry")})
    : h("button", {type: "button", class: "btn registration-scanNext", id: "registration-scanNext", disabled: st === "busy", onclick: () => scanAndCheck(id)},
        scanIcon(), st ? t("scanNext") : t("scanStart"));
  const second = st === "checked"
    ? h("button", {type: "button", class: "btn quiet registration-undo", id: "registration-undo", onclick: e => undoScan(e.currentTarget), text: t("undoBtn")})
    : h("button", {type: "button", class: "btn quiet", id: "registration-toList", onclick: () => App.go("manage", id), text: t("toList")});
  sBar.replaceChildren(App.actionBar(primary, second));
}

const demoCount = d => ({total: d.people.filter(p => p.status === "Registered").length, checkedIn: d.people.filter(p => p.status === "Registered" && p.checkedInAt).length});
function demoScan(){

  if (p.status !== "Registered") throw new App.ApiError(t("errGone"), "NOT_FOUND");
  if (p.checkedInAt) return {ok: true, result: "already", person: p, count: demoCount(d)};

/* ---------- form pieces (DESIGN.md "Form field": label above, red *, 48 tall, error under with an icon) ---------- */
let uid = 0;
function field(key, control, o){
  o = o || {};
  const id = control.id || ("members-f-" + key + "-" + (++uid));
  control.id = id;
  const lab = h("label", {for: id}, label(key), OPTIONAL[key] ? h("span", {class: "members-opt", text: " (" + t("optional") + ")"}) : h("span", {class: "members-req", "aria-hidden": "true", text: " *"}));
  const err = h("p", {class: "members-err", id: id + "-err", hidden: true});
  control.setAttribute("aria-describedby", id + "-err");
  return h("div", {class: "members-field", "data-key": key}, lab, o.wrap ? o.wrap(control) : control, err);
}
function input(key, value, attrs){
  const el = h("input", Object.assign({class: "members-input", name: key, type: "text", autocomplete: "off"}, attrs || {}));
  el.value = value || "";
  return el;
}
function select(key, options, value){
  const el = h("select", {class: "members-input", name: key},
    h("option", {value: "", text: t("ph_select")}), options.map(([v, text]) => h("option", {value: v, text})));
  el.value = value || "";
  return el;
}
function choices(key, options, value, cols3, onPick){
  const name = "members-c-" + key + "-" + (++uid);
  const box = h("div", {class: "members-choices" + (cols3 ? " members-c3" : ""), role: "radiogroup"});
  options.forEach(([v, text]) => {
    const radio = h("input", {type: "radio", name, value: v, "data-key": key});
    radio.checked = v === value;
    const lab = h("label", {class: "members-choice" + (v === value ? " members-sel" : "")}, radio, cols3 ? null : h("span", {class: "members-dot", "aria-hidden": "true"}), h("span", {text}));
    radio.addEventListener("change", () => {
      App.$$("label", box).forEach(l => l.classList.toggle("members-sel", l.contains(radio)));
      if (onPick) onPick(v);
    });
    box.append(lab);
  });
  return box;
}
function choiceField(key, box){
  const err = h("p", {class: "members-err", hidden: true});
  return h("fieldset", {class: "members-field", "data-key": key},
    h("legend", {}, label(key), h("span", {class: "members-req", "aria-hidden": "true", text: " *"})), box, err);
}
// One question, by name
function question(key, v){
  v = v || {};
  if (key === "title") return choiceField(key, choices(key, TITLES.map(([th, e]) => [th, en() ? e : th]), v.title, true));
  if (key === "firstName") return field(key, input(key, v.firstName, {autocomplete: "given-name", maxlength: 60}));
  if (key === "lastName") return field(key, input(key, v.lastName, {autocomplete: "family-name", maxlength: 60}));
  if (key === "nickname") return field(key, input(key, v.nickname, {autocomplete: "nickname", maxlength: 40}));
  if (key === "birthDate") return field(key, input(key, v.birthDate, {type: "date", min: "1930-01-01", max: today()}));
  if (key === "homeProvince") {
    const opts = PROVINCES.map(([th, e]) => [th, en() ? e : th]).sort((a, b) => a[1].localeCompare(b[1], en() ? "en" : "th")).concat([["ต่างประเทศ", t("abroad")]]);
    return field(key, select(key, opts, v.homeProvince));
  }
  if (key === "phone") return field(key, input(key, v.phone, {type: "tel", inputmode: "tel", autocomplete: "tel", maxlength: 20, placeholder: t("ph_phone")}));
  if (key === "email") return field(key, input(key, v.email, {type: "email", inputmode: "email", autocomplete: "email", maxlength: 120, placeholder: t("ph_email"), autocapitalize: "off"}));
  if (key === "instagram") return field(key, input(key, v.instagram, {maxlength: 31, autocapitalize: "off", autocorrect: "off", spellcheck: "false"}),
    {wrap: c => h("div", {class: "members-prefix"}, h("span", {"aria-hidden": "true", text: "@"}), c)});
  if (key === "hsGrade") return field(key, select(key, [1, 2, 3, 4, 5, 6].map(n => [String(n), t("grade", {n})]), v.hsGrade));
  if (key === "uniYear") return field(key, select(key, [1, 2, 3, 4, 5, 6].map(n => [String(n), t("year", {n})]), v.uniYear));
  if (key === "industry") return field(key, select(key, INDUSTRIES.map(x => [x, x]), v.industry));
  const ph = {hsProgram: t("ph_hsProgram"), otherNow: t("ph_otherNow")}[key];
  return field(key, input(key, v[key], {maxlength: key === "otherNow" ? 200 : 120, placeholder: ph || null}));
}
// Current status + the one matching study/work section (changing status clears the other answers, brief 10.2)
function workPart(v, onStatus){
  const branch = h("div", {});
  const draw = s => {
    if (!STATUS_FIELDS[s]) { branch.replaceChildren(); return; }
    branch.replaceChildren(h("section", {class: "members-card"}, h("h3", {text: t("br_" + s)}), STATUS_FIELDS[s].map(k => question(k, v))));
  };
  const box = choices("currentStatus", STATUSES.map(s => [s, t("st_" + s)]), v.currentStatus, false, s => { draw(s); if (onStatus) onStatus(s); });
  draw(v.currentStatus);
  return [choiceField("currentStatus", box), branch];
}

/* ---------- reading and checking a form (same rules as the server; the server checks again) ---------- */
function read(root){
  const out = {};
  App.$$("input[type=text],input[type=tel],input[type=email],input[type=date],select", root).forEach(el => { out[el.name] = el.value.trim(); });
  App.$$("input[type=radio]:checked", root).forEach(el => { out[el.dataset.key] = el.value; });
  App.$$("fieldset[data-key]", root).forEach(fs => { if (!(fs.dataset.key in out)) out[fs.dataset.key] = ""; });
  if ("instagram" in out) out.instagram = out.instagram.replace(/^@+/, "");
  return out;
}
function problem(k, v){
  if (!v) return OPTIONAL[k] ? null : (k === "title" || k === "currentStatus" ? "errPick" : "errReq");
  if (k === "phone"){ let d = v.replace(/\D/g, ""); if (/^66\d{9}$/.test(d)) d = "0" + d.slice(2); return /^0\d{8,9}$/.test(d) ? null : "errPhone"; }
  if (k === "email") return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v) ? null : "errEmail";
  if (k === "instagram") return /^[A-Za-z0-9._]{1,30}$/.test(v) ? null : "errIg";
  if (k === "birthDate") return /^\d{4}-\d{2}-\d{2}$/.test(v) && v >= "1930-01-01" && v <= today() ? null : "errDate";
  if ((k === "hsSchool" || k === "uniName" || k === "company") && v.length < 2) return "errReq";
  return null;
}
function check(root){
  const vals = read(root);
  let first = null;
  App.$$("[data-key].members-field", root).forEach(f => {
    const k = f.dataset.key, msg = problem(k, vals[k]);
    const err = $(".members-err", f);
    f.classList.toggle("members-bad", !!msg);
    if (msg){ err.replaceChildren(App.icon("alert"), t(msg)); err.hidden = false; if (!first) first = f; }
    else err.hidden = true;
    const c = $(".members-input", f); if (c) c.setAttribute("aria-invalid", msg ? "true" : "false");
  });
  return {vals, first};
}
function clearErr(e){
  const f = e.target.closest && e.target.closest(".members-field");
  if (f && f.classList.contains("members-bad")){ f.classList.remove("members-bad"); const err = $(".members-err", f); if (err) err.hidden = true; }
}
function focusFirst(f){
  f.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center"});
  const c = $("input,select", f); if (c) setTimeout(() => c.focus({preventScroll: true}), 250);
}

  onError(e){ if (meBody) meBody.replaceChildren(App.emptyState(App.t("errLoad"), e.message, {text: App.t("retry"), onclick: () => view.refresh()})); return true; }
});
// The frame is drawn at once (LINE name, settings), the member part when the server answers.
function frame(){
  meCardEl = App.meCard();
  meBody = h("div", {class: "stack", id: "members-body"});
  me.replaceChildren(meCardEl, meBody, App.settingsPanel());

// Me: edit one part in a bottom sheet (member.update). Needs the current consent; otherwise the full form asks for it first.
function editGroup(group){
  const d = st.member;
  if (!d) return;
  if (!d.consentCurrent || !d.profile){ App.toast(t("needConsentFirst")); App.go("signup"); return; }
  const p = d.profile;
  const form = h("form", {class: "members-sheet-form", novalidate: true});
  if (group === "work") form.append(...workPart(p));
  else GROUPS[group].forEach(k => form.append(question(k, p)));

  form.append(save);
  form.addEventListener("input", clearErr); form.addEventListener("change", clearErr);
  form.addEventListener("submit", async e => {
    e.preventDefault();
    if (st.sending) return;
    const {vals, first} = check(form);
    if (first){ focusFirst(first); return; }
    const body = {};
    (group === "work" ? ["currentStatus"].concat(STATUS_FIELDS[vals.currentStatus] || []) : GROUPS[group]).forEach(k => { body[k] = vals[k] || ""; });

/* ---------- sign-up v2 (#signup): new application, edit while pending, or complete / re-accept consent ---------- */
const suBody = $("#members-suBody");
function suMode(d){ return !d || d.status === "none" ? "apply" : d.status === "pending" ? "edit" : "complete"; }
async function showSignup(){
  const fresh = st.member && Date.now() - st.loadedAt < 60e3;
  if (!fresh){
    suBody.replaceChildren(App.skeleton([48, 120, 300]));
    try{ const d = await App.api("member.bootstrap"); st.member = d; st.loadedAt = Date.now(); }
    catch(e){ suBody.replaceChildren(App.emptyState(App.t("errLoad"), e.message, {text: App.t("retry"), onclick: showSignup})); return; }
  }

}
function drawSignup(draft){
  const d = st.member;
  App.setTitle();
  if (d.status === "rejected"){
    suBody.replaceChildren(h("div", {class: "card members-status"}, h("b", {text: t("rejectedT")}), h("span", {class: "t-small muted", text: t("rejectedD", {sid: d.serviceId})})));
    return;
  }
  const mode = suMode(d), p = Object.assign({}, d.profile || {}, (draft && draft.vals) || {});

    h("div", {class: "members-step members-on"}, h("i"), t("step1")),
    h("div", {class: "members-step" + (p.currentStatus ? " members-on" : ""), id: "members-step2"}, h("i"), t("step2")));
  const av = h("span", {class: "avatar", "aria-hidden": "true", text: (App.user.name || "?").trim().charAt(0).toUpperCase()});
  const lineAs = h("div", {class: "members-lineas"}, av, h("span", {text: t("lineAs", {name: App.user.name || "LINE"})}));
  const form = h("form", {class: "members-form", id: "members-form", novalidate: true},
    h("h2", {class: "members-sec", text: t("secBasics")}),
    question("title", p),
    h("div", {class: "members-two"}, question("firstName", p), question("lastName", p)),
    h("div", {class: "members-two"}, question("nickname", p), question("birthDate", p)),
    question("homeProvince", p), question("phone", p), question("email", p), question("instagram", p),
    h("h2", {class: "members-sec", text: t("secWork")}),
    ...workPart(p, () => { $("#members-step2").classList.add("members-on"); }));
  const tick = h("input", {type: "checkbox", id: "members-consent"});
  tick.checked = !!(draft && draft.ticked);
  const consentErr = h("p", {class: "members-err", id: "members-consent-err", hidden: true});
  tick.addEventListener("change", () => { consentErr.hidden = true; });
  form.append(h("div", {class: "members-field"},
    h("label", {class: "members-consent", for: "members-consent"}, tick,
      h("span", {}, consent.consent + " ", h("button", {type: "button", class: "members-link", onclick: e => { e.preventDefault(); App.privacySheet(); }, text: t("consentRead", {v: consent.version})}))),
    consentErr));
  form.addEventListener("input", clearErr); form.addEventListener("change", clearErr);
  form.addEventListener("submit", e => { e.preventDefault(); submit(mode); });
  // the sticky action bar lives inside this screen, so it disappears with it when another screen is shown
  const btn = h("button", {type: "button", class: "btn", id: "members-submit", onclick: () => submit(mode), text: t(mode === "apply" ? "submitApply" : "submitSave")});
  suBody.replaceChildren(steps, lineAs, form, h("div", {class: "members-bar", id: "members-bar"}, btn));
}
async function submit(mode){
  if (st.sending) return;
  const form = $("#members-form");
  const {vals, first} = check(form);
  const tick = $("#members-consent");
  if (!tick.checked){ const e = $("#members-consent-err"); e.replaceChildren(App.icon("alert"), t("errConsent")); e.hidden = false; }
  if (first || !tick.checked){ App.toast(t("errFix")); focusFirst(first || tick.closest(".members-field")); return; }
  const profile = {};
  ["title", "firstName", "lastName", "nickname", "birthDate", "homeProvince", "phone", "email", "instagram", "currentStatus"].concat(STATUS_FIELDS[vals.currentStatus] || [])
    .forEach(k => { profile[k] = vals[k] || ""; });
  const btn = $("#members-submit");
  st.sending = true; btn.disabled = true; btn.textContent = t("sending");
  try{
    const r = await App.api("member.apply", {profile, consent: true, consentVersion: App.consent().version});
    st.member = r; st.loadedAt = Date.now();
    App.toast(App.isDemo ? t("demoSaved") : t(mode === "apply" ? "sentApply" : "sentSave"));
    App.go("me");
  }catch(e){ App.toast(e.message); }
  finally{ st.sending = false; if (btn.isConnected){ btn.disabled = false; btn.textContent = t(mode === "apply" ? "submitApply" : "submitSave"); } }
}

  if (mode === "rejected") return (demoState = Object.assign(base, {status: "rejected", profile: null}));

      : h("div", {class: "passport-hint"}, h("p", {style: "margin:0 0 12px", text: t("emptyStamps")}),
          h("button", {type: "button", class: "btn secondary", id: "passport-seeEvents", onclick: () => App.go("events"), text: t("seeEvents")})));

  // my claims: only from a fresh answer (never saved on the phone)
  const sec = $("#passport-secClaims");
  if (!fresh || !Array.isArray(d.myClaims)) sec.hidden = true;
  else {
    sec.hidden = !(d.canClaim || d.myClaims.length);
    $("#passport-claims").replaceChildren(d.myClaims.length
      ? h("div", {class: "rows", id: "passport-claimList"}, ...d.myClaims.map(claimRow))
      : App.emptyState(t("emptyClT"), t("emptyClD")));
  }
  $("#passport-asOf").textContent = fresh ? App.t("asOf", {d: F.dateTime(d.now)}) : App.t("savedAt", {d: F.stamp(meta.at)});
}

function stamp(s){
  const k = t(KIND[s.kind] || "kJoined"), d = shortDate(s.date);
  if (s.upcoming) return h("div", {class: "passport-stamp passport-soon", role: "img", "data-event": s.eventId, "aria-label": t("soonLabel", {name: s.name, d, k})},
    h("b", {text: s.name}), h("span", {text: d}), h("i", {text: t("soon")}));
  return h("div", {class: "passport-stamp", role: "img", "data-event": s.eventId, "data-kind": s.kind, style: "transform:rotate(" + tilt(s.eventId) + "deg)",
    "aria-label": t("stampLabel", {name: s.name, d, k})},
    h("b", {text: s.name}), h("span", {text: d}), h("i", {text: k}));
}

function claimRow(c){
  const st = CLAIM[c.status] || ["", null, ""];
  return h("button", {type: "button", class: "row passport-claim", "data-ref": c.reference, onclick: () => claimSheet(c)},
    h("span", {class: "grow"},
      h("b", {text: F.money(c.total) + " · " + c.eventName}),
      h("span", {class: "sub", text: c.reference + " · " + t("sentL", {d: F.date(c.submittedAt, {weekday: undefined, year: undefined})})})),
    chip(st[0], st[1], st[2] ? t(st[2]) : c.status),
    App.icon("chevron", "chev"));
}

// status timeline (brief 10.1 "my claims with status timeline"): sent → approved → paid, or sent → not approved
function claimSheet(c){
  const step = (state, ic, title, when) => h("li", {class: "passport-" + state},
    h("span", {class: "passport-dot", "aria-hidden": "true"}, ic ? App.icon(ic) : null),
    h("span", {class: "passport-st"}, h("b", {text: title}), when ? h("span", {text: when}) : null));
  const sent = step("done", "check", t("stepSent"), F.dateTime(c.submittedAt));
  const decided = c.decidedAt ? t("decidedL", {d: F.dateTime(c.decidedAt)}) : "";
  let steps;
  if (c.status === "Rejected") steps = [sent, step("bad", "x", t("stepRejected"), decided)];
  else if (c.status === "Paid") steps = [sent, step("done", "check", t("stepApproved"), decided), step("done", "check", t("stepPaid"), "")];
  else if (c.status === "Approved") steps = [sent, step("done", "check", t("stepApproved"), decided), step("todo", null, t("stepPaid"), t("stepNext"))];
  else steps = [sent, step("todo", "clock", t("stepApproved"), t("stepWaiting")), step("todo", null, t("stepPaid"), t("stepNext"))];
  const st = CLAIM[c.status] || ["", null, ""];
  App.sheet(t("claimSheetT"),
    h("div", {class: "stack", style: "gap:4px;margin-bottom:8px"},
      h("b", {class: "t-lead", text: c.eventName}),
      h("span", {class: "passport-amount", text: F.money(c.total)}),
      h("span", {class: "t-small muted", text: t("itemsL", {n: c.items}) + " · " + t("refL", {ref: c.reference})}),
      chip(st[0], st[1], st[2] ? t(st[2]) : c.status)),
    h("ol", {class: "passport-steps", id: "passport-steps"}, ...steps),
    c.status === "Rejected" ? h("p", {class: "passport-sheetHint", text: t("rejectedHint")}) : null);
}

  return chip(m[0], m[1], t(m[2]));

function errText(e){
  const k = {FORBIDDEN: "errForbidden", NOT_FOUND: "errGone", CONFLICT: "errConflict", SETUP: "errSetup"}[e && e.code];

// a button that asks once more before it acts (no browser dialogs inside LINE)
function confirmBtn(o){
  const b = h("button", {type: "button", class: o.cls || "btn", id: o.id, text: o.text});
  let armed = false, timer = null;
  b.addEventListener("click", async () => {
    if (b.disabled) return;
    if (!armed){ armed = true; b.textContent = o.confirm; b.classList.add("reimbursement-armed"); clearTimeout(timer);
      timer = setTimeout(() => { armed = false; b.textContent = o.text; b.classList.remove("reimbursement-armed"); }, 6000); return; }
    clearTimeout(timer); b.disabled = true;
    try{ await o.run(); }finally{ armed = false; if (b.isConnected){ b.disabled = false; b.textContent = o.text; b.classList.remove("reimbursement-armed"); } }
  });
  return b;
}

/* =====================================================================
   The summary of one event (panel and #expenses/<id>)
   ===================================================================== */
const SUM = {};                                   // eventId -> {data, at, busy}
function loadSummary(eventId, force){
  const s = SUM[eventId] || (SUM[eventId] = {data: null, at: 0, busy: null});
  if (s.busy) return s.busy;
  if (!force && s.data && Date.now() - s.at < 3000) return Promise.resolve(s.data);
  s.busy = App.api("expense.summary", {eventId}).then(d => { s.data = d; s.at = Date.now(); return d; })
    .finally(() => { s.busy = null; });
  return s.busy;
}
function stale(eventId){ if (SUM[eventId]) SUM[eventId].at = 0; LIST.at = 0; }

function summaryView(d, opts){

    put(h("div", {class: "reimbursement-bar" + (tot.overBudget ? " reimbursement-isOver" : ""), role: "progressbar", "aria-label": t("budgetAria"),

  if (b.status === "Requested") put(h("div", {class: "reimbursement-budRow"}, chip("warn", "clock", t("bReq")),

  else if (b.status === "Rejected") put(h("div", {class: "reimbursement-budRow"}, chip("bad", "x", t("bRej")),

    b.note ? h("p", {class: "reimbursement-hint", text: b.note}) : null);
  else if (b.approved === null || b.approved === undefined) put(h("p", {class: "reimbursement-hint", text: t("bNone")}));
  if (tot.count) put(h("p", {class: "reimbursement-hint num", text: t("split", {w: money(tot.waiting), a: money(tot.approved - tot.paid), p: money(tot.paid)})}));
  if (d.canDecideBudget) put(budgetDecision(d, opts));

  // by category
  if (d.byCategory.length) parts.push(h("div", {class: "reimbursement-sec"}, h("h2", {class: "reimbursement-h2", text: t("byCatT")}),

function claimRow(c, d, opts){
  const title = [c.first || catLabel(c.category), c.who].filter(Boolean).join(" · ");

      c.mine ? h("span", {class: "sub reimbursement-mine", text: t("mine")}) : null),
    h("span", {class: "reimbursement-cRight"}, h("b", {class: "num", text: money(c.total)}), statusChip(c.status)));

// approver: approve or reject the requested budget (events decides and logs it; not for their own event)
function budgetDecision(d, opts){
  const box = h("div", {class: "reimbursement-decide", id: "reimbursement-budgetDecide"});
  const amount = d.budget.requested;
  const send = async (decision, note) => {
    try{
      await App.api("event.decideBudget", {eventId: d.event.id, decision, amount, note: note || ""});
      App.toast(t(decision === "approve" ? "budgetDone" : "budgetRejected"));
      if (App.isDemo) demoBudget(d.event.id, decision, note);
    }catch(e){ App.toast(errText(e)); }
    stale(d.event.id); opts.reload();
  };
  const approve = confirmBtn({id: "reimbursement-budgetOk", text: t("approveBudget", {x: money(amount)}), confirm: t("confirmBudget", {x: money(amount)}), run: () => send("approve")});
  const reject = h("button", {type: "button", class: "btn secondary", id: "reimbursement-budgetNo", text: t("rejectBudget"), onclick: () => {
    const f = App.field({label: t("rejectBudgetReason"), type: "textarea", required: true, id: "reimbursement-budgetReason", attrs: {maxlength: "300", rows: "3"}});
    const ok = h("button", {type: "button", class: "btn", id: "reimbursement-budgetNoOk", text: t("confirmReject"), onclick: async () => {
      if (f.value().length < 3){ f.setError(t("reasonReq")); f.input.focus(); return; }
      ok.disabled = true; await send("reject", f.value());
    }});
    box.replaceChildren(f.el, ok, h("button", {type: "button", class: "btn quiet", text: t("cancel"), onclick: () => box.replaceChildren(approve, reject)}));
    f.input.focus();
  }});
  box.append(approve, reject);
  return box;
}

async function openClaim(reference, eventId, opts){
  const body = h("div", {class: "reimbursement-sheet", id: "reimbursement-claimSheet"}, App.skeleton([64, 120]));
  App.sheet(reference, body);

  catch(e){ if (body.isConnected) body.replaceChildren(App.emptyState(App.t("errLoad"), errText(e))); return; }
  if (!body.isConnected) return;
  const parts = [
    h("div", {class: "reimbursement-sTop"}, statusChip(c.status), h("b", {class: "reimbursement-big num", text: money(c.total)})),
    h("p", {class: "reimbursement-hint", text: [c.eventName, t("cBy", {who: c.who || "—", d: F.dateTime(c.submittedAt)})].join(" · ")}),
    h("h3", {class: "reimbursement-h3", text: t("cRecords")}),

      h("span", {class: "grow"}, h("span", {text: r.description}), h("span", {class: "sub", text: [catLabel(r.category), F.date(r.date)].join(" · ")}),
        r.receipt ? h("button", {type: "button", class: "btn quiet reimbursement-rcpt", onclick: () => App.openExternal(r.receipt)}, App.icon("image"), t("cReceipt")) : null),
      h("b", {class: "num", text: money(r.amount)}))))
  ];
  if (c.records.some(r => r.receipt)) parts.push(h("p", {class: "reimbursement-hint", text: t("cReceiptHint")}));
  if (c.note) parts.push(h("h3", {class: "reimbursement-h3", text: t("cNote")}), h("p", {class: "reimbursement-quote", text: c.note}));
  if (c.decisionNote) parts.push(h("h3", {class: "reimbursement-h3", text: t("cDecisionNote")}), h("p", {class: "reimbursement-quote", text: c.decisionNote}));
  if (c.payee) parts.push(h("h3", {class: "reimbursement-h3", text: t("cPayee")}), h("p", {class: "reimbursement-pay", text: t("cPayeeLine", {name: c.payee.name, pp: c.payee.promptpay})}),

  if (c.canApprove || c.canPay) parts.push(claimDecision(c, eventId, opts));

  body.replaceChildren(...parts);
}
function claimDecision(c, eventId, opts){

  }
  const approve = confirmBtn({id: "reimbursement-approve", text: t("cApprove", {x: money(c.total)}), confirm: t("cConfirmApprove", {x: money(c.total)}), run: () => send("approve")});
  const reject = h("button", {type: "button", class: "btn secondary", id: "reimbursement-reject", text: t("cReject"), onclick: () => {

    const ok = h("button", {type: "button", class: "btn", id: "reimbursement-rejectOk", text: t("confirmReject"), onclick: async () => {
      if (f.value().length < 3){ f.setError(t("reasonReq")); f.input.focus(); return; }
      ok.disabled = true; await send("reject", f.value());

const fmtBytes = b => b > 1048576 ? (b / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1024)) + " KB";
const toSatang = v => { const s = String(v == null ? "" : v).replace(/,/g, "").trim(); if (!/^\d+(\.\d*)?$/.test(s)) return NaN; return Math.round(parseFloat(s) * 100); };
async function compressImage(file){
  const bmp = await createImageBitmap(file, {imageOrientation: "from-image"});
  const scale = Math.min(1, LIM.imagePx / Math.max(bmp.width, bmp.height));
  const c = h("canvas", {width: Math.round(bmp.width * scale), height: Math.round(bmp.height * scale)});
  const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(bmp, 0, 0, c.width, c.height);
  const blob = await new Promise(res => c.toBlob(res, "image/jpeg", LIM.quality));
  if (!blob) throw new Error("encode");
  return new File([blob], (file.name || "receipt").replace(/\.[^.]+$/, "") + ".jpg", {type: "image/jpeg"});
}
async function attach(it, file){
  it.rcErr.hidden = true;
  const isPdf = file.type === "application/pdf", isImg = /^image\//.test(file.type);
  if (!isPdf && !isImg){ rcError(it, t("fileType")); return; }
  drawDrop(it, true);
  let out = file;
  if (isImg){ try{ out = await compressImage(file); }catch(e){ out = file; } }
  if (out.size > LIM.fileMb * 1048576){ drawDrop(it); rcError(it, t("fileBig", {mb: LIM.fileMb})); return; }
  if (!/^(image\/(jpeg|png|webp)|application\/pdf)$/.test(out.type)){ drawDrop(it); rcError(it, t("fileType")); return; }
  if (it.url) URL.revokeObjectURL(it.url);
  it.file = out; it.url = isImg ? URL.createObjectURL(out) : null;
  drawDrop(it);
}
function rcError(it, text){ it.rcErr.replaceChildren(App.icon("alert"), h("span", {text})); it.rcErr.hidden = false; }
function totalSatang(){ return CF.items.reduce((s, it) => { const v = toSatang(it.amount.input.value); return s + (isNaN(v) || v < 0 ? 0 : v); }, 0); }
function totals(){
  const lab = $("#reimbursement-totalL"); if (!lab) return;
  const total = totalSatang() / 100, ev = curEvent(), over = $("#reimbursement-over");
  lab.textContent = t("fTotal", {n: itemsText(CF.items.length)});
  $("#reimbursement-totalV").textContent = money(total);
  if (ev && ev.budget > 0 && total > ev.budget){ over.hidden = false; over.textContent = t("fOver", {x: money(total - ev.budget)}); } else over.hidden = true;
  if (CF.sendBtn && !CF.sending) CF.sendBtn.textContent = t("fSubmit", {x: money(total)});
}
function ppOk(raw){
  let d = String(raw || "").replace(/\D/g, "");
  if (/^66\d{9}$/.test(d)) d = "0" + d.slice(2);
  if (/^0\d{9}$/.test(d) || /^\d{15}$/.test(d)) return d;
  if (/^\d{13}$/.test(d)){ let s = 0; for (let i = 0; i < 12; i++) s += (+d[i]) * (13 - i); return ((11 - (s % 11)) % 10) === +d[12] ? d : ""; }
  return "";
}
function validate(){
  const bad = [];
  const check = (f, msg) => { f.setError(msg || ""); if (msg) bad.push(f.el); };
  if (CF.f.event) check(CF.f.event, CF.f.event.value() ? "" : t("eventReq"));
  check(CF.f.name, CF.f.name.value().length >= 2 ? "" : t("req"));
  check(CF.f.pp, ppOk(CF.f.pp.input.value) ? "" : t("ppBad"));
  CF.items.forEach(it => {
    if (!it.file){ rcError(it, t("receiptReq")); bad.push(it.drop); } else it.rcErr.hidden = true;
    const dt = it.date.value();
    check(it.date, !dt ? t("dateReq") : dt > today() ? t("dateFuture") : "");
    const s = toSatang(it.amount.input.value);
    check(it.amount, isNaN(s) || s <= 0 ? t("amountBad") : s > 100000000 ? t("amountMax") : "");
    check(it.cat, it.cat.value() ? "" : t("catReq"));
    check(it.desc, it.desc.value() ? "" : t("req"));
  });
  return bad;
}
const toBase64 = file => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = () => rej(r.error); r.readAsDataURL(file); });
async function submit(){
  if (CF.sending) return;
  const bad = validate();
  if (bad.length){ App.toast(t("fixN", {n: bad.length})); bad[0].scrollIntoView({block: "center"}); return; }
  const bytes = CF.items.reduce((s, it) => s + it.file.size, 0);
  if (bytes > LIM.totalMb * 1048576){ App.toast(t("totalBig", {mb: LIM.totalMb})); return; }
  const ev = curEvent();
  CF.sending = true; CF.sendBtn.disabled = true; CF.sendBtn.textContent = t("fSending");
  CF.key = CF.key || uuid();                              // same key on a retry: the server keeps one claim
  try{
    const items = CF.items.map((it, i) => ({date: it.date.value(), category: it.cat.value(), description: it.desc.value(),
      amount: toSatang(it.amount.input.value) / 100, receiptField: "receipt_" + (i + 1)}));
    const receipts = await Promise.all(CF.items.map(async (it, i) => ({field: "receipt_" + (i + 1), name: it.file.name, type: it.file.type, data: await toBase64(it.file)})));
    const r = await App.api("claim.submit", {idempotencyKey: CF.key, event: {id: ev.id}, payee: {name: CF.f.name.value(), promptpay: ppOk(CF.f.pp.input.value)},
      note: CF.f.note.value(), items, receipts});
    CF.done = {reference: r.reference, duplicate: !!r.duplicate, eventId: ev.id, eventName: ev.name, total: totalSatang() / 100, canSee: !!r.canSee};
    CF.boot.payee = {name: CF.f.name.value(), promptpay: ppOk(CF.f.pp.input.value)};
    stale(ev.id);
    drawDone();
  }catch(e){
    if (e.code === "NOT_MEMBER"){ App.notMember(); return; }
    App.toast(e.code === "NET" ? t("sendFail") : errText(e));
  }finally{
    CF.sending = false;
    if (CF.sendBtn && CF.sendBtn.isConnected){ CF.sendBtn.disabled = false; totals(); }
  }
}
function drawDone(){
  const d = CF.done;
  cBody.replaceChildren(h("div", {class: "card reimbursement-done", id: "reimbursement-done", role: "status"},
    h("span", {class: "reimbursement-doneIc", "aria-hidden": "true"}, App.icon("check")),
    h("h2", {class: "reimbursement-h2", text: t("doneT")}),
    h("p", {class: "reimbursement-hint", text: d.duplicate ? t("doneDup") : t("doneSub")}),
    h("div", {class: "rows reimbursement-doneRows"},
      h("div", {class: "row"}, h("span", {class: "grow", text: t("ref")}), h("b", {class: "num", id: "reimbursement-ref", text: d.reference})),
      h("div", {class: "row"}, h("span", {class: "grow", text: t("doneEvent")}), h("span", {text: d.eventName})),
      h("div", {class: "row"}, h("span", {class: "grow", text: t("doneTotal")}), h("b", {class: "num", text: money(d.total)}))),
    h("p", {class: "reimbursement-hint", text: t("doneTrack")})));
  const again = h("button", {type: "button", class: "btn secondary", id: "reimbursement-again", text: t("doneAgain"), onclick: () => { resetForm(d.eventId); drawForm(true); window.scrollTo(0, 0); }});
  const main = d.canSee
    ? h("button", {type: "button", class: "btn", id: "reimbursement-see", text: t("doneSee"), onclick: () => App.go("expenses", d.eventId)})
    : h("button", {type: "button", class: "btn", id: "reimbursement-back", text: t("doneBack"), onclick: () => App.back()});
  cBar.replaceChildren(App.actionBar(main, again));
  window.scrollTo(0, 0);
}
