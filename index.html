.events-name{font-size:18px;line-height:26px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.events-meta{font-size:14px;line-height:20px;color:var(--muted);display:flex;gap:4px;align-items:flex-start}
.events-meta svg{width:16px;height:16px;flex:none;margin-top:2px}
.events-chips{display:flex;gap:6px;flex-wrap:wrap}

/* event page */
.events-hero{position:relative;border-radius:var(--r-lg);overflow:hidden;background:var(--brand-teal);color:#FFFFFF;aspect-ratio:4/5;max-height:62vh;width:100%;display:flex;align-items:flex-end;padding:20px;font-size:30px;line-height:38px;font-weight:700;word-break:break-word}
.events-hero.events-hasImg{background:var(--field)}
.events-hero.events-hasImg img{object-fit:contain}
.events-hero.events-short{aspect-ratio:auto;min-height:160px}
.events-dTitle{font-size:24px;line-height:32px;font-weight:700;margin:16px 0 0;word-break:break-word}
.events-dChips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.events-info{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.events-irow{display:flex;gap:12px;align-items:flex-start}
.events-irow>svg{width:22px;height:22px;flex:none;color:var(--primary)}
.events-irow b{display:block;font-size:16px;line-height:24px;font-weight:600}
.events-irow span{display:block;font-size:14px;line-height:20px;color:var(--muted)}
.events-irow a{font-size:14px;line-height:20px;font-weight:600;color:var(--primary);text-decoration:none;display:inline-block;padding:10px 0;margin:-10px 0}
.events-desc{margin:16px 0 0;white-space:pre-wrap;word-break:break-word}
.events-asks{display:flex;gap:10px;padding:12px 14px;border-radius:var(--r-md);background:var(--field);color:var(--muted);font-size:14px;line-height:20px;margin-top:16px}
.events-asks svg{width:20px;height:20px;flex:none}
.events-box{margin-top:24px;display:flex;flex-direction:column;gap:12px}
.events-box h2{margin:0;font-size:20px;line-height:28px;font-weight:600}
.events-kv{display:flex;align-items:center;gap:10px;justify-content:space-between;font-size:14px;line-height:20px}
.events-kv b{font-size:20px;line-height:28px;font-weight:700;font-variant-numeric:tabular-nums}
.events-row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.events-danger{color:var(--error)!important}
.events-hint{font-size:14px;line-height:20px;color:var(--muted);margin:0}

/* sticky action bar (DESIGN.md: detail screens hide the tab bar and show one bar) */
.events-bar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);box-shadow:var(--shadow-raised);padding:12px 16px calc(12px + var(--safe-b))}
.events-barIn{max-width:448px;margin:0 auto;display:flex;gap:12px}
.events-barIn .btn{flex:1}
.events-barIn .events-barSide{flex:none;width:auto}
.events-barSpace{height:88px}

/* form */
.events-form{display:flex;flex-direction:column;gap:18px}
.events-field{display:flex;flex-direction:column;gap:6px;min-width:0}
.events-field label{font-size:14px;line-height:20px;font-weight:600}
.events-req{color:var(--error)}
.events-field input,.events-field textarea{min-height:48px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--field-border);background:var(--surface);font-size:16px;line-height:24px;color:var(--ink);width:100%;min-width:0}
.events-field textarea{padding:12px 14px;resize:vertical}
.events-field input:focus,.events-field textarea:focus{outline:2px solid var(--primary);outline-offset:0;border-color:var(--primary)}
.events-field input[aria-invalid="true"],.events-field textarea[aria-invalid="true"]{border-color:var(--error)}
.events-field #events-fBudget{font-variant-numeric:tabular-nums}
.events-grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:end}
.events-form .events-grid2>.field{min-width:0}
.events-form .events-err{margin-top:-10px}
.events-mapSearch.btn{width:auto;align-self:flex-start;min-height:44px;padding:0 14px;font-size:14px;line-height:20px;margin-top:2px}
.events-mapSearch svg{width:18px;height:18px}
.events-form #events-fBudget{font-variant-numeric:tabular-nums}
.events-adv .field{gap:6px}
.events-help{font-size:14px;line-height:20px;color:var(--muted);margin:0}
.events-err{font-size:14px;line-height:20px;color:var(--error);margin:0;display:flex;gap:6px;align-items:flex-start}
.events-err svg{width:16px;height:16px;flex:none;margin-top:2px}
.events-errBox{background:var(--error-soft);color:var(--error)}
.events-posterPick{display:flex;flex-direction:column;gap:8px}
.events-drop{min-height:132px;border-radius:var(--r-lg);border:1.5px dashed var(--field-border);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--primary);cursor:pointer;padding:16px}
.events-drop svg{width:28px;height:28px}
.events-dropT{font-size:16px;line-height:24px;font-weight:600}
.events-dropD{font-size:14px;line-height:20px;color:var(--muted);text-align:center}
.events-fPosterImg{width:100%;max-height:360px;object-fit:contain;border-radius:var(--r-lg);background:var(--field)}
.events-posterActs{display:flex;gap:8px;justify-content:center}
.events-secCard{display:flex;flex-direction:column;gap:4px;padding:6px 16px 10px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line)}
.events-secT{margin:10px 0 0;font-size:16px;line-height:24px;font-weight:600}
.events-sec{min-height:64px;border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:8px 0;margin-top:6px}
.events-sec .events-secTx{flex:1;min-width:0;display:flex;flex-direction:column}
.events-sec .events-secTx b{font-size:16px;line-height:24px;font-weight:500}
.events-sec .events-secTx span{font-size:14px;line-height:20px;color:var(--muted)}
.events-switch{width:52px;height:32px;flex:none;padding:3px;border-radius:var(--r-pill);border:0;background:var(--field-border);display:flex;justify-content:flex-start;cursor:pointer}
.events-switch span{width:26px;height:26px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 2px rgba(15,31,30,.3);transition:transform .15s ease-out}
.events-switch[aria-checked="true"]{background:var(--primary)}
.events-switch[aria-checked="true"] span{transform:translateX(20px)}
.events-sessions{padding-bottom:6px}
.events-advBtn{min-height:48px;padding:0 4px;border:0;background:transparent;display:flex;align-items:center;gap:8px;font-size:16px;line-height:24px;font-weight:600;color:var(--primary);text-align:left;cursor:pointer}
.events-advBtn span{flex:1}
.events-advBtn svg{width:20px;height:20px;transition:transform .15s}
.events-advBtn[aria-expanded="true"] svg{transform:rotate(90deg)}
.events-adv{display:flex;flex-direction:column;gap:14px;padding:14px;border-radius:var(--r-md);background:var(--field)}
.events-sheetBtns{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.events-sheetBtns .events-field textarea{min-height:88px}
@media (prefers-reduced-motion: reduce){ .events-switch span,.events-advBtn svg{transition:none} }
/* event-team: Manage › Collaborators and the invite screen (DESIGN.md "Participant row", "Bottom sheet", "Form field") */
.event-team-intro{margin:0 0 12px}
.card.event-team-ev{display:flex;flex-direction:column;gap:4px}
.event-team-when{font-size:14px;line-height:20px;font-weight:600;color:var(--primary)}
.event-team-name{font-size:18px;line-height:26px;font-weight:600}
.event-team-meta{font-size:14px;line-height:20px;color:var(--muted);display:flex;gap:4px;align-items:flex-start}
.event-team-meta svg{width:16px;height:16px;flex:none;margin-top:2px}
.event-team-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.card.event-team-headcard{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.event-team-headrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#event-team-seg{margin-bottom:12px}
.event-team-person{display:flex;align-items:center;gap:12px;padding:12px;min-height:64px}
.event-team-av{width:40px;height:40px;flex:none;border-radius:50%;background:var(--primary-soft);color:var(--on-primary-soft);display:grid;place-items:center;font-weight:700}
.event-team-av.event-team-lead{background:var(--primary);color:var(--on-primary)}
.event-team-who{flex:1;min-width:0;display:flex;flex-direction:column}
.event-team-who b{font-weight:600;overflow-wrap:anywhere}
.event-team-who span{font-size:14px;line-height:20px;color:var(--muted)}
.icon-btn.event-team-x{color:var(--muted)}
.event-team-h2{font-size:16px;line-height:24px;font-weight:600;margin:20px 0 10px}
.rows .row.event-team-addrow{min-height:56px}
.event-team-note{font-size:14px;line-height:20px;color:var(--muted);margin:12px 0 0}
.event-team-sheetlist{display:flex;flex-direction:column;margin:8px 0 16px}
.event-team-result{display:flex;align-items:center;gap:12px;min-height:56px;border-top:1px solid var(--line);padding:6px 0}
.event-team-result:first-child{border-top:0}
.event-team-result .btn.secondary{width:auto;min-height:44px;padding:0 16px}
.event-team-lbl{display:block;font-size:14px;line-height:20px;font-weight:600;margin:0 0 6px}
.event-team-input{width:100%;height:48px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--field-border);background:var(--field);color:var(--ink);font-size:16px;line-height:24px}
.event-team-input:focus{outline:2px solid var(--primary);outline-offset:0;border-color:var(--primary)}
.event-team-hint{font-size:12px;line-height:16px;color:var(--muted);margin:6px 0 0}
.event-team-btns{display:flex;flex-direction:column;gap:10px;margin:4px 0 12px}
.event-team-link{font-size:14px}
.event-team-steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.event-team-steps li{display:flex;gap:10px;align-items:flex-start;font-size:16px;line-height:24px}
.event-team-steps svg{width:20px;height:20px;flex:none;color:var(--success);margin-top:2px}
.event-team-done{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--success-soft);color:var(--success);margin:8px auto 0}
.event-team-done svg{width:28px;height:28px}
.event-team-center{text-align:center}
.event-team-center h2{margin:8px 0 4px;font-size:20px;line-height:28px}
.event-team-center p{margin:0;color:var(--muted)}
/* registration: Join, invite preview, ticket. Every selector carries "registration-" (check.js). DESIGN.md "Form field", "Ticket". */
.registration-body{display:flex;flex-direction:column;gap:20px;padding-bottom:8px}
.registration-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-card);padding:16px;display:flex;flex-direction:column;gap:12px}
.registration-card h2{margin:0;font-size:16px;line-height:24px;font-weight:600}
.registration-head{display:flex;align-items:center;gap:8px}
.registration-head h2{flex:1}
.registration-quiet{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 4px;border:0;background:none;color:var(--primary);font-size:14px;line-height:20px;font-weight:600;cursor:pointer}
.registration-quiet svg{width:16px;height:16px}
.registration-dl{margin:0;display:grid;grid-template-columns:96px minmax(0,1fr);row-gap:6px;font-size:14px;line-height:20px}
.registration-dl dt{color:var(--muted)}
.registration-dl dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.registration-note{margin:0;font-size:14px;line-height:20px;color:var(--muted)}
.registration-set{margin:0;padding:0;border:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.registration-set>legend{padding:0;margin:0 0 8px;font-size:16px;line-height:24px;font-weight:600;color:var(--ink)}
.registration-set>legend .registration-req{color:var(--error)}
.registration-set>legend small{display:block;font-size:14px;line-height:20px;font-weight:400;color:var(--muted)}
.registration-group{display:flex;flex-direction:column;gap:14px}
.registration-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.registration-grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
/* choice cards (checkbox / radio): the whole row is the control, 48+ tall */
.registration-choice{min-height:52px;padding:12px 14px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:12px;
  text-align:left;font-size:16px;line-height:24px;font-weight:500;color:var(--ink);cursor:pointer;width:100%}
.registration-choice[aria-checked="true"]{border:2px solid var(--primary);background:var(--primary-soft);color:var(--on-primary-soft);padding:11px 13px}
.registration-box{width:22px;height:22px;flex:none;border-radius:6px;border:1.5px solid var(--field-border);background:var(--surface);color:var(--on-primary);display:flex;align-items:center;justify-content:center}
.registration-box svg{width:16px;height:16px;stroke-width:2.5;visibility:hidden}
.registration-choice[aria-checked="true"] .registration-box,.registration-tick[aria-checked="true"] .registration-box{border-color:var(--primary);background:var(--primary)}
.registration-choice[aria-checked="true"] .registration-box svg,.registration-tick[aria-checked="true"] .registration-box svg{visibility:visible}
.registration-radio{width:20px;height:20px;flex:none;border-radius:50%;border:1.5px solid var(--field-border);display:grid;place-items:center}
.registration-radio::after{content:"";width:10px;height:10px;border-radius:50%;background:transparent}
.registration-choice[aria-checked="true"] .registration-radio{border-color:var(--primary)}
.registration-choice[aria-checked="true"] .registration-radio::after{background:var(--primary)}
.registration-center{justify-content:center;font-weight:600}
.registration-bad>.registration-choice,.registration-bad .registration-grid2>.registration-choice{border-color:var(--error)}
.registration-err{margin:0;display:flex;align-items:center;gap:6px;font-size:14px;line-height:20px;color:var(--error);font-weight:500}
.registration-err svg{width:16px;height:16px;flex:none}
.registration-tick{margin-top:2px;padding:10px 0;border:0;background:transparent;display:flex;gap:10px;align-items:flex-start;text-align:left;font-size:14px;line-height:20px;color:var(--ink);cursor:pointer;width:100%}
.registration-tick .registration-box{margin-top:-1px}
.registration-consent{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:14px;line-height:20px;color:var(--muted)}
.registration-consent .registration-quiet{min-height:32px}
/* invite preview */
.registration-hero{height:150px;border-radius:var(--r-lg) var(--r-lg) 0 0;background:var(--on-primary-soft);color:#FFFFFF;padding:16px;display:flex;align-items:flex-end;
  font-size:26px;line-height:32px;font-weight:700;overflow:hidden;position:relative}
:root[data-theme="dark"] .registration-hero{background:#0F5753}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .registration-hero{background:#0F5753} }
.registration-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.registration-evcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.registration-evcard .registration-in{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px}
.registration-evcard b{font-size:18px;line-height:26px;font-weight:600}
.registration-steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.registration-steps li{display:flex;gap:12px;align-items:flex-start;font-size:16px;line-height:24px}
.registration-num{width:28px;height:28px;flex:none;border-radius:999px;background:var(--primary);color:var(--on-primary);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.registration-num.registration-soft{background:var(--primary-soft);color:var(--on-primary-soft)}
.registration-ok{background:var(--success-soft);color:var(--success)}
/* ticket */
.registration-done{display:flex;align-items:center;gap:10px;color:var(--success)}
.registration-done span{width:32px;height:32px;border-radius:999px;background:var(--success);color:var(--surface);display:flex;align-items:center;justify-content:center}
.registration-done svg{width:18px;height:18px;stroke-width:2.5}
.registration-done h1{margin:0;font-size:20px;line-height:28px;font-weight:700}
.registration-ticketCard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-card)}
.registration-tTop{padding:20px 20px 18px;display:flex;flex-direction:column;gap:10px}
.registration-tLabel{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.registration-tName{font-size:24px;line-height:32px;font-weight:700;overflow-wrap:anywhere}
.registration-tGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;font-size:14px;line-height:20px}
.registration-tGrid div{display:flex;flex-direction:column;min-width:0}
.registration-tGrid span{color:var(--muted)}
.registration-tGrid b{font-weight:600;overflow-wrap:anywhere}
.registration-tear{position:relative;height:0;border-top:2px dashed var(--line);margin:0 18px}
.registration-notch{position:absolute;top:-13px;width:24px;height:24px;border-radius:999px;background:var(--bg)}
.registration-notch.registration-l{left:-31px;border-right:1px solid var(--line)}
.registration-notch.registration-r{right:-31px;border-left:1px solid var(--line)}
.registration-tBottom{padding:20px;display:flex;flex-direction:column;align-items:center;gap:10px}
.registration-qr{width:200px;height:200px;padding:10px;background:#FFFFFF;border-radius:8px;box-sizing:content-box}
.registration-qr svg{display:block;width:200px;height:200px}
.registration-ref{font-size:16px;line-height:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.registration-qrHint{font-size:14px;line-height:20px;color:var(--muted);text-align:center}
.registration-serr{height:10px;margin-bottom:-1px;background:radial-gradient(circle at 50% 100%,var(--bg) 5px,transparent 5.5px) 0 0/14px 10px repeat-x}
.registration-actions{display:flex;flex-direction:column;gap:8px}
/* Instagram story preview */
.registration-story{display:block;width:180px;height:320px;margin:0 auto 12px;border-radius:12px;border:1px solid var(--line);object-fit:cover;background:var(--field)}
.registration-sheetBtns{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
@media (prefers-reduced-motion: no-preference){ .registration-pop{animation:registration-pop .25s ease-out} }
@keyframes registration-pop{from{transform:scale(1.2)}to{transform:scale(1)}}
/* check-in (S6): Manage › Participants panel and the scan screen. DESIGN.md "Participant row", "Stamp", "Motion". */
.registration-people{display:flex;flex-direction:column;gap:10px}
.registration-search{height:48px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--field-border);background:var(--surface);display:flex;align-items:center;gap:8px;cursor:text}
.registration-search:focus-within{outline:2px solid var(--primary);outline-offset:1px}
.registration-search svg{width:20px;height:20px;color:var(--muted);flex:none}
.registration-searchIn{flex:1;min-width:0;height:44px;border:0;outline:none;background:transparent;font:inherit;font-size:16px;line-height:24px;color:var(--ink)}
.registration-searchIn::placeholder{color:var(--muted)}
.registration-searchIn::-webkit-search-cancel-button{-webkit-appearance:none}
.registration-pCount{margin:0;font-size:14px;line-height:20px;color:var(--muted)}
.registration-pCount b{color:var(--ink);font-variant-numeric:tabular-nums}
.registration-plist{display:flex;flex-direction:column;gap:8px}
.registration-person{min-height:64px;padding:10px 12px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;gap:12px}
.registration-av{width:40px;height:40px;flex:none;border-radius:999px;background:var(--primary-soft);color:var(--on-primary-soft);display:flex;align-items:center;justify-content:center;font-weight:700}
.registration-who{flex:1;min-width:0;display:flex;flex-direction:column}
.registration-who b{font-size:16px;line-height:24px;font-weight:600;overflow-wrap:anywhere}
.registration-pnote{font-size:14px;line-height:20px;color:var(--muted)}
.registration-pnote.registration-good{color:var(--success)}
.registration-pnote.registration-warn{color:var(--warning)}
.registration-person .switch[disabled]{background:var(--line);cursor:default}
.registration-person .switch[disabled] span{box-shadow:none}
.registration-center{text-align:center}
/* scan screen */
#registration-scan{min-height:calc(100vh - 140px);display:flex;flex-direction:column}
.registration-scanBody{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 8px}
.registration-result{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;width:100%;max-width:340px}
.registration-result h1{margin:4px 0 0;font-size:26px;line-height:34px;font-weight:700}
.registration-result .sk-stack{width:152px}
.registration-rLine{margin:0;font-size:16px;line-height:24px;color:var(--muted)}
.registration-rSmall{margin:0;font-size:14px;line-height:20px;color:var(--muted)}
.registration-rName{margin:0;font-size:20px;line-height:28px;font-weight:600;color:var(--ink);overflow-wrap:anywhere}
.registration-rOk h1{font-size:30px;line-height:38px;color:var(--success)}

/* App.sendChat(text) (C2): posts text into the LINE chat the app was opened from (1-to-1, group or room), as the person,
   like the old event-join.html did. Resolves true when sent, false when it can't (not opened from a chat, outside LINE,
   demo mode, or the LIFF app lacks the "chat_message.write" scope): silently skipped, never an error for the person.
   Never put other people's data in it; the person and the others in that chat see the message. */
async function sendChat(text){
  text = String(text == null ? "" : text).trim().slice(0, 5000);
  if (!text || S.demo) return false;
  await READY;
  const L = window.liff;
  if (!S.inClient || !L || typeof L.sendMessages !== "function" || typeof L.getContext !== "function") return false;
  let ctx = null;
  try{ ctx = L.getContext(); }catch(e){ return false; }
  if (!ctx || ["utou", "group", "room", "square_chat"].indexOf(ctx.type) < 0) return false;
  try{ await L.sendMessages([{type: "text", text}]); return true; }catch(e){ return false; }
}
/* App.scanCode() (C2): opens the LINE camera (liff.scanCodeV2). Resolves to the QR text, or null when the person closed
   the camera without a code. Rejects with ApiError code "NO_CAMERA" when the camera can't open here: outside the LINE
   app, demo mode, "Scan QR" off in the LIFF app settings, or camera permission refused. One camera at a time (a second
   call while it is open gets the same answer). A feature keeps its own demo stand-in (demo mode has no camera). */
let scanning = null;
function scanCode(){
  if (scanning) return scanning;
  const noCam = () => new ApiError(tShell("noCamera"), "NO_CAMERA");
  scanning = (async () => {
    if (S.demo) throw noCam();
    await READY;
    const L = window.liff;
    if (!S.inClient || !L || typeof L.scanCodeV2 !== "function") throw noCam();
    let can = true;
    try{ if (typeof L.isApiAvailable === "function") can = !!L.isApiAvailable("scanCodeV2"); }catch(e){ can = false; }
    if (!can) throw noCam();
    let r;
    try{ r = await L.scanCodeV2(); }catch(e){ throw noCam(); }
    return r && typeof r.value === "string" && r.value ? r.value : null;
  })();
  const done = () => { scanning = null; };
  scanning.then(done, done);
  return scanning;
}
// App.canScan(): true when App.scanCode() can open the camera now (inside LINE, Scan QR on). For showing a hint early.
function canScan(){
  if (S.demo || !S.liffDone || !S.inClient) return false;
  const L = window.liff;
  try{ return !!(L && typeof L.scanCodeV2 === "function" && (typeof L.isApiAvailable !== "function" || L.isApiAvailable("scanCodeV2"))); }catch(e){ return false; }
}
/* Not an approved member (a server answer said NOT_MEMBER). Since C2, when a feature owns the Me tab and provides the
   route "signup" (members), the person lands on the Me tab exactly as if they had opened the sign-up link
   (?tab=me&signup=1): newcomers go on to the form (#signup; Back returns to Me), pending and rejected people stay on
   the Me tab with their status ("waiting for review" with the Service ID, or "not approved"); a pending person can
   still open their application from there. The Me tab is drawn as on a first visit: ctx.first, ctx.params has
   signup=1, ctx.reason = "notMember". Without a Me tab owner: the in-app #signup (C1), then the old sign-up page.
   No loops: the Me tab and #signup never answer NOT_MEMBER, sign-up.html forwards to this app with ?signup=1, and the
   app never sends anyone back there while it has the route "signup" (check.js section 9). */
function notMember(){
  cacheClear();
  if (TAB_OWNER.me && ROUTES.signup){
    if (S.route && (S.route.name === "signup" || S.route.name === "me")) return;   // several screens can say so at once
    S.notMember = true; S.shown.me = false;
    goRoute("me");
    return;
  }
  if (ROUTES.signup){
    if (S.route && S.route.name === "signup") return;    // several screens can say so at once: open it once
    S.tab = "me";
    goRoute("signup", "", {replace: true});
    return;
  }
  if (CONFIG.JOIN_LIFF_URL && PARAMS.get("signup") !== "1"){ location.replace(CONFIG.JOIN_LIFF_URL); return; }
  fatal(tShell("notMemberT"), tShell("notMemberD"));
}

/* ---------- API: the LINE ID token on the first request, then the short server session ----------
   Code.gs checks the LINE ID token with LINE once and answers with a signed session (appSession, a few hours).
   Later requests send only the session; Code.gs checks its signature and expiry, and still checks membership
   and role on every request (architecture notes, principle 3 and 4). The session lives in memory only. */
class ApiError extends Error { constructor(m, c){ super(m); this.code = c; } }
const DEMO = {};                              // demo answers by action, added by features: App.demo["x.y"] = (body, mode) => reply
async function api(action, data){
  if (S.demo){
    await sleep(350);
    const fn = DEMO[action];
    if (!fn) throw new ApiError(tShell("errNet"), "VALIDATION");
    return JSON.parse(JSON.stringify(fn(data || {}, S.demoMode)));
  }
  await READY;
  for (let attempt = 0; attempt < 2; attempt++){
    const body = Object.assign({}, data, {action});
    const useSession = !!(S.session && S.session.exp * 1000 - Date.now() > 60e3);
    if (useSession) body.appSession = S.session.token; else { body.lineIdToken = S.token; body.wantSession = true; }
    let res;
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 60000);
    try{
      const r = await fetch(CONFIG.API_URL, {method: "POST", headers: {"Content-Type": "text/plain;charset=utf-8"}, body: JSON.stringify(body), signal: ctl.signal});
      res = await r.json();
    }catch(e){ throw new ApiError(tShell("errNet"), "NET"); }
    finally{ clearTimeout(to); }
    if (res && res.appSession){ S.session = res.appSession; delete res.appSession; }
    if (res && res.ok) return res;
    if (res && res.code === "SESSION" && useSession){ S.session = null; continue; }   // expired or replaced: once more with the LINE token
    const map = {AUTH: "errAuth", RATE: "errRate", SERVER: "errNet", SESSION: "errAuth"};
    throw new ApiError(map[res && res.code] ? tShell(map[res.code]) : (res && res.error) || tShell("errNet"), res && res.code);
  }
  throw new ApiError(tShell("errAuth"), "AUTH");
}

/* ---------- saved copy on this phone (show last seen, then refresh) ----------
   Never saved: anything about claims, PromptPay, payees, receipts, slips or bank details (any key with those words,
   at any depth), whatever a feature asks. One saved copy per LINE account (a hash of the LINE user ID, not the ID). */
const PRIVATE_KEY = /claim|promptpay|payee|receipt|slip|bank/i;
function scrub(v){
  if (Array.isArray(v)) return v.map(scrub);
  if (v && typeof v === "object"){ const o = {}; Object.keys(v).forEach(k => { if (!PRIVATE_KEY.test(k)) o[k] = scrub(v[k]); }); return o; }
  return v;
}
const cacheName = () => S.demo ? "app.saved.demo-" + S.demoMode.replace(/[^a-z]/g, "") : "app.saved";
function cacheRead(){ const c = store.get(cacheName()); return c && typeof c === "object" && c.items ? c : {owner: null, items: {}}; }
function cacheGet(key){
  const c = cacheRead();
  if (S.owner && c.owner && c.owner !== S.owner){ cacheClear(); return null; }
  const it = c.items[key];
  return it && Date.now() - it.at < CONFIG.CACHE_DAYS * 864e5 ? it : null;
}
function cachePut(key, data){
  let c = cacheRead();
  if (S.owner && c.owner !== S.owner) c = {owner: S.owner, items: {}};
  c.items[key] = {at: Date.now(), data: scrub(data)};
  if (JSON.stringify(c).length > 300000) return;          // too big for a phone: just don't save
  store.set(cacheName(), c);
}
function cacheClear(){ store.del(cacheName()); store.del("app.saved"); }
async function ownerOf(sub){
  if (!sub) return null;
  try{
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("hualaem:" + sub));
    return Array.from(new Uint8Array(buf)).slice(0, 12).map(b => b.toString(16).padStart(2, "0")).join("");
  }catch(e){ return null; }
}

/* App.view: one screen's data. Shows the saved copy at once (or a skeleton), then asks the server and shows the answer.
   o = { key, action, body?: () => ({...}), cache?: true, el?: container for the error state,
         skeleton?: () => void, render: (data, {stale, at}) => void, onError?: (err) => true if handled } */
const VIEWS = [];
function view(o){
  const v = {data: null, meta: null, busy: null};
  v.start = function(){
    if (!v.data){
      const c = o.cache ? cacheGet(o.key) : null;
      if (c){ v.data = c.data; v.meta = {stale: true, at: c.at}; o.render(v.data, v.meta); }
      else if (o.skeleton) o.skeleton();
    }
    return v.refresh();
  };
  v.refresh = function(){
    if (v.busy) return v.busy;
    syncing(1);
    v.busy = (async () => {
      try{
        const d = await api(o.action, o.body ? o.body() : {});
        v.data = d; v.meta = {stale: false, at: Date.now()};
        if (o.cache) cachePut(o.key, d);
        o.render(d, v.meta);
      }catch(e){
        if (e.code === "NOT_MEMBER"){ notMember(); return; }
        if (o.onError && o.onError(e)) return;
        if (v.data){ toast(v.meta && v.meta.stale ? tShell("offlineSaved") : e.message); return; }
        if (o.el) o.el.replaceChildren(emptyState(tShell("errLoad"), e.code === "AUTH" ? tShell("errAuth") : e.message, {text: tShell("retry"), onclick: () => v.refresh()}));
        else fatal(tShell("errLoad"), e.message);
      }finally{ syncing(-1); v.busy = null; }
    })();
    return v.busy;
  };
  v.rerender = () => { if (v.data) o.render(v.data, v.meta); };
  v.reset = () => { v.data = null; v.meta = null; if (o.skeleton) o.skeleton(); };
  VIEWS.push(v);
  return v;
}
function syncing(n){
  S.syncing = Math.max(0, S.syncing + n);
  const dot = $("#syncDot"); dot.hidden = S.syncing === 0; dot.title = tShell("syncing");
  $("#appMain").setAttribute("aria-busy", S.syncing ? "true" : "false");
}

/* ---------- registry: features plug in here ---------- */
const TABS = ["home", "events", "passport", "me"];
const MODS = {}, TAB_OWNER = {}, ROUTES = {};
let booted = false;
// Called by the build for each app/features/<name> folder: App.module("<name>", <text.json>, function (App, t) { ...screen.js... })
function defineModule(name, text, fn){
  if (MODS[name]) throw new Error("App module " + name + " is defined twice");
  MODS[name] = {name, text: text || {th: {}, en: {}}, spec: null};
  // each feature gets the same App, except that what it adds (panels) is labelled with its own name
  const scoped = Object.create(App, {addPanel: {value: (host, p) => addPanel(name, host, p)}});
  fn(scoped, textFor(MODS[name].text));
}
// spec = { name, tab?, screen?: "<id>", title?: () => string | {title, sub}, show?: (ctx) => void, onLang?: () => void,
//          routes?: { <route>: { screen: "<id>", title?, show?, tabBar?: false, once?: true (a step: replaced by the next detail screen) } } }
function register(spec){
  const m = MODS[spec && spec.name];
  if (!m) throw new Error("App.register: name must be the feature folder name");
  if (m.spec) throw new Error("App.register called twice by " + spec.name);
  if (spec.tab){
    if (TABS.indexOf(spec.tab) < 0) throw new Error(spec.name + ": unknown tab " + spec.tab);
    if (TAB_OWNER[spec.tab]) throw new Error("tab " + spec.tab + " is already owned by " + TAB_OWNER[spec.tab]);
    if (!spec.screen || !document.getElementById(spec.screen)) throw new Error(spec.name + ": screen element #" + spec.screen + " is missing");
    TAB_OWNER[spec.tab] = spec.name;
  }
  Object.keys(spec.routes || {}).forEach(r => {
    if (TABS.indexOf(r) >= 0 || ROUTES[r]) throw new Error(spec.name + ": route " + r + " is taken");
    if (!/^[a-z][a-z0-9-]*$/.test(r)) throw new Error(spec.name + ": route names are lowercase words");
    if (!document.getElementById(spec.routes[r].screen)) throw new Error(spec.name + ": screen element #" + spec.routes[r].screen + " is missing");
    ROUTES[r] = {mod: spec.name, def: spec.routes[r]};
  });
  m.spec = spec;
  if (booted && spec.tab === S.tab && S.route && S.route.name === spec.tab) render(S.route);
}

/* ---------- routing: #home #events #passport #me are tabs; #<route>/<id> are detail screens ----------
   Tab switches replace the address (no back-button history); detail screens push one step, so Back returns to the tab. */
function parseHash(){
  const raw = decodeURIComponent((location.hash || "").replace(/^#\/?/, ""));
  const i = raw.indexOf("/");
  const name = (i < 0 ? raw : raw.slice(0, i)).toLowerCase(), arg = i < 0 ? "" : raw.slice(i + 1);
  return name ? {name, arg} : null;
}
/* Where the app opens: #<route>/<arg> in the address, else ?tab=<tab>, else ?<route>=<arg> for any route a feature
   registered (C1: ?event=ID, ?teamjoin=<token>, ?manage=<eventId>; dashes in a route name may be left out, so ?teamjoin
   opens "team-join"; the value "1" or empty opens the route without an argument, e.g. ?manage=1), else Home.
   A route parameter is opened once: it is removed from the address after LINE login, so a reload or Back keeps the
   screen (it is in the #hash) without opening the link again. */
function routeParam(){
  const names = Object.keys(ROUTES).sort();
  for (const [k, v] of PARAMS.entries()){
    const key = k.toLowerCase();
    const name = ROUTES[key] ? key : names.find(r => r.replace(/-/g, "") === key);
    if (!name) continue;
    const arg = String(v || "").trim().slice(0, 200);
    return {name, arg: arg === "1" ? "" : arg, param: k};
  }
  return null;
}
function initialRoute(){
  const fromHash = parseHash();
  if (fromHash) return fromHash;
  const tab = (PARAMS.get("tab") || "").toLowerCase();
  if (TABS.indexOf(tab) >= 0) return {name: tab, arg: ""};
  const r = routeParam();
  if (r){ S.consumed.push(r.param); return {name: r.name, arg: r.arg}; }
  return {name: "home", arg: ""};
}
// the address without the ?<route>= parameters already opened (other parameters such as ?tab and ?demo stay)
function searchLeft(){
  if (!S.consumed.length) return location.search;
  const p = new URLSearchParams(location.search);
  S.consumed.forEach(k => p.delete(k));
  const q = p.toString();
  return q ? "?" + q : "";
}
function routeKey(r){ return r.name + (r.arg ? "/" + r.arg : ""); }
/* Tabs replace the address (no history). A detail screen pushes one step, also from another detail screen (C1), so Back
   from #event-edit/ID returns to #event/ID. Going to the screen just before the current one is the same as Back
   (e.g. "save" on an edit form that opens the event page again): the step is taken back instead of pushing a new one,
   so Back never shows the form again. A route registered with once: true (a step such as a "create" form) is replaced by
   the next detail screen it opens, so Back skips it. opts.replace: replace the current screen (used by notMember). */
function goRoute(name, arg, opts){
  const r = {name, arg: arg || ""}, isTab = TABS.indexOf(name) >= 0;
  if (!isTab && !ROUTES[name]) return false;
  const key = routeKey(r);
  if (S.liffDone){                                          // never touch the address while LINE login is still starting
    const url = location.pathname + searchLeft() + "#" + encodeURIComponent(name) + (r.arg ? "/" + encodeURIComponent(r.arg) : "");
    const onDetail = S.route && TABS.indexOf(S.route.name) < 0;
    if (isTab){ history.replaceState(null, "", url); S.depth = 0; S.stack = []; }
    else if (onDetail && !(opts && opts.replace) && S.stack.length >= 2 && S.stack[S.stack.length - 2] === key){ history.back(); return true; }   // popstate draws it
    else if ((opts && opts.replace) || !S.route || (onDetail && S.def && S.def.once)){ history.replaceState(null, "", url); if (S.stack.length) S.stack[S.stack.length - 1] = key; }
    else { history.pushState(null, "", url); S.depth++; S.stack.push(key); }
  }
  render(r);
  return true;
}
// Open a detail screen if a feature provides it, otherwise the old page (e.g. event-join.html) so nothing breaks meanwhile.
function open(route, arg, fallbackUrl){ if (ROUTES[route]) return goRoute(route, arg); go(fallbackUrl); return false; }
window.addEventListener("popstate", () => { S.depth = Math.max(0, S.depth - 1); S.stack.pop(); render(parseHash() || {name: S.tab, arg: ""}); });

function placeholderDef(tab){
  return {
    title: () => tShell("tab_" + tab),
    show(){
      const el = $("#shell-placeholder");
      if (tab === "me") el.replaceChildren(meCard(), settingsPanel());
      else if (tab === "events") el.replaceChildren(emptyState(tShell("ph_events_t"), tShell("ph_events_d"), {text: tShell("ph_events_btn"), onclick: () => goRoute("home")}));
      else el.replaceChildren(emptyState(tShell("ph_" + tab + "_t"), tShell("ph_" + tab + "_d"), {text: tShell("ph_events_btn"), onclick: () => goRoute("home")}));
    },
    onLang(){ this.show(); }
  };
}
function render(r){
  if (S.routeKey) S.scroll[S.routeKey] = window.scrollY;
  const isTab = TABS.indexOf(r.name) >= 0;
  let def, el;
  if (isTab){
    const owner = TAB_OWNER[r.name];
    def = owner ? MODS[owner].spec : placeholderDef(r.name);
    el = owner ? document.getElementById(def.screen) : $("#shell-placeholder");
    S.tab = r.name;
  } else if (ROUTES[r.name]){
    def = ROUTES[r.name].def; el = document.getElementById(def.screen);
  } else { r = {name: "home", arg: ""}; return render(r); }
  closeSheet();
  $$("#appMain > .screen").forEach(s => { s.hidden = s !== el; });
  $("#shell-fatal").hidden = true;
  const key = routeKey(r), first = !S.shown[key];
  S.route = r; S.routeKey = key; S.def = def; S.shown[key] = true;
  const bar = isTab || def.tabBar === true;
  $("#tabbar").hidden = !bar; document.body.classList.toggle("no-tabbar", !bar);
  $("#backBtn").hidden = isTab;
  $$("#tabs .tab").forEach(b => { if (b.dataset.tab === S.tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  setTitle();
  let params = PARAMS, reason = "";
  if (S.notMember && r.name === "me"){                       // notMember(): the Me tab behaves as if opened by ?tab=me&signup=1
    S.notMember = false; reason = "notMember";
    params = new URLSearchParams(PARAMS); params.set("signup", "1");
  }
  if (def.show) def.show({first, arg: r.arg, params, reason});
  window.scrollTo(0, S.scroll[key] || 0);
}
function setTitle(){
  const def = S.def; let t = def && def.title ? def.title() : tShell("tab_" + S.tab);
  if (typeof t === "string") t = {title: t};
  $("#appTitle").textContent = t.title || "";
  $("#appSub").textContent = t.sub || ""; $("#appSub").hidden = !t.sub;
  document.title = (t.title || tShell("appName")) + " | " + (CONFIG.ORG_NAME || tShell("appName"));
}
function buildTabs(){
  $("#tabbar").setAttribute("aria-label", tShell("nav"));
  $("#tabs").replaceChildren(...TABS.map(tab => h("button", {type: "button", class: "tab", "data-tab": tab, id: "tab-" + tab, onclick: () => {
    if (S.route && S.route.name === tab) window.scrollTo({top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
    else goRoute(tab);
  }}, h("span", {class: "pill"}, icon(tab)), h("span", {class: "lbl", text: tShell("tab_" + tab)}), h("span", {class: "dot", hidden: true}))));
}
function setBadge(tab, on){ const d = $("#tab-" + tab + " .dot"); if (d) d.hidden = !on; }
$("#backBtn").addEventListener("click", () => { if (S.depth > 0) history.back(); else goRoute(S.tab); });

/* ---------- language and theme ---------- */
function applyLang(){
  document.documentElement.lang = S.lang;
  $("#langBtn").textContent = tShell("langBtn"); $("#langBtn").setAttribute("aria-label", tShell("langAria"));
  $("#backBtn").setAttribute("aria-label", tShell("back")); $("#avatarBtn").setAttribute("aria-label", tShell("avatar"));
  $("#demoBanner").textContent = tShell("demo");
  $$("#tabs .tab").forEach(b => { $(".lbl", b).textContent = tShell("tab_" + b.dataset.tab); });
  $("#tabbar").setAttribute("aria-label", tShell("nav"));
  Object.values(MODS).forEach(m => { if (m.spec && m.spec.onLang) m.spec.onLang(); });
  if (S.def && !TAB_OWNER[S.tab] && TABS.indexOf(S.route && S.route.name) >= 0 && S.def.onLang) S.def.onLang();
  setTitle();
}
function setLang(l){ S.lang = l === "en" ? "en" : "th"; store.set("app.lang", S.lang); applyLang(); }
function applyTheme(){
  if (S.theme === "light" || S.theme === "dark") document.documentElement.dataset.theme = S.theme;
  else delete document.documentElement.dataset.theme;
}
function setTheme(x){ S.theme = ["light", "dark"].indexOf(x) >= 0 ? x : "auto"; store.set("app.theme", S.theme); applyTheme(); }

/* ---------- header (LINE picture or initials) ---------- */
function renderAvatar(){
  const b = $("#avatarBtn"), initial = (S.name || "?").trim().charAt(0).toUpperCase();
  if (S.picture && /^https:\/\/[a-z0-9.-]+\.line-scdn\.net\//i.test(S.picture)){
    const img = h("img", {alt: "", src: S.picture + "/small", referrerpolicy: "no-referrer"});
    img.onerror = () => { b.replaceChildren(initial); };
    b.replaceChildren(img);
  } else b.replaceChildren(initial);
}
$("#avatarBtn").addEventListener("click", () => goRoute("me"));
$("#langBtn").addEventListener("click", () => setLang(S.lang === "th" ? "en" : "th"));

/* ---------- Me pieces the shell owns (a members Me screen reuses settingsPanel) ---------- */
function meCard(){
  const av = h("span", {class: "avatar", "aria-hidden": "true", style: "width:56px;height:56px;font-size:22px;cursor:default"});
  if (S.picture && /^https:\/\/[a-z0-9.-]+\.line-scdn\.net\//i.test(S.picture)) av.append(h("img", {alt: "", src: S.picture + "/small", referrerpolicy: "no-referrer"}));
  else av.textContent = (S.name || "?").trim().charAt(0).toUpperCase();
  return h("div", {class: "card", style: "display:flex;align-items:center;gap:14px"}, av,
    h("div", {style: "min-width:0"}, h("div", {class: "t-lead", id: "shell-me-name", text: S.name || " "}), h("div", {class: "t-small muted", text: tShell("fromLine")})));
}
function consentText(lang){
  const d = CONSENT[lang || S.lang] || CONSENT.th;
  return {version: CONSENT.version, consent: fill(d.consent || "", {org: CONFIG.ORG_NAME || tShell("orgFallback")}), small: d.consentSmall || ""};
}
function privacySheet(){
  const c = consentText();
  sheet(tShell("privTitle"),
    h("p", {class: "t-small muted", text: tShell("privVersion", {v: c.version})}),
    h("p", {text: c.consent}), h("p", {class: "t-small", text: c.small}),
    h("p", {class: "t-small", text: tShell("privDevice")}), h("p", {class: "t-small", text: tShell("privAsk")}));
}
// settingsPanel(opts): opts.memberRow true/false shows or hides "My membership card". By default it is hidden when a
// feature owns the Me tab (members shows the card there itself) and shown on the shell's placeholder Me.
function settingsPanel(opts){
  opts = opts || {};
  const memberRow = opts.memberRow != null ? !!opts.memberRow : !TAB_OWNER.me;
  const seg = (label, opts, current, pick) => h("div", {class: "seg small", role: "radiogroup", "aria-label": label},
    opts.map(([val, text]) => h("button", {type: "button", role: "radio", "aria-checked": val === current ? "true" : "false", "data-val": val,

/* ---------- panels: one feature's part inside another feature's screen (C1) ----------
   A route has one owner, but some screens show parts from several features, e.g. Manage (event-team owns the route
   "manage"): Participants (registration, order 10), Collaborators (event-team, 20), Expenses (reimbursement, 30).
   A feature adds its part while its screen.js loads:
     App.addPanel("manage", { order: 10, label: ctx => t("participants"), mount: (el, ctx) => { ...draw into el... } })
   and the host screen asks App.panelsFor("manage") (sorted by order) and calls mount(el, ctx) for the chosen one.
   name defaults to the feature's name (one panel per feature per host; a second one needs its own name starting with it).
   Who may see what is still decided by the server on every request: a panel only draws what its own actions return. */
const PANELS = {};
function addPanel(owner, host, p){
  if (!/^[a-z][a-z0-9-]*$/.test(String(host || ""))) throw new Error(owner + ": App.addPanel needs the host route or tab name");
  if (!p || typeof p.mount !== "function") throw new Error(owner + ": App.addPanel(" + host + ") needs mount(el, ctx)");
  const name = String(p.name || owner);
  if (name !== owner && name.indexOf(owner + "-") !== 0) throw new Error(owner + ": a panel name must be " + owner + " or start with " + owner + "-");
  const list = PANELS[host] || (PANELS[host] = []);
  if (list.some(x => x.name === name)) throw new Error("panel " + name + " is already added to " + host);
  list.push({name, owner, order: Number(p.order) || 50, label: typeof p.label === "function" ? p.label : (() => String(p.label || name)), mount: p.mount});
}
function panelsFor(host){ return (PANELS[host] || []).slice().sort((a, b) => a.order - b.order || (a.name < b.name ? -1 : 1)).map(x => Object.assign({}, x)); }

/* ---------- shared form pieces (C1; DESIGN.md "Form field", "Section toggle", "Detail screens") ----------
   Features may keep their own copies (members-field, events-field, event-team-input); new screens use these.
   CSS: .field, .input, .hint, .err, .req, .opt, .switch, .switch-row, .actionbar (base.css). */
let fieldSeq = 0;
// App.field({ label, control?: element, type?, value?, attrs?, required?, optional?, hint?, id? })
//  -> { el, input, setError(text | ""), value() }. Without control, a 48 px <input> is made (type "textarea" or "select" too).
function field(o){
  o = o || {};
  let c = o.control;
  if (!c){
    const tag = o.type === "textarea" ? "textarea" : o.type === "select" ? "select" : "input";
    c = h(tag, Object.assign({class: "input", type: tag === "input" ? (o.type || "text") : null, autocomplete: "off"}, o.attrs || {}),
      tag === "select" ? (o.options || []).map(([v, text]) => h("option", {value: v, text})) : null);
    if (o.value != null) c.value = o.value;
  } else if (!c.classList.contains("input") && /^(INPUT|SELECT|TEXTAREA)$/.test(c.tagName)) c.classList.add("input");
  if (!c.id) c.id = o.id || ("shell-f" + (++fieldSeq));
  const err = h("p", {class: "err", id: c.id + "-err", hidden: true});
  const hint = o.hint ? h("p", {class: "hint", id: c.id + "-hint", text: o.hint}) : null;
  c.setAttribute("aria-describedby", [hint ? c.id + "-hint" : "", c.id + "-err"].filter(Boolean).join(" "));
  if (o.required) c.setAttribute("aria-required", "true");
  const lab = h("label", {for: c.id}, o.label || "",
    o.required ? h("span", {class: "req", "aria-hidden": "true", text: " *"}) : o.optional ? h("span", {class: "opt", text: " (" + tShell("optional") + ")"}) : null);
  const el = h("div", {class: "field"}, lab, c, hint, err);
  return {
    el, input: c, value: () => String(c.value || "").trim(),
    setError(text){
      el.classList.toggle("bad", !!text); c.setAttribute("aria-invalid", text ? "true" : "false");
      if (text){ err.replaceChildren(icon("alert"), h("span", {text})); err.hidden = false; } else err.hidden = true;
    }
  };
}
// App.switch({ checked, label, onChange(on), id }) -> <button role="switch">; .checked to read, .set(on) to change
function makeSwitch(o){
  o = o || {};
  const b = h("button", {type: "button", class: "switch", role: "switch", id: o.id, "aria-label": o.label || null, "aria-checked": o.checked ? "true" : "false"}, h("span", {"aria-hidden": "true"}));
  Object.defineProperty(b, "checked", {get: () => b.getAttribute("aria-checked") === "true"});
  b.set = on => b.setAttribute("aria-checked", on ? "true" : "false");
  b.addEventListener("click", () => { b.set(!b.checked); if (o.onChange) o.onChange(b.checked); });
  return b;
}
// App.switchRow({ title, desc?, checked, onChange, id }) -> a row with title, one line and the switch (organizer section toggles)
function switchRow(o){
  o = o || {};
  const sw = makeSwitch({checked: o.checked, onChange: o.onChange, id: o.id, label: o.title});
  const row = h("div", {class: "switch-row"}, h("span", {class: "grow"}, h("b", {text: o.title || ""}), o.desc ? h("span", {class: "sub", text: o.desc}) : null), sw);
  row.switch = sw;
  return row;
}
// App.actionBar(primaryButton, secondaryButton?) -> the sticky bar at the bottom of a detail screen (72 px + safe area).
// Put it inside the screen's <section> so it disappears with the screen; a spacer keeps the last content visible.
function actionBar(...buttons){
  const bs = buttons.filter(Boolean);
  return h("div", {class: "actionbar-wrap"}, h("div", {class: "actionbar-space", "aria-hidden": "true"}),
    h("div", {class: "actionbar"}, h("div", {class: "in"}, ...bs)));
}

/* ---------- share sheet (C1): App.share({ text, url, title?, rows? }) ----------
   Rows: LINE (LINE's share screen, a friend or group picker; no LIFF setting needed), copy link, the phone's own share
   menu (when the phone has one). rows: extra rows a feature adds first, e.g. registration's Instagram story image:
   [{ icon: "camera", title, sub?, onclick, id? }]. Never put personal data in text or url (the link is all people need). */
async function copyText(text){
  try{ if (navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(text); return true; } }catch(e){}
  try{
    const ta = h("textarea", {readonly: true, style: "position:fixed;top:0;left:0;opacity:0"}); ta.value = text;
    document.body.append(ta); ta.select(); const ok = document.execCommand && document.execCommand("copy"); ta.remove(); return !!ok;
  }catch(e){ return false; }
}
function share(o){
  o = o || {};
  const url = String(o.url || ""), text = String(o.text || "");
  const msg = [text, url].filter(Boolean).join("\n");
  const row = (ic, title, sub, onclick, id) => h("button", {type: "button", class: "row share-row", id, onclick},
    h("span", {class: "share-tile", "aria-hidden": "true"}, icon(ic)), h("span", {class: "grow"}, h("span", {text: title}), sub ? h("span", {class: "sub", text: sub}) : null));
  const rows = (o.rows || []).map(r => row(r.icon || "share", r.title, r.sub, () => { closeSheet(); r.onclick(); }, r.id));
  rows.push(row("chat", tShell("shareLine"), tShell("shareLineSub"), () => { closeSheet(); openExternal("https://line.me/R/share?text=" + encodeURIComponent(msg)); }, "shell-share-line"));
  if (url) rows.push(row("copy", tShell("shareCopy"), tShell("shareCopySub"), async () => { const ok = await copyText(url); closeSheet(); toast(ok ? tShell("shareCopied") : url); }, "shell-share-copy"));
  if (navigator.share) rows.push(row("share", tShell("sharePhone"), tShell("sharePhoneSub"), () => { closeSheet(); navigator.share({title: o.title || text || undefined, text: text || undefined, url: url || undefined}).catch(() => {}); }, "shell-share-phone"));
  return sheet(o.title || tShell("shareTitle"), h("div", {class: "share-rows"}, ...rows));
}

e “All” tab.","statusT":"Track status","segEvents":"My events","segClaims":"My claims","stUpcoming":"Upcoming","stEnded":"Ended","stCancelled":"Cancelled","cPending":"Waiting for approval","cApproved":"Approved, payment pending","cRejected":"Not approved","cPaid":"Paid","stepSent":"Sent","stepApproved":"Approved","stepPaid":"Paid","stepRejected":"Not approved","rejectedHint":"Message the approvers in this chat to ask why.","refL":"Reference {ref}","sentL":"Sent {d}","itemsL":"{n} items","emptyEvT":"No registrations yet","emptyEvD":"Pick an event above to register.","emptyClT":"No claims yet","emptyClD":"Expense claims you send will show up here.","claimsWait":"Loading your latest claims (claims are never saved on the phone)","moreN":"Showing your latest {n}","newClaim":"New expense claim","refresh":"Refresh","todoConsent":"We updated the privacy notice (version {v}). Tap to read and accept. You can keep using the app."}}, function (App, t) {
// Home tab of the LINE app (moved from the old index.html landing page, 8 Nov 2026).
// Data: home.bootstrap (backend/features/home). The shell shows the copy saved on this phone first, then refreshes;
// the saved copy never holds claims (the shell removes any key about claims, PromptPay, payees or receipts).
const $ = App.$, h = App.h, F = App.fmt;
const S = { upTab: "all", stTab: "events" };
const screen = $("#home-screen");
const cfg = App.config;

const data = App.view({
  key: "home", action: "home.bootstrap", cache: true, el: $("#home-upList"),
  skeleton(){ $("#home-stats").replaceChildren(); $("#home-todo").replaceChildren(); $("#home-upList").replaceChildren(App.skeleton([114, 114])); $("#home-stList").replaceChildren(App.skeleton([96])); },
  render
});

function fillText(){ App.$$("[data-t]", screen).forEach(el => { el.textContent = t(el.dataset.t); }); $("#home-refresh").textContent = t("refresh"); $("#home-newClaim").replaceChildren(App.icon("plus"), t("newClaim")); }
function eventUrl(id){ return cfg.EVENT_JOIN_LIFF_URL ? cfg.EVENT_JOIN_LIFF_URL + "?event=" + encodeURIComponent(id) : ""; }
function setSeg(pairs){ pairs.forEach(([el, on]) => el.setAttribute("aria-selected", on ? "true" : "false")); }
const chip = (cls, ic, text) => h("span", {class: "chip " + cls}, ic ? App.icon(ic) : null, text);

function render(d, meta){
  const claimsKnown = Array.isArray(d.myClaims);           // not known while showing the saved copy (claims are never saved)
  const myClaims = claimsKnown ? d.myClaims : [];
  const canClaim = d.canClaim !== undefined ? d.canClaim : (d.role === "organizer" || d.role === "approver");
  const upcoming = d.upcoming || [], myEvents = d.myEvents || [];
  const todo = upcoming.filter(e => !e.myReference);
  const mine = myEvents.filter(e => e.status === "upcoming");
  const openClaims = myClaims.filter(c => c.status === "Pending" || c.status === "Approved");
  const showClaims = canClaim || myClaims.length > 0;

  // to-dos (consent v3 for members who accepted an older wording; sign-up.html asks again)
  $("#home-todo").replaceChildren(...(d.needsConsent ? [h("button", {type: "button", class: "banner", id: "home-consentTodo", onclick: () => App.link(cfg.JOIN_LIFF_URL)},
    App.icon("alert"), h("span", {text: t("todoConsent", {v: App.consent().version})}), App.icon("chevron"))] : []));
  App.setBadge("home", !!d.needsConsent);

  const stat = (n, label, hot, onclick, show) => show === false ? null :
    h("button", {type: "button", class: "stat" + (hot ? " hot" : ""), onclick}, h("b", {text: String(n)}), h("span", {text: label}));
  $("#home-stats").replaceChildren(...[
    stat(todo.length, t("sTodo"), todo.length > 0, () => { S.upTab = "todo"; data.rerender(); $("#home-secUpcoming").scrollIntoView({behavior: "smooth"}); }),
    stat(mine.length, t("sMine"), false, () => { S.stTab = "events"; data.rerender(); $("#home-secStatus").scrollIntoView({behavior: "smooth"}); }),
    stat(claimsKnown ? openClaims.length : "–", t("sClaims"), false, () => { S.stTab = "claims"; data.rerender(); $("#home-secStatus").scrollIntoView({behavior: "smooth"}); }, showClaims)
  ].filter(Boolean));

  // upcoming events
  $("#home-upAll").textContent = t("segAll", {n: upcoming.length}); $("#home-upTodo").textContent = t("segTodo", {n: todo.length});
  setSeg([[$("#home-upAll"), S.upTab === "all"], [$("#home-upTodo"), S.upTab === "todo"]]);
  const list = S.upTab === "todo" ? todo : upcoming;
  $("#home-upList").replaceChildren(...(list.length ? list.map(evRow) :
    [S.upTab === "todo" && upcoming.length ? App.emptyState(t("emptyTodoT"), t("emptyTodoD")) : App.emptyState(t("emptyUpT"), t("emptyUpD"))]));

  // status: my events / my claims
  if (!showClaims) S.stTab = "events";
  $("#home-stSeg").hidden = !showClaims;
  $("#home-stEvents").textContent = t("segEvents"); $("#home-stClaims").textContent = t("segClaims");
  setSeg([[$("#home-stEvents"), S.stTab === "events"], [$("#home-stClaims"), S.stTab === "claims"]]);
  let rows;
  if (S.stTab === "claims" && !claimsKnown) rows = [h("p", {class: "home-wait", text: t("claimsWait")})];
  else if (S.stTab === "claims") rows = myClaims.length ? myClaims.map(claimRow) : [App.emptyState(t("emptyClT"), t("emptyClD"))];
  else rows = myEvents.length ? myEvents.map(myEventRow) : [App.emptyState(t("emptyEvT"), t("emptyEvD"))];
  $("#home-stList").replaceChildren(...rows);
  const n = S.stTab === "claims" ? myClaims.length : myEvents.length;
  $("#home-stMore").hidden = n < 20; $("#home-stMore").textContent = t("moreN", {n});
  $("#home-newClaim").hidden = !(canClaim && S.stTab === "claims");
  $("#home-asOf").textContent = meta && meta.stale ? App.t("savedAt", {d: F.stamp(meta.at)}) : App.t("asOf", {d: F.dateTime(d.now)});
  S.firstName = d.firstName || "";
  App.setTitle();
}

function evChip(ev){
  if (ev.myReference) return chip("ok", "check", t("registered"));
  if (ev.regState === "open") return chip("info", "clock", t("regOpen", {d: F.dateTime(ev.regClose)}));
  if (ev.regState === "upcoming") return chip("warn", "clock", t("regUpcoming", {d: F.dateTime(ev.regOpen)}));
  return chip("", "x", t("regClosed"));
}
function evRow(ev){
  const when = [F.date(ev.date, {year: undefined}), ev.startTime].filter(Boolean).join(" · ");
  const first = String(ev.name || "").trim().split(/\s+/)[0] || "";
  return h("button", {type: "button", class: "card home-ev", "data-event": ev.id, onclick: () => App.open("event", ev.id, eventUrl(ev.id))},
    h("span", {class: "home-poster", "aria-hidden": "true", text: first}),
    h("span", {class: "home-evbody"},
      h("span", {class: "home-when", text: when}),
      h("span", {class: "home-name", text: ev.name}),
      ev.location ? h("span", {class: "home-meta"}, App.icon("pin"), h("span", {text: ev.location})) : null,
      evChip(ev)));
}
function myEventRow(r){
  const st = {upcoming: ["info", "clock", "stUpcoming"], ended: ["", "check", "stEnded"], cancelled: ["bad", "x", "stCancelled"]}[r.status] || ["", null, ""];
  const when = [F.date(r.date), F.time(r)].filter(Boolean).join(" · ");
  const body = [h("span", {class: "home-top"}, h("b", {text: r.eventName}), chip(st[0], st[1], t(st[2]))),
    when ? h("span", {class: "home-meta", text: when}) : null,
    r.location ? h("span", {class: "home-meta"}, App.icon("pin"), h("span", {text: r.location})) : null,
    h("span", {class: "home-meta", text: t("refL", {ref: r.reference})})];
  return r.status === "upcoming"
    ? h("button", {type: "button", class: "card stack", style: "gap:4px", "data-ref": r.reference, onclick: () => App.open("event", r.eventId, eventUrl(r.eventId))}, ...body)
    : h("div", {class: "card stack", style: "gap:4px", "data-ref": r.reference}, ...body);
}
function claimRow(c){
  const cls = {Pending: ["warn", "clock"], Approved: ["info", "check"], Rejected: ["bad", "x"], Paid: ["ok", "check"]}[c.status] || ["", null];
  const reached = {Pending: 1, Approved: 2, Paid: 3, Rejected: 1}[c.status] || 1;
  const step = (i, key, bad) => h("span", {class: "home-s" + (bad ? " home-bad" : i <= reached ? " home-done" : "")}, h("span", {class: "home-dot"}), t(key));
  const line = i => h("span", {class: "home-ln" + (c.status !== "Rejected" && i < reached ? " home-done" : "")});
  const steps = c.status === "Rejected"
    ? h("div", {class: "home-steps", "aria-hidden": "true"}, step(1, "stepSent"), line(1), step(2, "stepRejected", true))
    : h("div", {class: "home-steps", "aria-hidden": "true"}, step(1, "stepSent"), line(1), step(2, "stepApproved"), line(2), step(3, "stepPaid"));
  return h("div", {class: "card stack", style: "gap:4px", "data-ref": c.reference},
    h("span", {class: "home-top"}, h("b", {text: c.eventName}), chip(cls[0], cls[1], t("c" + c.status))),
    h("span", {class: "home-amount", text: F.money(c.total)}),
    h("span", {class: "home-meta", text: t("itemsL", {n: c.items}) + " · " + t("sentL", {d: F.dateTime(c.submittedAt)})}),
    h("span", {class: "home-meta", text: t("refL", {ref: c.reference})}),
    steps,
    c.status === "Rejected" ? h("span", {class: "home-hint", text: t("rejectedHint")}) : null);
}

$("#home-upAll").addEventListener("click", () => { S.upTab = "all"; data.rerender(); });
$("#home-upTodo").addEventListener("click", () => { S.upTab = "todo"; data.rerender(); });
$("#home-stEvents").addEventListener("click", () => { S.stTab = "events"; data.rerender(); });
$("#home-stClaims").addEventListener("click", () => { S.stTab = "claims"; data.rerender(); });
$("#home-newClaim").addEventListener("click", () => App.link(cfg.REIMBURSE_LIFF_URL));
$("#home-refresh").addEventListener("click", () => data.refresh());

App.register({
  name: "home",
  tab: "home",
  screen: "home-screen",
  title: () => ({sub: cfg.ORG_NAME || App.t("appName"), title: (S.firstName || App.user.name) ? t("hello", {name: S.firstName || App.user.name}) : t("helloPlain")}),
  show(ctx){ fillText(); if (ctx.first) data.start(); else data.refresh(); },
  onLang(){ fillText(); data.rerender(); }
});

const WIN = [["RegOpen", "regOpen", "fRegOpen"], ["RegClose", "regClose", "fRegClose"], ["PubFrom", "publishFrom", "fPubFrom"], ["PubUntil", "publishUntil", "fPubUntil"]];

function validate(v){

  const bad = [];
  const mark = (k, msg, focus) => { err(k, msg); bad.push(focus); };
  if (v.name.length < 2) mark("name", t("eName"), "fName");
  if (!/^\d{4}-\d{2}-\d{2}$/.test(v.date)) mark("date", t("eDate"), "fDate");

}
async function save(publish){
  if (S.saving || !S.form) return;
  const v = collect();
  if (!validate(v)) return;
  const f = S.form;
  S.saving = true; fx("saveBtn").disabled = true; fx("draftBtn").disabled = true;
  if (publish) fx("saveBtn").textContent = t("saving"); else fx("draftBtn").textContent = t("saving");
  try{
    const r = await App.api("event.save", {event: v, publish, poster: f.poster, removePoster: f.removePoster && !f.poster, expectedUpdatedAt: f.updatedAt});
    App.toast(t(f.id && f.status === "Approved" ? "savedToast" : publish ? "publishedToast" : "draftToast"));
    posters.delete(r.id);
    afterChange(r.id);
    S.form = null;
    App.go("event", r.id);
  }catch(e){
    fx("fErrBox").hidden = false; fx("fErrBox").replaceChildren(App.icon("alert"), h("span", {text: e.message}));

  }
}
// Poster: checked and resized on the phone (longest side 1600 px, JPEG), then checked again on the server (real image, 5 MB).
function readPoster(file){
  err("poster", "");
  if (!file) return;
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)){ err("poster", t("ePosterType")); return; }
  if (file.size > 20 * 1048576){ err("poster", t("ePosterBig")); return; }
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => {
    const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    const g = c.getContext("2d"); g.fillStyle = "#FFFFFF"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    const dataUrl = c.toDataURL("image/jpeg", 0.85), b64 = dataUrl.split(",")[1] || "";
    if (b64.length * 0.75 > 5 * 1048576){ err("poster", t("ePosterBig")); return; }
    S.form.poster = {type: "image/jpeg", data: b64}; S.form.removePoster = false;
    setPosterPreview(dataUrl);
  };
  img.onerror = () => { URL.revokeObjectURL(url); err("poster", t("ePosterRead")); };
  img.src = url;
}

function demoPhase(e, now){
  if (e.status === "Approved" && now >= e.date + " " + (e.endTime || "23:59")) return "past";
  if (e.status !== "Approved" || now < e.publishFrom || now >= e.publishUntil) return "hidden";
  return now >= e.regOpen && now < e.regClose ? "open" : "upcoming";
}
function demoEvent(e, mode, now, full){
  const manage = e.ownerMode && e.ownerMode === mode;
  const o = {id: e.id, name: e.name, date: e.date, startTime: e.startTime, endTime: e.endTime, location: e.location, regOpen: e.regOpen, regClose: e.regClose,
    regState: now < e.regOpen ? "upcoming" : now >= e.regClose ? "closed" : "open", hasPoster: false, phase: demoPhase(e, now),
    myReference: mode === "new" ? "" : e.myReference, canManage: !!manage, registered: e.registered || 0};
  if (manage) o.status = e.status;
  if (full){
    Object.assign(o, {description: e.description, mapUrl: e.mapUrl || "", organizer: e.organizer, sections: e.sections, isOwner: !!manage, canCancel: !!manage && e.status !== "Closed"});
    if ((manage || mode === "approver") && e.budget) o.budget = e.budget;
    else if (manage || mode === "approver") o.budget = {requested: null, approved: null, status: "", note: "", decidedAt: ""};
    o.canDecideBudget = mode === "approver" && !manage && !!e.budget && e.budget.status === "Requested";
    if (manage) o.edit = {regOpen: e.regOpen, regClose: e.regClose, publishFrom: e.publishFrom, publishUntil: e.publishUntil, updatedAt: e.updatedAt || "2026-11-01T10:00:00.000"};
  }
  return o;
}

    .sort((a, b) => (a.date + a.startTime).localeCompare(b.date + b.startTime));
  return {ok: true, now, role: staff ? mode : "participant", canCreate: staff, events};
};
App.demo["event.get"] = (body, mode) => {
  const now = bkkNow(), e = DEMO.events.find(x => x.id === body.eventId);

};
