*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai","Sarabun","Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;

.seg{display:flex;gap:4px;background:var(--field);border-radius:var(--r-md);padding:4px}

/* skeleton: field blocks at real sizes, no shimmer (DESIGN.md) */

</style>

<script>
/* =====================================================================
   LINE app shell (index.html). Owned by the core lane: features never edit this file.
   A feature adds screens with App.register (see DEVELOPING.md, "Adding a screen to the LINE app").
   What the shell does: bottom tabs and routing, Thai/English, light/dark, the app bar, skeletons,
   show-last-seen-then-refresh (App.view), the server session (App.api), toasts, sheets, settings.
   ===================================================================== */

/* ---------- settings: shared IDs and addresses come from config.js (one file for all pages) ---------- */
const SHARED = window.COMMUNITY_CONFIG || {}, SHARED_LIFF = SHARED.LIFF || {};
if (!window.COMMUNITY_CONFIG) console.warn("config.js not found or has an error: running in demo mode");
const cfgText = x => { x = typeof x === "string" ? x.trim() : ""; return /^YOUR-/i.test(x) ? "" : x; };
const cfgLiffId = x => cfgText(x).replace(/^https?:\/\/liff\.line\.me\//i, "").replace(/[\/?#].*$/, "");
const cfgLiffUrl = x => { const id = cfgLiffId(x); return id ? "https://liff.line.me/" + id : ""; };
const CONFIG = {
  LIFF_ID: cfgLiffId(SHARED_LIFF.home),                  // the app itself (the landing LIFF app)
  API_URL: cfgText(SHARED.API_URL),
  ORG_NAME: cfgText(SHARED.ORG_NAME),
  ADMIN_OA_ID: cfgText(SHARED.ADMIN_OA_ID),
  EVENT_JOIN_LIFF_URL: cfgLiffUrl(SHARED_LIFF.event),    // event-join.html (until the app has its own event page)
  REIMBURSE_LIFF_URL: cfgLiffUrl(SHARED_LIFF.reimburse), // expense-reimbursement.html
  JOIN_LIFF_URL: cfgLiffUrl(SHARED_LIFF.join),           // sign-up.html. People who are not approved members are sent here
  DEFAULT_LANG: "th",
  CACHE_DAYS: 30                                          // a saved copy older than this is not shown
};

/* ---------- small helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const store = {                                           // localStorage can be missing or full: never break the app
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const sleep = ms => new Promise(r => setTimeout(r, ms));
// Builds elements. Text is always set as text, never as HTML (people's text can't become markup).
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})){
    if (v == null || v === false) continue;
    if (k === "class") el.className = v; else if (k === "text") el.textContent = v;
    else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  kids.flat().forEach(c => { if (c != null && c !== false) el.append(c instanceof Node ? c : document.createTextNode(String(c))); });
  return el;
}

function look(dict, k){ return (dict[S.lang] && dict[S.lang][k] != null) ? dict[S.lang][k] : (dict.en && dict.en[k] != null) ? dict.en[k] : (dict.th && dict.th[k] != null) ? dict.th[k] : null; }

/* ---------- API: the LINE ID token on the first request, then the short server session ----------
   Code.gs checks the LINE ID token with LINE once and answers with a signed session (appSession, a few hours).
   Later requests send only the session; Code.gs checks its signature and expiry, and still checks membership
   and role on every request (architecture notes, principle 3 and 4). The session lives in memory only. */
class ApiError extends Error { constructor(m, c){ super(m); this.code = c; } }
const DEMO = {};                              // demo answers by action, added by features: App.demo["x.y"] = (body, mode) => reply
async function api(action, data){
  if (S.demo){
    await sleep(350);
    const fn = DEMO[action];
    if (!fn) throw new ApiError(tShell("errNet"), "VALIDATION");
    return JSON.parse(JSON.stringify(fn(data || {}, S.demoMode)));
  }
  await READY;
  for (let attempt = 0; attempt < 2; attempt++){
    const body = Object.assign({}, data, {action});
    const useSession = !!(S.session && S.session.exp * 1000 - Date.now() > 60e3);
    if (useSession) body.appSession = S.session.token; else { body.lineIdToken = S.token; body.wantSession = true; }
    let res;
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 60000);
    try{
      const r = await fetch(CONFIG.API_URL, {method: "POST", headers: {"Content-Type": "text/plain;charset=utf-8"}, body: JSON.stringify(body), signal: ctl.signal});
      res = await r.json();
    }catch(e){ throw new ApiError(tShell("errNet"), "NET"); }
    finally{ clearTimeout(to); }
    if (res && res.appSession){ S.session = res.appSession; delete res.appSession; }
    if (res && res.ok) return res;
    if (res && res.code === "SESSION" && useSession){ S.session = null; continue; }   // expired or replaced: once more with the LINE token
    const map = {AUTH: "errAuth", RATE: "errRate", SERVER: "errNet", SESSION: "errAuth"};
    throw new ApiError(map[res && res.code] ? tShell(map[res.code]) : (res && res.error) || tShell("errNet"), res && res.code);
  }
  throw new ApiError(tShell("errAuth"), "AUTH");
}

/* ---------- saved copy on this phone (show last seen, then refresh) ----------
   Never saved: anything about claims, PromptPay, payees, receipts, slips or bank details (any key with those words,
   at any depth), whatever a feature asks. One saved copy per LINE account (a hash of the LINE user ID, not the ID). */
const PRIVATE_KEY = /claim|promptpay|payee|receipt|slip|bank/i;
function scrub(v){
  if (Array.isArray(v)) return v.map(scrub);
  if (v && typeof v === "object"){ const o = {}; Object.keys(v).forEach(k => { if (!PRIVATE_KEY.test(k)) o[k] = scrub(v[k]); }); return o; }
  return v;
}
const cacheName = () => S.demo ? "app.saved.demo-" + S.demoMode.replace(/[^a-z]/g, "") : "app.saved";
function cacheRead(){ const c = store.get(cacheName()); return c && typeof c === "object" && c.items ? c : {owner: null, items: {}}; }
function cacheGet(key){
  const c = cacheRead();
  if (S.owner && c.owner && c.owner !== S.owner){ cacheClear(); return null; }
  const it = c.items[key];
  return it && Date.now() - it.at < CONFIG.CACHE_DAYS * 864e5 ? it : null;
}
function cachePut(key, data){
  let c = cacheRead();
  if (S.owner && c.owner !== S.owner) c = {owner: S.owner, items: {}};
  c.items[key] = {at: Date.now(), data: scrub(data)};
  if (JSON.stringify(c).length > 300000) return;          // too big for a phone: just don't save
  store.set(cacheName(), c);
}
function cacheClear(){ store.del(cacheName()); store.del("app.saved"); }
async function ownerOf(sub){
  if (!sub) return null;
  try{
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("hualaem:" + sub));
    return Array.from(new Uint8Array(buf)).slice(0, 12).map(b => b.toString(16).padStart(2, "0")).join("");
  }catch(e){ return null; }
}

/* App.view: one screen's data. Shows the saved copy at once (or a skeleton), then asks the server and shows the answer.
   o = { key, action, body?: () => ({...}), cache?: true, el?: container for the error state,
         skeleton?: () => void, render: (data, {stale, at}) => void, onError?: (err) => true if handled } */
const VIEWS = [];
function view(o){
  const v = {data: null, meta: null, busy: null};
  v.start = function(){
    if (!v.data){
      const c = o.cache ? cacheGet(o.key) : null;
      if (c){ v.data = c.data; v.meta = {stale: true, at: c.at}; o.render(v.data, v.meta); }
      else if (o.skeleton) o.skeleton();
    }
    return v.refresh();
  };
  v.refresh = function(){
    if (v.busy) return v.busy;
    syncing(1);
    v.busy = (async () => {
      try{
        const d = await api(o.action, o.body ? o.body() : {});
        v.data = d; v.meta = {stale: false, at: Date.now()};
        if (o.cache) cachePut(o.key, d);
        o.render(d, v.meta);
      }catch(e){
        if (e.code === "NOT_MEMBER"){ notMember(); return; }
        if (o.onError && o.onError(e)) return;
        if (v.data){ toast(v.meta && v.meta.stale ? tShell("offlineSaved") : e.message); return; }
        if (o.el) o.el.replaceChildren(emptyState(tShell("errLoad"), e.code === "AUTH" ? tShell("errAuth") : e.message, {text: tShell("retry"), onclick: () => v.refresh()}));
        else fatal(tShell("errLoad"), e.message);
      }finally{ syncing(-1); v.busy = null; }
    })();
    return v.busy;
  };
  v.rerender = () => { if (v.data) o.render(v.data, v.meta); };
  v.reset = () => { v.data = null; v.meta = null; if (o.skeleton) o.skeleton(); };
  VIEWS.push(v);
  return v;
}
function syncing(n){
  S.syncing = Math.max(0, S.syncing + n);
  const dot = $("#syncDot"); dot.hidden = S.syncing === 0; dot.title = tShell("syncing");
  $("#appMain").setAttribute("aria-busy", S.syncing ? "true" : "false");
}

/* ---------- registry: features plug in here ---------- */
const TABS = ["home", "events", "passport", "me"];
const MODS = {}, TAB_OWNER = {}, ROUTES = {};
let booted = false;
// Called by the build for each app/features/<name> folder: App.module("<name>", <text.json>, function (App, t) { ...screen.js... })
function defineModule(name, text, fn){
  if (MODS[name]) throw new Error("App module " + name + " is defined twice");
  MODS[name] = {name, text: text || {th: {}, en: {}}, spec: null};
  fn(App, textFor(MODS[name].text));
}
// spec = { name, tab?, screen?: "<id>", title?: () => string | {title, sub}, show?: (ctx) => void, onLang?: () => void,
//          routes?: { <route>: { screen: "<id>", title?, show?, tabBar?: false } } }
function register(spec){
  const m = MODS[spec && spec.name];
  if (!m) throw new Error("App.register: name must be the feature folder name");
  if (m.spec) throw new Error("App.register called twice by " + spec.name);
  if (spec.tab){
    if (TABS.indexOf(spec.tab) < 0) throw new Error(spec.name + ": unknown tab " + spec.tab);
    if (TAB_OWNER[spec.tab]) throw new Error("tab " + spec.tab + " is already owned by " + TAB_OWNER[spec.tab]);
    if (!spec.screen || !document.getElementById(spec.screen)) throw new Error(spec.name + ": screen element #" + spec.screen + " is missing");
    TAB_OWNER[spec.tab] = spec.name;
  }
  Object.keys(spec.routes || {}).forEach(r => {
    if (TABS.indexOf(r) >= 0 || ROUTES[r]) throw new Error(spec.name + ": route " + r + " is taken");
    if (!/^[a-z][a-z0-9-]*$/.test(r)) throw new Error(spec.name + ": route names are lowercase words");
    if (!document.getElementById(spec.routes[r].screen)) throw new Error(spec.name + ": screen element #" + spec.routes[r].screen + " is missing");
    ROUTES[r] = {mod: spec.name, def: spec.routes[r]};
  });
  m.spec = spec;
  if (booted && spec.tab === S.tab && S.route && S.route.name === spec.tab) render(S.route);
}

/* ---------- routing: #home #events #passport #me are tabs; #<route>/<id> are detail screens ----------
   Tab switches replace the address (no back-button history); detail screens push one step, so Back returns to the tab. */
function parseHash(){
  const raw = decodeURIComponent((location.hash || "").replace(/^#\/?/, ""));
  const i = raw.indexOf("/");
  const name = (i < 0 ? raw : raw.slice(0, i)).toLowerCase(), arg = i < 0 ? "" : raw.slice(i + 1);
  return name ? {name, arg} : null;
}
function initialRoute(){
  const fromHash = parseHash();
  if (fromHash) return fromHash;
  const tab = (PARAMS.get("tab") || "").toLowerCase();
  if (TABS.indexOf(tab) >= 0) return {name: tab, arg: ""};
  const ev = PARAMS.get("event");                          // old links: ...?event=ID opens the event page once a feature provides it
  if (ev && ROUTES.event) return {name: "event", arg: ev};
  return {name: "home", arg: ""};
}
function routeKey(r){ return r.name + (r.arg ? "/" + r.arg : ""); }
function goRoute(name, arg){
  const r = {name, arg: arg || ""}, isTab = TABS.indexOf(name) >= 0;
  if (!isTab && !ROUTES[name]) return false;
  if (S.liffDone){                                          // never touch the address while LINE login is still starting
    const url = location.pathname + location.search + "#" + encodeURIComponent(name) + (r.arg ? "/" + encodeURIComponent(r.arg) : "");
    if (isTab || !S.route || TABS.indexOf(S.route.name) < 0) history.replaceState(null, "", url);
    else { history.pushState(null, "", url); S.depth++; }
  }
  render(r);
  return true;
}
// Open a detail screen if a feature provides it, otherwise the old page (e.g. event-join.html) so nothing breaks meanwhile.
function open(route, arg, fallbackUrl){ if (ROUTES[route]) return goRoute(route, arg); go(fallbackUrl); return false; }
window.addEventListener("popstate", () => { S.depth = Math.max(0, S.depth - 1); render(parseHash() || {name: S.tab, arg: ""}); });

function placeholderDef(tab){
  return {
    title: () => tShell("tab_" + tab),
    show(){
      const el = $("#shell-placeholder");
      if (tab === "me") el.replaceChildren(meCard(), settingsPanel());
      else if (tab === "events") el.replaceChildren(emptyState(tShell("ph_events_t"), tShell("ph_events_d"), {text: tShell("ph_events_btn"), onclick: () => goRoute("home")}));
      else el.replaceChildren(emptyState(tShell("ph_" + tab + "_t"), tShell("ph_" + tab + "_d"), {text: tShell("ph_events_btn"), onclick: () => goRoute("home")}));
    },
    onLang(){ this.show(); }
  };
}
function render(r){
  if (S.routeKey) S.scroll[S.routeKey] = window.scrollY;
  const isTab = TABS.indexOf(r.name) >= 0;
  let def, el;
  if (isTab){
    const owner = TAB_OWNER[r.name];
    def = owner ? MODS[owner].spec : placeholderDef(r.name);
    el = owner ? document.getElementById(def.screen) : $("#shell-placeholder");
    S.tab = r.name;
  } else if (ROUTES[r.name]){
    def = ROUTES[r.name].def; el = document.getElementById(def.screen);
  } else { r = {name: "home", arg: ""}; return render(r); }
  closeSheet();
  $$("#appMain > .screen").forEach(s => { s.hidden = s !== el; });
  $("#shell-fatal").hidden = true;
  const key = routeKey(r), first = !S.shown[key];
  S.route = r; S.routeKey = key; S.def = def; S.shown[key] = true;
  const bar = isTab || def.tabBar === true;
  $("#tabbar").hidden = !bar; document.body.classList.toggle("no-tabbar", !bar);
  $("#backBtn").hidden = isTab;
  $$("#tabs .tab").forEach(b => { if (b.dataset.tab === S.tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  setTitle();
  if (def.show) def.show({first, arg: r.arg, params: PARAMS});
  window.scrollTo(0, S.scroll[key] || 0);
}
function setTitle(){
  const def = S.def; let t = def && def.title ? def.title() : tShell("tab_" + S.tab);
  if (typeof t === "string") t = {title: t};
  $("#appTitle").textContent = t.title || "";
  $("#appSub").textContent = t.sub || ""; $("#appSub").hidden = !t.sub;
  document.title = (t.title || tShell("appName")) + " | " + (CONFIG.ORG_NAME || tShell("appName"));
}
function buildTabs(){
  $("#tabbar").setAttribute("aria-label", tShell("nav"));
  $("#tabs").replaceChildren(...TABS.map(tab => h("button", {type: "button", class: "tab", "data-tab": tab, id: "tab-" + tab, onclick: () => {
    if (S.route && S.route.name === tab) window.scrollTo({top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
    else goRoute(tab);
  }}, h("span", {class: "pill"}, icon(tab)), h("span", {class: "lbl", text: tShell("tab_" + tab)}), h("span", {class: "dot", hidden: true}))));
}
function setBadge(tab, on){ const d = $("#tab-" + tab + " .dot"); if (d) d.hidden = !on; }

function meCard(){

  if (S.picture && /^https:\/\/[a-z0-9.-]+\.line-scdn\.net\//i.test(S.picture)) av.append(h("img", {alt: "", src: S.picture + "/small", referrerpolicy: "no-referrer"}));

function evRow(ev){
  const when = [F.date(ev.date, {year: undefined}), ev.startTime].filter(Boolean).join(" · ");
  const first = String(ev.name || "").trim().split(/\s+/)[0] || "";
  return h("button", {type: "button", class: "card home-ev", "data-event": ev.id, onclick: () => App.open("event", ev.id, eventUrl(ev.id))},
    h("span", {class: "home-poster", "aria-hidden": "true", text: first}),
    h("span", {class: "home-evbody"},
      h("span", {class: "home-when", text: when}),
      h("span", {class: "home-name", text: ev.name}),
      ev.location ? h("span", {class: "home-meta"}, App.icon("pin"), h("span", {text: ev.location})) : null,
      evChip(ev)));
}
function myEventRow(r){
  const st = {upcoming: ["info", "clock", "stUpcoming"], ended: ["", "check", "stEnded"], cancelled: ["bad", "x", "stCancelled"]}[r.status] || ["", null, ""];
  const when = [F.date(r.date), F.time(r)].filter(Boolean).join(" · ");
  const body = [h("span", {class: "home-top"}, h("b", {text: r.eventName}), chip(st[0], st[1], t(st[2]))),
    when ? h("span", {class: "home-meta", text: when}) : null,
    r.location ? h("span", {class: "home-meta"}, App.icon("pin"), h("span", {text: r.location})) : null,
    h("span", {class: "home-meta", text: t("refL", {ref: r.reference})})];
  return r.status === "upcoming"
    ? h("button", {type: "button", class: "card stack", style: "gap:4px", "data-ref": r.reference, onclick: () => App.open("event", r.eventId, eventUrl(r.eventId))}, ...body)
    : h("div", {class: "card stack", style: "gap:4px", "data-ref": r.reference}, ...body);
}
function claimRow(c){
  const cls = {Pending: ["warn", "clock"], Approved: ["info", "check"], Rejected: ["bad", "x"], Paid: ["ok", "check"]}[c.status] || ["", null];
  const reached = {Pending: 1, Approved: 2, Paid: 3, Rejected: 1}[c.status] || 1;
  const step = (i, key, bad) => h("span", {class: "home-s" + (bad ? " home-bad" : i <= reached ? " home-done" : "")}, h("span", {class: "home-dot"}), t(key));
  const line = i => h("span", {class: "home-ln" + (c.status !== "Rejected" && i < reached ? " home-done" : "")});
  const steps = c.status === "Rejected"
    ? h("div", {class: "home-steps", "aria-hidden": "true"}, step(1, "stepSent"), line(1), step(2, "stepRejected", true))
    : h("div", {class: "home-steps", "aria-hidden": "true"}, step(1, "stepSent"), line(1), step(2, "stepApproved"), line(2), step(3, "stepPaid"));
  return h("div", {class: "card stack", style: "gap:4px", "data-ref": c.reference},
    h("span", {class: "home-top"}, h("b", {text: c.eventName}), chip(cls[0], cls[1], t("c" + c.status))),
    h("span", {class: "home-amount", text: F.money(c.total)}),
    h("span", {class: "home-meta", text: t("itemsL", {n: c.items}) + " · " + t("sentL", {d: F.dateTime(c.submittedAt)})}),
    h("span", {class: "home-meta", text: t("refL", {ref: c.reference})}),
    steps,
    c.status === "Rejected" ? h("span", {class: "home-hint", text: t("rejectedHint")}) : null);
}

/* ---------- start: draw at once (saved copy or skeleton), then sign in with LINE, then refresh ---------- */
async function initLiff(){
  if (S.demo || !CONFIG.LIFF_ID || !window.liff){ S.name = "Kim (demo)"; S.owner = "demo"; return true; }
  await liff.init({liffId: CONFIG.LIFF_ID});
  if (!liff.isLoggedIn()){ liff.login({redirectUri: location.href}); return false; }
  S.inClient = liff.isInClient();
  S.token = liff.getIDToken();               // LINE ID token (openid scope); Code.gs checks it with LINE, then answers with a session
  const dec = (liff.getDecodedIDToken && liff.getDecodedIDToken()) || {};
  S.name = dec.name || ""; S.picture = dec.picture || "";
  let sub = dec.sub || "";
  if (!S.name || !sub){ try{ const p = await liff.getProfile(); S.name = S.name || p.displayName || ""; S.picture = S.picture || p.pictureUrl || ""; sub = sub || p.userId || ""; }catch(e){} }
  S.owner = await ownerOf(sub);
  if (!store.get("app.lang") && !store.get("home.lang")){ const l = ((liff.getLanguage && liff.getLanguage()) || "").toLowerCase(); if (l) S.lang = l.startsWith("th") ? "th" : "en"; }
  return true;
}
(async function boot(){
  S.lang = store.get("app.lang") || store.get("home.lang") || CONFIG.DEFAULT_LANG;
  S.theme = store.get("app.theme") || "auto";
  applyTheme();
  buildTabs();
  $("#tabbar").hidden = false;
  $("#demoBanner").hidden = !S.demo;
  applyLang();
  $("#shell-loading").hidden = true;
  booted = true;
  render(initialRoute());                    // instant: what this phone saw last time, or a skeleton
  try{ if (!(await initLiff())) return; }
  catch(e){ console.error(e); fatal(tShell("liffFail"), tShell("errLoadD")); return; }
  S.liffDone = true;
  // a saved copy from another LINE account on this phone is dropped before anything new is shown
  const c = store.get(cacheName());
  if (c && c.owner && S.owner && c.owner !== S.owner){ cacheClear(); VIEWS.forEach(v => { if (v.meta && v.meta.stale) v.reset(); }); }
  if (S.route) history.replaceState(null, "", location.pathname + location.search + "#" + encodeURIComponent(S.route.name) + (S.route.arg ? "/" + encodeURIComponent(S.route.arg) : ""));
  renderAvatar();
  applyLang();
  readyResolve();
})();
