/* =====================================================================
   Demo answers (no API_URL in config.js): ?demo=participant | organizer | approver. Amounts and names are made up.
   Event IDs follow event-team's demo (EV-DEMO-02 Board Game Night, EV-DEMO-03) and events' (EV-DEMO-01 has a budget
   waiting for approval, so an approver can try event.decideBudget).
   ===================================================================== */
const DEMO = (() => {
  const day = n => { const x = new Date(Date.now() + 7 * 3600e3); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
  const ev = (id, name, date, budget) => ({id, name, date, startTime: "13:00", endTime: "17:00", location: "บ้านหัวแหลม อโศก", status: "Approved", budget});
  const C = (reference, eventId, who, mine, status, first, category, total, items, ago) => ({reference, eventId, who, mine, status, first, category, total, items,
    submittedAt: day(-ago) + " 19:20", decidedAt: status === "Pending" ? "" : day(-ago + 1) + " 10:00", paidAt: status === "Paid" ? day(-ago + 2) + " 10:00" : ""});
  return {
    seq: 7, day,
    events: {
      "EV-DEMO-02": ev("EV-DEMO-02", "Board Game Night", day(0), {approved: 3500, requested: 3500, status: "Approved", note: "", decidedAt: day(-6) + " 10:00"}),
      "EV-DEMO-03": ev("EV-DEMO-03", "Hualaem-X Session", day(27), {approved: null, requested: null, status: "", note: "", decidedAt: ""}),
      "EV-DEMO-01": ev("EV-DEMO-01", "Board Game Night", day(13), {approved: null, requested: 3500, status: "Requested", note: "", decidedAt: ""})
    },
    claims: [
      C("RC-DEMO-0003", "EV-DEMO-02", "ฝน", false, "Approved", "อาหารว่าง", "food", 1250, 2, 3),
      C("RC-DEMO-0005", "EV-DEMO-02", "พี่เมฆ", true, "Pending", "บอร์ดเกมเช่า", "supplies", 890, 1, 1),
      C("RC-DEMO-0006", "EV-DEMO-01", "พี่อรุณ", false, "Pending", "ค่ามัดจำห้อง", "venue", 1000, 1, 2)
    ]
  };
})();
// who sees which event in demo mode (event-team's demo: organizer = lead of EV-DEMO-02, collaborator of EV-DEMO-03;
// participant = collaborator of EV-DEMO-02; approver = no team, sees everything)
function demoTeam(id, mode){ return mode === "organizer" ? (id === "EV-DEMO-02" ? "lead" : id === "EV-DEMO-03" ? "collaborator" : "") : mode === "participant" && id === "EV-DEMO-02" ? "collaborator" : ""; }
function demoSees(id, mode){ return mode === "approver" || !!demoTeam(id, mode); }
function demoMine(c, mode){ return mode === "organizer" ? c.mine : false; }
function demoTotals(claims, b){
  const t0 = {spent: 0, waiting: 0, approved: 0, paid: 0, rejected: 0, waitingCount: 0, count: 0};
  claims.forEach(c => { if (c.status === "Rejected"){ t0.rejected += c.total; return; } t0.count++; t0.spent += c.total;
    if (c.status === "Pending"){ t0.waiting += c.total; t0.waitingCount++; } if (c.status === "Approved") t0.approved += c.total; if (c.status === "Paid"){ t0.paid += c.total; t0.approved += c.total; } });
  t0.remaining = b.approved === null ? null : b.approved - t0.spent; t0.overBudget = b.approved !== null && t0.spent > b.approved;
  return t0;
}
function demoBudget(id, decision, note){
  const e = DEMO.events[id]; if (!e) return;
  e.budget = decision === "approve" ? Object.assign({}, e.budget, {approved: e.budget.requested, status: "Approved"}) : Object.assign({}, e.budget, {status: "Rejected", note: note || ""});
}
App.demo["expense.summary"] = (b, mode) => {
  const e = DEMO.events[b.eventId];
  if (!e) throw new App.ApiError(t("errGone"), "NOT_FOUND");
  if (!demoSees(e.id, mode)) throw new App.ApiError(t("notTeamD"), "FORBIDDEN");
  const claims = DEMO.claims.filter(c => c.eventId === e.id);
  const cat = {}; claims.filter(c => c.status !== "Rejected").forEach(c => { cat[c.category] = (cat[c.category] || 0) + c.total; });
  return {ok: true, now: DEMO.day(0) + " 10:00", event: {id: e.id, name: e.name, date: e.date, startTime: e.startTime, endTime: e.endTime, location: e.location, status: e.status},
    budget: e.budget, canDecideBudget: mode === "approver" && e.budget.status === "Requested", totals: demoTotals(claims, e.budget),
    byCategory: Object.keys(cat).map(k => ({category: k, amount: cat[k]})).sort((x, y) => y.amount - x.amount),
    claims: claims.map(c => Object.assign({}, c, {mine: demoMine(c, mode), canDecide: mode === "approver" && (c.status === "Pending" || c.status === "Approved")})),
    canClaim: mode === "organizer" || mode === "approver" || !!demoTeam(e.id, mode), isApprover: mode === "approver"};
};
App.demo["expense.list"] = (b, mode) => {
  const events = Object.keys(DEMO.events).filter(id => demoSees(id, mode)).map(id => {
    const e = DEMO.events[id], claims = DEMO.claims.filter(c => c.eventId === id), tot = demoTotals(claims, e.budget);
    const waitingForMe = mode === "approver" ? claims.filter(c => c.status === "Pending").length : 0, budgetWaits = mode === "approver" && e.budget.status === "Requested";
    return {id, name: e.name, date: e.date, startTime: e.startTime, status: e.status, myRole: demoTeam(id, mode), budget: e.budget, spent: tot.spent, remaining: tot.remaining,
      overBudget: tot.overBudget, waitingCount: tot.waitingCount, claimCount: tot.count, needsMe: waitingForMe > 0 || budgetWaits, waitingForMe, budgetWaits};
  }).sort((x, y) => (y.needsMe - x.needsMe) || y.date.localeCompare(x.date));
  return {ok: true, now: DEMO.day(0) + " 10:00", role: mode, isApprover: mode === "approver", canClaim: mode === "organizer" || mode === "approver" || events.length > 0, events};
};
App.demo["claim.get"] = (b, mode) => {
  const c = DEMO.claims.find(x => x.reference === b.reference);
  if (!c || !demoSees(c.eventId, mode)) throw new App.ApiError(t("errGone"), "NOT_FOUND");
  const mine = demoMine(c, mode), appr = mode === "approver", e = DEMO.events[c.eventId];
  const records = [{no: 1, date: DEMO.day(-4), category: c.category, description: c.first, amount: c.items > 1 ? c.total - 250 : c.total, receipt: ""}];
  if (c.items > 1) records.push({no: 2, date: DEMO.day(-4), category: "food", description: "น้ำดื่ม", amount: 250, receipt: ""});
  const canDecide = appr && (c.status === "Pending" || c.status === "Approved");
  return {ok: true, claim: Object.assign({}, c, {mine, canDecide, canApprove: canDecide && c.status === "Pending", canPay: canDecide && c.status === "Approved",
    note: c.status === "Pending" ? "ร้านไม่มีใบกำกับภาษี มีแต่บิลเงินสด" : "", decisionNote: "", eventId: c.eventId, eventName: e.name, records,
    payee: appr || mine ? {name: "[ชื่อบัญชี]", promptpay: "•••• 0000"} : undefined})};
};
App.demo["claim.decide"] = (b, mode) => {
  const c = DEMO.claims.find(x => x.reference === b.reference);
  if (mode !== "approver" || !c) throw new App.ApiError(t("errForbidden"), "FORBIDDEN");
  if (c.status !== b.expectedStatus) throw new App.ApiError(t("errConflict"), "CONFLICT");
  c.status = {approve: "Approved", reject: "Rejected", paid: "Paid"}[b.decision];
  return {ok: true, reference: c.reference, status: c.status, decidedAt: DEMO.day(0) + " 10:00"};
};
App.demo["claim.bootstrap"] = (b, mode) => {
  const events = Object.keys(DEMO.events).filter(id => mode === "organizer" || mode === "approver" || demoTeam(id, mode))
    .map(id => { const e = DEMO.events[id]; return {id, name: e.name, date: e.date, startTime: e.startTime, budget: e.budget.approved || 0, budgetStatus: e.budget.status, budgetRequested: e.budget.requested}; });
  const allowed = events.length > 0;
  return {ok: true, allowed, memberStatus: "approved", role: mode === "organizer" || mode === "approver" ? mode : "participant", lineName: "Kim (demo)", events: allowed ? events : [],
    limits: {maxItems: 10, maxReceiptMb: 8, categories: CATS}, payee: allowed ? null : undefined};
};
App.demo["claim.submit"] = (b, mode) => {
  const e = DEMO.events[b.event && b.event.id];
  if (!e) throw new App.ApiError("This event is not open for claims.", "VALIDATION");
  const total = (b.items || []).reduce((s, it) => s + Number(it.amount || 0), 0);
  const reference = "RC-DEMO-" + String(++DEMO.seq).padStart(4, "0");
  DEMO.claims.unshift({reference, eventId: e.id, who: mode === "organizer" ? "พี่เมฆ" : "Kim", mine: true, status: "Pending", first: (b.items[0] || {}).description || "",
    category: (b.items[0] || {}).category || "other", total, items: (b.items || []).length, submittedAt: DEMO.day(0) + " 10:00", decidedAt: "", paidAt: ""});
  return {ok: true, reference, duplicate: false, eventId: e.id, canSee: demoSees(e.id, mode)};
};
});
/* ---------- start: draw at once (saved copy or skeleton), then sign in with LINE, then refresh ---------- */
async function initLiff(){
  if (S.demo || !CONFIG.LIFF_ID || !window.liff){ S.name = "Kim (demo)"; S.owner = "demo"; return true; }
  await liff.init({liffId: CONFIG.LIFF_ID});
  if (!liff.isLoggedIn()){ liff.login({redirectUri: location.href}); return false; }
  S.inClient = liff.isInClient();
  S.token = liff.getIDToken();               // LINE ID token (openid scope); Code.gs checks it with LINE, then answers with a session
  const dec = (liff.getDecodedIDToken && liff.getDecodedIDToken()) || {};
  S.name = dec.name || ""; S.picture = dec.picture || "";
  let sub = dec.sub || "";
  if (!S.name || !sub){ try{ const p = await liff.getProfile(); S.name = S.name || p.displayName || ""; S.picture = S.picture || p.pictureUrl || ""; sub = sub || p.userId || ""; }catch(e){} }
  S.owner = await ownerOf(sub);
  if (!store.get("app.lang") && !store.get("home.lang")){ const l = ((liff.getLanguage && liff.getLanguage()) || "").toLowerCase(); if (l) S.lang = l.startsWith("th") ? "th" : "en"; }
  return true;
}
(async function boot(){
  S.lang = store.get("app.lang") || store.get("home.lang") || CONFIG.DEFAULT_LANG;
  S.theme = store.get("app.theme") || "auto";
  applyTheme();
  buildTabs();
  $("#tabbar").hidden = false;
  $("#demoBanner").hidden = !S.demo;
  applyLang();
  $("#shell-loading").hidden = true;
  booted = true;
  render(initialRoute());                    // instant: what this phone saw last time, or a skeleton
  try{ if (!(await initLiff())) return; }
  catch(e){ console.error(e); fatal(tShell("liffFail"), tShell("errLoadD")); return; }
  S.liffDone = true;
  // a saved copy from another LINE account on this phone is dropped before anything new is shown
  const c = store.get(cacheName());
  if (c && c.owner && S.owner && c.owner !== S.owner){ cacheClear(); VIEWS.forEach(v => { if (v.meta && v.meta.stale) v.reset(); }); }
  // the screen goes into the #hash; a ?<route>=<arg> link parameter already opened leaves the address (opened once)
  if (S.route) history.replaceState(null, "", location.pathname + searchLeft() + "#" + encodeURIComponent(S.route.name) + (S.route.arg ? "/" + encodeURIComponent(S.route.arg) : ""));
  renderAvatar();
  applyLang();
  readyResolve();
})();
