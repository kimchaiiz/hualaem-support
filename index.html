<script>
/* =====================================================================
   LINE app shell (index.html). Owned by the core lane: features never edit this file.
   A feature adds screens with App.register (see DEVELOPING.md, "Adding a screen to the LINE app").
   What the shell does: bottom tabs and routing, Thai/English, light/dark, the app bar, skeletons,
   show-last-seen-then-refresh (App.view), the server session (App.api), toasts, sheets, settings.
   ===================================================================== */

/* ---------- settings: shared IDs and addresses come from config.js (one file for all pages) ---------- */

// Builds elements. Text is always set as text, never as HTML (people's text can't become markup).
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})){
    if (v == null || v === false) continue;
    if (k === "class") el.className = v; else if (k === "text") el.textContent = v;
    else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  kids.flat().forEach(c => { if (c != null && c !== false) el.append(c instanceof Node ? c : document.createTextNode(String(c))); });
  return el;
}

function fill(s, v){ if (v) for (const [a, b] of Object.entries(v)) s = String(s).split("{" + a + "}").join(b); return s; }
function look(dict, k){ return (dict[S.lang] && dict[S.lang][k] != null) ? dict[S.lang][k] : (dict.en && dict.en[k] != null) ? dict.en[k] : (dict.th && dict.th[k] != null) ? dict.th[k] : null; }

/* ---------- API: the LINE ID token on the first request, then the short server session ----------
   Code.gs checks the LINE ID token with LINE once and answers with a signed session (appSession, a few hours).
   Later requests send only the session; Code.gs checks its signature and expiry, and still checks membership
   and role on every request (architecture notes, principle 3 and 4). The session lives in memory only. */
class ApiError extends Error { constructor(m, c){ super(m); this.code = c; } }
const DEMO = {};                              // demo answers by action, added by features: App.demo["x.y"] = (body, mode) => reply
async function api(action, data){
  if (S.demo){
    await sleep(350);
    const fn = DEMO[action];
    if (!fn) throw new ApiError(tShell("errNet"), "VALIDATION");
    return JSON.parse(JSON.stringify(fn(data || {}, S.demoMode)));
  }
  await READY;
  for (let attempt = 0; attempt < 2; attempt++){
    const body = Object.assign({}, data, {action});
    const useSession = !!(S.session && S.session.exp * 1000 - Date.now() > 60e3);
    if (useSession) body.appSession = S.session.token; else { body.lineIdToken = S.token; body.wantSession = true; }
    let res;
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 60000);
    try{
      const r = await fetch(CONFIG.API_URL, {method: "POST", headers: {"Content-Type": "text/plain;charset=utf-8"}, body: JSON.stringify(body), signal: ctl.signal});
      res = await r.json();
    }catch(e){ throw new ApiError(tShell("errNet"), "NET"); }
    finally{ clearTimeout(to); }
    if (res && res.appSession){ S.session = res.appSession; delete res.appSession; }
    if (res && res.ok) return res;
    if (res && res.code === "SESSION" && useSession){ S.session = null; continue; }   // expired or replaced: once more with the LINE token
    const map = {AUTH: "errAuth", RATE: "errRate", SERVER: "errNet", SESSION: "errAuth"};
    throw new ApiError(map[res && res.code] ? tShell(map[res.code]) : (res && res.error) || tShell("errNet"), res && res.code);
  }
  throw new ApiError(tShell("errAuth"), "AUTH");
}

/* ---------- saved copy on this phone (show last seen, then refresh) ----------
   Never saved: anything about claims, PromptPay, payees, receipts, slips or bank details (any key with those words,
   at any depth), whatever a feature asks. One saved copy per LINE account (a hash of the LINE user ID, not the ID). */
const PRIVATE_KEY = /claim|promptpay|payee|receipt|slip|bank/i;
function scrub(v){
  if (Array.isArray(v)) return v.map(scrub);
  if (v && typeof v === "object"){ const o = {}; Object.keys(v).forEach(k => { if (!PRIVATE_KEY.test(k)) o[k] = scrub(v[k]); }); return o; }
  return v;
}
const cacheName = () => S.demo ? "app.saved.demo-" + S.demoMode.replace(/[^a-z]/g, "") : "app.saved";
function cacheRead(){ const c = store.get(cacheName()); return c && typeof c === "object" && c.items ? c : {owner: null, items: {}}; }
function cacheGet(key){
  const c = cacheRead();
  if (S.owner && c.owner && c.owner !== S.owner){ cacheClear(); return null; }
  const it = c.items[key];
  return it && Date.now() - it.at < CONFIG.CACHE_DAYS * 864e5 ? it : null;
}
function cachePut(key, data){
  let c = cacheRead();
  if (S.owner && c.owner !== S.owner) c = {owner: S.owner, items: {}};
  c.items[key] = {at: Date.now(), data: scrub(data)};
  if (JSON.stringify(c).length > 300000) return;          // too big for a phone: just don't save
  store.set(cacheName(), c);
}
function cacheClear(){ store.del(cacheName()); store.del("app.saved"); }
async function ownerOf(sub){
  if (!sub) return null;
  try{
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("hualaem:" + sub));
    return Array.from(new Uint8Array(buf)).slice(0, 12).map(b => b.toString(16).padStart(2, "0")).join("");
  }catch(e){ return null; }
}

/* App.view: one screen's data. Shows the saved copy at once (or a skeleton), then asks the server and shows the answer.
   o = { key, action, body?: () => ({...}), cache?: true, el?: container for the error state,
         skeleton?: () => void, render: (data, {stale, at}) => void, onError?: (err) => true if handled } */
const VIEWS = [];
function view(o){
  const v = {data: null, meta: null, busy: null};
  v.start = function(){
    if (!v.data){
      const c = o.cache ? cacheGet(o.key) : null;
      if (c){ v.data = c.data; v.meta = {stale: true, at: c.at}; o.render(v.data, v.meta); }
      else if (o.skeleton) o.skeleton();
    }
    return v.refresh();
  };
  v.refresh = function(){
    if (v.busy) return v.busy;
    syncing(1);
    v.busy = (async () => {
      try{
        const d = await api(o.action, o.body ? o.body() : {});
        v.data = d; v.meta = {stale: false, at: Date.now()};
        if (o.cache) cachePut(o.key, d);
        o.render(d, v.meta);
      }catch(e){
        if (e.code === "NOT_MEMBER"){ notMember(); return; }
        if (o.onError && o.onError(e)) return;
        if (v.data){ toast(v.meta && v.meta.stale ? tShell("offlineSaved") : e.message); return; }
        if (o.el) o.el.replaceChildren(emptyState(tShell("errLoad"), e.code === "AUTH" ? tShell("errAuth") : e.message, {text: tShell("retry"), onclick: () => v.refresh()}));
        else fatal(tShell("errLoad"), e.message);
      }finally{ syncing(-1); v.busy = null; }
    })();
    return v.busy;
  };
  v.rerender = () => { if (v.data) o.render(v.data, v.meta); };
  v.reset = () => { v.data = null; v.meta = null; if (o.skeleton) o.skeleton(); };
  VIEWS.push(v);
  return v;
}
function syncing(n){
  S.syncing = Math.max(0, S.syncing + n);
  const dot = $("#syncDot"); dot.hidden = S.syncing === 0; dot.title = tShell("syncing");
  $("#appMain").setAttribute("aria-busy", S.syncing ? "true" : "false");
}

/* ---------- registry: features plug in here ---------- */
const TABS = ["home", "events", "passport", "me"];
const MODS = {}, TAB_OWNER = {}, ROUTES = {};
let booted = false;
// Called by the build for each app/features/<name> folder: App.module("<name>", <text.json>, function (App, t) { ...screen.js... })
function defineModule(name, text, fn){
  if (MODS[name]) throw new Error("App module " + name + " is defined twice");
  MODS[name] = {name, text: text || {th: {}, en: {}}, spec: null};
  fn(App, textFor(MODS[name].text));
}
// spec = { name, tab?, screen?: "<id>", title?: () => string | {title, sub}, show?: (ctx) => void, onLang?: () => void,
//          routes?: { <route>: { screen: "<id>", title?, show?, tabBar?: false } } }
function register(spec){
  const m = MODS[spec && spec.name];
  if (!m) throw new Error("App.register: name must be the feature folder name");
  if (m.spec) throw new Error("App.register called twice by " + spec.name);
  if (spec.tab){
    if (TABS.indexOf(spec.tab) < 0) throw new Error(spec.name + ": unknown tab " + spec.tab);
    if (TAB_OWNER[spec.tab]) throw new Error("tab " + spec.tab + " is already owned by " + TAB_OWNER[spec.tab]);
    if (!spec.screen || !document.getElementById(spec.screen)) throw new Error(spec.name + ": screen element #" + spec.screen + " is missing");
    TAB_OWNER[spec.tab] = spec.name;
  }
  Object.keys(spec.routes || {}).forEach(r => {
    if (TABS.indexOf(r) >= 0 || ROUTES[r]) throw new Error(spec.name + ": route " + r + " is taken");
    if (!/^[a-z][a-z0-9-]*$/.test(r)) throw new Error(spec.name + ": route names are lowercase words");
    if (!document.getElementById(spec.routes[r].screen)) throw new Error(spec.name + ": screen element #" + spec.routes[r].screen + " is missing");
    ROUTES[r] = {mod: spec.name, def: spec.routes[r]};
  });
  m.spec = spec;
  if (booted && spec.tab === S.tab && S.route && S.route.name === spec.tab) render(S.route);
}

/* ---------- routing: #home #events #passport #me are tabs; #<route>/<id> are detail screens ----------
   Tab switches replace the address (no back-button history); detail screens push one step, so Back returns to the tab. */
function parseHash(){
  const raw = decodeURIComponent((location.hash || "").replace(/^#\/?/, ""));
  const i = raw.indexOf("/");
  const name = (i < 0 ? raw : raw.slice(0, i)).toLowerCase(), arg = i < 0 ? "" : raw.slice(i + 1);
  return name ? {name, arg} : null;
}
function initialRoute(){
  const fromHash = parseHash();
  if (fromHash) return fromHash;
  const tab = (PARAMS.get("tab") || "").toLowerCase();
  if (TABS.indexOf(tab) >= 0) return {name: tab, arg: ""};
  const ev = PARAMS.get("event");                          // old links: ...?event=ID opens the event page once a feature provides it
  if (ev && ROUTES.event) return {name: "event", arg: ev};
  return {name: "home", arg: ""};
}
function routeKey(r){ return r.name + (r.arg ? "/" + r.arg : ""); }
function goRoute(name, arg){
  const r = {name, arg: arg || ""}, isTab = TABS.indexOf(name) >= 0;
  if (!isTab && !ROUTES[name]) return false;
  if (S.liffDone){                                          // never touch the address while LINE login is still starting
    const url = location.pathname + location.search + "#" + encodeURIComponent(name) + (r.arg ? "/" + encodeURIComponent(r.arg) : "");
    if (isTab || !S.route || TABS.indexOf(S.route.name) < 0) history.replaceState(null, "", url);
    else { history.pushState(null, "", url); S.depth++; }
  }
  render(r);
  return true;
}
// Open a detail screen if a feature provides it, otherwise the old page (e.g. event-join.html) so nothing breaks meanwhile.
function open(route, arg, fallbackUrl){ if (ROUTES[route]) return goRoute(route, arg); go(fallbackUrl); return false; }
window.addEventListener("popstate", () => { S.depth = Math.max(0, S.depth - 1); render(parseHash() || {name: S.tab, arg: ""}); });

function placeholderDef(tab){
  return {
    title: () => tShell("tab_" + tab),
    show(){
      const el = $("#shell-placeholder");
      if (tab === "me") el.replaceChildren(meCard(), settingsPanel());
      else if (tab === "events") el.replaceChildren(emptyState(tShell("ph_events_t"), tShell("ph_events_d"), {text: tShell("ph_events_btn"), onclick: () => goRoute("home")}));
      else el.replaceChildren(emptyState(tShell("ph_" + tab + "_t"), tShell("ph_" + tab + "_d"), {text: tShell("ph_events_btn"), onclick: () => goRoute("home")}));
    },
    onLang(){ this.show(); }
  };
}
function render(r){
  if (S.routeKey) S.scroll[S.routeKey] = window.scrollY;
  const isTab = TABS.indexOf(r.name) >= 0;
  let def, el;
  if (isTab){
    const owner = TAB_OWNER[r.name];
    def = owner ? MODS[owner].spec : placeholderDef(r.name);
    el = owner ? document.getElementById(def.screen) : $("#shell-placeholder");
    S.tab = r.name;
  } else if (ROUTES[r.name]){
    def = ROUTES[r.name].def; el = document.getElementById(def.screen);
  } else { r = {name: "home", arg: ""}; return render(r); }
  closeSheet();
  $$("#appMain > .screen").forEach(s => { s.hidden = s !== el; });
  $("#shell-fatal").hidden = true;
  const key = routeKey(r), first = !S.shown[key];
  S.route = r; S.routeKey = key; S.def = def; S.shown[key] = true;
  const bar = isTab || def.tabBar === true;
  $("#tabbar").hidden = !bar; document.body.classList.toggle("no-tabbar", !bar);
  $("#backBtn").hidden = isTab;
  $$("#tabs .tab").forEach(b => { if (b.dataset.tab === S.tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  setTitle();
  if (def.show) def.show({first, arg: r.arg, params: PARAMS});
  window.scrollTo(0, S.scroll[key] || 0);
}
function setTitle(){
  const def = S.def; let t = def && def.title ? def.title() : tShell("tab_" + S.tab);
  if (typeof t === "string") t = {title: t};
  $("#appTitle").textContent = t.title || "";
  $("#appSub").textContent = t.sub || ""; $("#appSub").hidden = !t.sub;
  document.title = (t.title || tShell("appName")) + " | " + (CONFIG.ORG_NAME || tShell("appName"));
}
function buildTabs(){
  $("#tabbar").setAttribute("aria-label", tShell("nav"));
  $("#tabs").replaceChildren(...TABS.map(tab => h("button", {type: "button", class: "tab", "data-tab": tab, id: "tab-" + tab, onclick: () => {
    if (S.route && S.route.name === tab) window.scrollTo({top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
    else goRoute(tab);
  }}, h("span", {class: "pill"}, icon(tab)), h("span", {class: "lbl", text: tShell("tab_" + tab)}), h("span", {class: "dot", hidden: true}))));

    stat(mine.length, t("sMine"), false, () => { S.stTab = "events"; data.rerender(); $("#home-secStatus").scrollIntoView({behavior: "smooth"}); }),
    stat(claimsKnown ? openClaims.length : "–", t("sClaims"), false, () => { S.stTab = "claims"; data.rerender(); $("#home-secStatus").scrollIntoView({behavior: "smooth"}); }, showClaims)
  ].filter(Boolean));

  // upcoming events
  $("#home-upAll").textContent = t("segAll", {n: upcoming.length}); $("#home-upTodo").textContent = t("segTodo", {n: todo.length});
  setSeg([[$("#home-upAll"), S.upTab === "all"], [$("#home-upTodo"), S.upTab === "todo"]]);
  const list = S.upTab === "todo" ? todo : upcoming;
  $("#home-upList").replaceChildren(...(list.length ? list.map(evRow) :
    [S.upTab === "todo" && upcoming.length ? App.emptyState(t("emptyTodoT"), t("emptyTodoD")) : App.emptyState(t("emptyUpT"), t("emptyUpD"))]));

  // status: my events / my claims
  if (!showClaims) S.stTab = "events";
  $("#home-stSeg").hidden = !showClaims;
  $("#home-stEvents").textContent = t("segEvents"); $("#home-stClaims").textContent = t("segClaims");
  setSeg([[$("#home-stEvents"), S.stTab === "events"], [$("#home-stClaims"), S.stTab === "claims"]]);
  let rows;
  if (S.stTab === "claims" && !claimsKnown) rows = [h("p", {class: "home-wait", text: t("claimsWait")})];
  else if (S.stTab === "claims") rows = myClaims.length ? myClaims.map(claimRow) : [App.emptyState(t("emptyClT"), t("emptyClD"))];
  else rows = myEvents.length ? myEvents.map(myEventRow) : [App.emptyState(t("emptyEvT"), t("emptyEvD"))];
  $("#home-stList").replaceChildren(...rows);
  const n = S.stTab === "claims" ? myClaims.length : myEvents.length;
  $("#home-stMore").hidden = n < 20; $("#home-stMore").textContent = t("moreN", {n});
  $("#home-newClaim").hidden = !(canClaim && S.stTab === "claims");
  $("#home-asOf").textContent = meta && meta.stale ? App.t("savedAt", {d: F.stamp(meta.at)}) : App.t("asOf", {d: F.dateTime(d.now)});
  S.firstName = d.firstName || "";
  App.setTitle();
}

function evChip(ev){
  if (ev.myReference) return chip("ok", "check", t("registered"));
  if (ev.regState === "open") return chip("info", "clock", t("regOpen", {d: F.dateTime(ev.regClose)}));
  if (ev.regState === "upcoming") return chip("warn", "clock", t("regUpcoming", {d: F.dateTime(ev.regOpen)}));
  return chip("", "x", t("regClosed"));
}
function evRow(ev){
  const when = [F.date(ev.date, {year: undefined}), ev.startTime].filter(Boolean).join(" · ");
  const first = String(ev.name || "").trim().split(/\s+/)[0] || "";
  return h("button", {type: "button", class: "card home-ev", "data-event": ev.id, onclick: () => App.open("event", ev.id, eventUrl(ev.id))},
    h("span", {class: "home-poster", "aria-hidden": "true", text: first}),
    h("span", {class: "home-evbody"},
      h("span", {class: "home-when", text: when}),
      h("span", {class: "home-name", text: ev.name}),
      ev.location ? h("span", {class: "home-meta"}, App.icon("pin"), h("span", {text: ev.location})) : null,
      evChip(ev)));
}
function myEventRow(r){
  const st = {upcoming: ["info", "clock", "stUpcoming"], ended: ["", "check", "stEnded"], cancelled: ["bad", "x", "stCancelled"]}[r.status] || ["", null, ""];
  const when = [F.date(r.date), F.time(r)].filter(Boolean).join(" · ");
  const body = [h("span", {class: "home-top"}, h("b", {text: r.eventName}), chip(st[0], st[1], t(st[2]))),
    when ? h("span", {class: "home-meta", text: when}) : null,
    r.location ? h("span", {class: "home-meta"}, App.icon("pin"), h("span", {text: r.location})) : null,
    h("span", {class: "home-meta", text: t("refL", {ref: r.reference})})];
  return r.status === "upcoming"
    ? h("button", {type: "button", class: "card stack", style: "gap:4px", "data-ref": r.reference, onclick: () => App.open("event", r.eventId, eventUrl(r.eventId))}, ...body)
    : h("div", {class: "card stack", style: "gap:4px", "data-ref": r.reference}, ...body);
}
function claimRow(c){
  const cls = {Pending: ["warn", "clock"], Approved: ["info", "check"], Rejected: ["bad", "x"], Paid: ["ok", "check"]}[c.status] || ["", null];
  const reached = {Pending: 1, Approved: 2, Paid: 3, Rejected: 1}[c.status] || 1;
  const step = (i, key, bad) => h("span", {class: "home-s" + (bad ? " home-bad" : i <= reached ? " home-done" : "")}, h("span", {class: "home-dot"}), t(key));
  const line = i => h("span", {class: "home-ln" + (c.status !== "Rejected" && i < reached ? " home-done" : "")});
  const steps = c.status === "Rejected"
    ? h("div", {class: "home-steps", "aria-hidden": "true"}, step(1, "stepSent"), line(1), step(2, "stepRejected", true))
    : h("div", {class: "home-steps", "aria-hidden": "true"}, step(1, "stepSent"), line(1), step(2, "stepApproved"), line(2), step(3, "stepPaid"));
  return h("div", {class: "card stack", style: "gap:4px", "data-ref": c.reference},
    h("span", {class: "home-top"}, h("b", {text: c.eventName}), chip(cls[0], cls[1], t("c" + c.status))),
    h("span", {class: "home-amount", text: F.money(c.total)}),
    h("span", {class: "home-meta", text: t("itemsL", {n: c.items}) + " · " + t("sentL", {d: F.dateTime(c.submittedAt)})}),
    h("span", {class: "home-meta", text: t("refL", {ref: c.reference})}),
    steps,
    c.status === "Rejected" ? h("span", {class: "home-hint", text: t("rejectedHint")}) : null);
}

function money(v){

  if (s === "") return "";

function validate(v){
  clearErrors();
  const bad = [];
  const mark = (k, msg, focus) => { err(k, msg); bad.push(focus); };
  if (v.name.length < 2) mark("name", t("eName"), "fName");
  if (!/^\d{4}-\d{2}-\d{2}$/.test(v.date)) mark("date", t("eDate"), "fDate");
  else if (!v.id && v.date < bkkNow().slice(0, 10)) mark("date", t("ePast"), "fDate");
  if (v.startTime && v.endTime && v.endTime <= v.startTime) mark("time", t("eTime"), "fEnd");
  if (v.location.length < 2) mark("place", t("ePlace"), "fPlace");
  if (v.budgetRequested === null) mark("budget", t("eBudget"), "fBudget");
  if (v.sections.sessions && (!v.sections.sessionNames.length || v.sections.sessionNames.length > 10)) mark("sessions", t("eSessions"), "fSessions");
  if (!v.regOpen || !v.regClose || v.regClose <= v.regOpen || !v.publishFrom || !v.publishUntil || v.publishUntil <= v.publishFrom){
    err("windows", t("eWindows")); bad.push("fRegClose"); fx("adv").hidden = false; fx("advBtn").setAttribute("aria-expanded", "true");

// Poster: checked and resized on the phone (longest side 1600 px, JPEG), then checked again on the server (real image, 5 MB).
function readPoster(file){
  err("poster", "");
  if (!file) return;
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)){ err("poster", t("ePosterType")); return; }
  if (file.size > 20 * 1048576){ err("poster", t("ePosterBig")); return; }
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => {
    const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    const g = c.getContext("2d"); g.fillStyle = "#FFFFFF"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    const dataUrl = c.toDataURL("image/jpeg", 0.85), b64 = dataUrl.split(",")[1] || "";
    if (b64.length * 0.75 > 5 * 1048576){ err("poster", t("ePosterBig")); return; }
    S.form.poster = {type: "image/jpeg", data: b64}; S.form.removePoster = false;
    setPosterPreview(dataUrl);
  };
  img.onerror = () => { URL.revokeObjectURL(url); err("poster", t("ePosterRead")); };
  img.src = url;
}

App.demo["event.get"] = (body, mode) => {

/* invite link: made on the server (one time, expires), shared through LINE's share screen or copied */
let making = false;
async function makeInvite(btn){
  if (making) return;
  making = true; const old = btn.lastChild ? btn.querySelector(".grow").textContent : "";
  btn.disabled = true; btn.querySelector(".grow").textContent = t("making");
  try{
    const r = await App.api("team.invite", {eventId: S.eventId});
    showInvite(r);
    if (S.data){ S.data.openInvites = (S.data.openInvites || 0) + 1; renderTeam(S.data); }
  }catch(e){ App.toast(errText(e)); if (e.code === "FORBIDDEN" || e.code === "CLOSED") manageView.refresh(); }
  finally{ making = false; btn.disabled = false; if (btn.isConnected) btn.querySelector(".grow").textContent = old; }
}
function showInvite(r){
  const url = inviteUrl(r.token);
  const text = t("inviteMsg", {event: S.data ? S.data.event.name : ""}) + "\n" + url;
  const input = h("input", {class: "event-team-input", id: "event-team-linkInput", type: "text", readonly: true, value: url, onfocus: e => e.target.select()});
  App.sheet(t("inviteT"),
    h("p", {text: t("inviteD", {d: F.dateTime(r.expiresAt)})}),
    h("label", {class: "event-team-lbl", for: "event-team-linkInput", text: t("linkLabel")}), input,
    h("div", {class: "event-team-btns", style: "margin-top:16px"},
      h("button", {type: "button", class: "btn", id: "event-team-sendLine", onclick: () => App.openExternal("https://line.me/R/share?text=" + encodeURIComponent(text))}, App.icon("chat"), t("inviteSend")),
      h("button", {type: "button", class: "btn secondary", id: "event-team-copy", onclick: () => copyLink(url, input)}, ico("copy"), t("inviteCopy"))));
}
async function copyLink(url, input){
  try{ await navigator.clipboard.writeText(url); App.toast(t("copied")); return; }catch(e){}
  try{ input.focus(); input.select(); if (document.execCommand && document.execCommand("copy")){ App.toast(t("copied")); return; } }catch(e){}
  App.toast(t("copyFail"));
}
function askCancelInvites(){
  const n = S.data ? S.data.openInvites : 0;
  App.sheet(t("cancelInvT"), h("p", {text: t("cancelInvD", {n})}),
    h("div", {class: "event-team-btns"}, h("button", {type: "button", class: "btn", id: "event-team-cancelInvOk", onclick: async e => {
      const b = e.currentTarget; busyBtn(b, true, t("busy"));

    }, text: t("cancelInvBtn")})));
}

/* search by name (lead who is an organizer or approver) and promote from participants */
function resultRow(x, via){
  const name = x.name + (x.nickname ? " (" + x.nickname + ")" : "");
  const done = () => chip("ok", "check", t("onTeam"));
  const btn = x.onTeam ? done() : h("button", {type: "button", class: "btn secondary", "aria-label": t("addAria", {name}), text: t("addBtn"), onclick: async e => {
    const b = e.currentTarget; busyBtn(b, true, t("busy"));
    try{
      const r = await App.api("team.add", {eventId: S.eventId, ref: x.ref, via});
      x.onTeam = true; b.replaceWith(done()); afterChange(r);
      App.toast(t("addedToast", {name: r.added || x.name}));
    }catch(err){ busyBtn(b, false, t("addBtn")); App.toast(errText(err)); }
  }});
  return h("div", {class: "event-team-result", "data-ref": x.ref},
    h("span", {class: "event-team-av", "aria-hidden": "true", text: initial(x)}),
    h("span", {class: "event-team-who"}, h("b", {text: name})), btn);
}
const note = text => h("p", {class: "event-team-note", text});
function openSearch(){
  const input = h("input", {class: "event-team-input", id: "event-team-q", type: "search", autocomplete: "off", enterkeyhint: "search", placeholder: t("searchPh")});
  const out = h("div", {class: "event-team-sheetlist", id: "event-team-results", "aria-live": "polite"});
  let timer = 0, seq = 0;
  async function run(){
    const q = input.value.trim(), my = ++seq;
    if (q.length < 2){ out.replaceChildren(); return; }
    out.replaceChildren(note(t("searching")));
    try{
      const r = await App.api("team.search", {eventId: S.eventId, q});
      if (my !== seq) return;
      const rows = r.results.length ? r.results.map(x => resultRow(x, "search")) : [note(t("searchNone"))];
      if (r.more) rows.push(note(t("searchMore", {n: r.results.length})));
      out.replaceChildren(...rows);
    }catch(e){ if (my === seq) out.replaceChildren(note(errText(e))); }
  }
  input.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(run, 350); });
  input.addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); clearTimeout(timer); run(); } });
  App.sheet(t("searchT"), h("label", {class: "event-team-lbl", for: "event-team-q", text: t("searchLabel")}), input,
    h("p", {class: "event-team-hint", text: t("searchHint")}), out);
  input.focus();
}
async function openPeople(){
  const out = h("div", {class: "event-team-sheetlist", id: "event-team-peopleList", "aria-live": "polite"}, note(t("loading")));
  App.sheet(t("peopleT"), out);
  try{
    const r = await App.api("team.participants", {eventId: S.eventId});
    out.replaceChildren(...(r.results.length ? r.results.map(x => resultRow(x, "participant")) : [note(t("peopleEmpty"))]));
  }catch(e){ out.replaceChildren(note(errText(e))); }
}
function askRemove(p){
  App.sheet(t("removeT", {name: p.name}), h("p", {text: t("removeD", {name: p.name})}),
    h("div", {class: "event-team-btns"}, h("button", {type: "button", class: "btn", id: "event-team-removeOk", text: t("removeBtn"), onclick: async e => {
      const b = e.currentTarget; busyBtn(b, true, t("busy"));
      try{ const r = await App.api("team.remove", {eventId: S.eventId, ref: p.ref}); App.closeSheet(); afterChange(r); App.toast(t("removedToast", {name: r.removed || p.name})); }
      catch(x){ busyBtn(b, false, t("removeBtn")); App.toast(errText(x)); if (x.code === "NOT_FOUND"){ App.closeSheet(); manageView.refresh(); } }
    }})));
}

/* ---------- #team-join/<token>: accept an invite link ---------- */
async function loadJoin(){
  S.join = null; S.joinErr = "";
  if (!/^[a-f0-9]{40}$/i.test(S.joinToken)){ S.joinState = "invalid"; renderJoin(); return; }
  S.joinState = "loading"; renderJoin();
  try{ S.join = await App.api("team.invitePreview", {token: S.joinToken}); S.joinState = S.join.state; }
  catch(e){
    if (e.code === "NOT_MEMBER"){ App.notMember(); return; }
    S.joinState = e.code === "NOT_FOUND" ? "invalid" : "error"; S.joinErr = e.message;
  }
  renderJoin();
}
function renderJoin(){
  const body = $("#event-team-joinBody"), st = S.joinState, d = S.join || {};
  const center = (iconEl, title, text, ...btns) => h("div", {class: "card stack event-team-center"}, iconEl, h("h2", {text: title}), text ? h("p", {text}) : null, ...btns);
  const home = h("button", {type: "button", class: "btn secondary", id: "event-team-goHome", onclick: () => App.go("home"), text: t("goHome")});
  if (st === "loading") return body.replaceChildren(App.skeleton([120, 180]));
  if (st === "error") return body.replaceChildren(App.emptyState(App.t("errLoad"), S.joinErr, {text: App.t("retry"), onclick: loadJoin}));
  if (st === "invalid") return body.replaceChildren(center(h("span", {class: "event-team-done", style: "background:var(--error-soft);color:var(--error)"}, App.icon("alert")), t("invalidT"), t("invalidD"), home));
  if (["used", "expired", "cancelled", "closed"].indexOf(st) >= 0) {
    return body.replaceChildren(center(h("span", {class: "event-team-done", style: "background:var(--warning-soft);color:var(--warning)"}, App.icon("clock")), t(st + "T"), t("askNew"), home));
  }
  if (st === "joined" || st === "already") {
    return body.replaceChildren(center(h("span", {class: "event-team-done"}, App.icon("check")), t(st === "joined" ? "joinedT" : "alreadyT"), st === "joined" ? t("joinedD") : "",
      h("button", {type: "button", class: "btn", id: "event-team-goManage", onclick: () => App.go("manage", d.eventId), text: t("goManage")})));
  }
  const ev = d.event || {};
  body.replaceChildren(
    h("p", {class: "t-lead", style: "margin:0", text: d.leadName ? t("joinLead", {name: d.leadName}) : t("joinLeadNone")}),
    h("div", {class: "card event-team-headcard", style: "margin:0"},
      h("span", {class: "event-team-when", text: when(ev)}),
      h("span", {class: "event-team-name", text: ev.name || ""}),
      ev.location ? h("span", {class: "event-team-meta"}, App.icon("pin"), h("span", {text: ev.location})) : null),
    h("div", {class: "card stack"},
      h("b", {text: t("joinCan")}),
      h("ul", {class: "event-team-steps"}, ["joinCan1", "joinCan2", "joinCan3"].map(k => h("li", {}, App.icon("check"), h("span", {text: t(k)})))),
      h("p", {class: "event-team-note", style: "margin:0", text: t("joinPdpa")})),
    d.expiresAt ? h("p", {class: "event-team-note", style: "margin:0", text: t("joinExpires", {d: F.dateTime(d.expiresAt)})}) : null,
    h("button", {type: "button", class: "btn", id: "event-team-accept", onclick: e => accept(e.currentTarget), text: t("joinBtn")}));
}
async function accept(btn){
  busyBtn(btn, true, t("joining"));
  try{
    const r = await App.api("team.acceptInvite", {token: S.joinToken});
    S.join = Object.assign({}, S.join, {eventId: r.eventId}); S.joinState = r.already ? "already" : "joined";
    renderJoin();
  }catch(e){
    if (e.code === "NOT_MEMBER"){ App.notMember(); return; }
    const st = {USED: "used", EXPIRED: "expired", CANCELLED: "cancelled", CLOSED: "closed"}[e.code];
    if (st){ S.joinState = st; renderJoin(); return; }
    busyBtn(btn, false, t("joinBtn")); App.toast(errText(e));
  }
}

/* ---------- links from outside the app: ?teamjoin=<token>, ?manage=1, ?manage=<eventId> ----------
   The shell opens ?event=ID and ?tab=x by itself; these two are read here once LINE login is done (core request: a general
   ?<route>=<arg> in the shell). The parameter is removed from the address so a reload or Back doesn't open it again. */
function dropParam(name){
  try{
    const p = new URLSearchParams(location.search); if (!p.has(name)) return;
    p.delete(name); const q = p.toString();
    history.replaceState(history.state, "", location.pathname + (q ? "?" + q : "") + location.hash);
  }catch(e){}
}
App.ready.then(() => {
  const p = new URLSearchParams(location.search), tok = p.get("teamjoin"), man = p.get("manage");
  if (tok != null){ dropParam("teamjoin"); if (!/^#team-join\//.test(location.hash)) App.go("team-join", tok); return; }
  if (man != null){ dropParam("manage"); if (!/^#manage/.test(location.hash)) App.go("manage", /^[A-Za-z0-9_-]{1,40}$/.test(man) && man !== "1" ? man : ""); }
});

        $("#event-team-listView").hidden = !!id; $("#event-team-detailView").hidden = !id;
        if (!id){ S.eventId = ""; App.setTitle(); return ctx.first ? listView.start() : listView.refresh(); }
        if (id !== S.eventId){ S.eventId = id; S.data = null; S.panel = ""; manageView.reset(); App.setTitle(); }
        return manageView.refresh();
      }
    },
    "team-join": {
      screen: "event-team-join",
      title: () => t("joinT"),
      show(ctx){
        const tok = String(ctx.arg || "");
        if (tok !== S.joinToken || !S.joinState){ S.joinToken = tok; loadJoin(); } else renderJoin();
      }
    }
  },
  onLang(){
    if (!$("#event-team-listView").hidden) listView.rerender();
    if (S.data) renderManage();
    if (S.joinState) renderJoin();
  }
});

/* ---------- demo answers (no API_URL in config.js): ?demo=organizer = the lead, ?demo=participant = a collaborator ----------
   Every name below is made up. */
const DEMO = (() => {
  const d = new Date(), iso = n => { const x = new Date(d); x.setDate(x.getDate() + n); return x.toISOString().slice(0, 10); };
  const P = (ref, name, nickname) => ({ref, name, nickname});
  return {
    iso,
    events: {
      "EV-DEMO-02": {id: "EV-DEMO-02", name: "Board Game Night", date: iso(0), startTime: "13:00", endTime: "17:00", location: "บ้านหัวแหลม อโศก", status: "Approved"},
      "EV-DEMO-03": {id: "EV-DEMO-03", name: "Hualaem-X Session", date: iso(27), startTime: "13:00", endTime: "16:00", location: "บ้านหัวแหลม อโศก + ออนไลน์", status: "Approved"}
    },
    lead: P("r-lead", "เมฆา ส.", "พี่เมฆ"),
    team: {"EV-DEMO-02": [P("r-fon", "ฝนทิพย์ ก.", "ฝน")], "EV-DEMO-03": []},
    people: [P("r-mint", "ปภาวี ส.", "มิ้นท์"), P("r-oat", "อรรถพล ก.", "โอ๊ต"), P("r-nat", "ณัฐชา ร.", "แนท"), P("r-poom", "ภูมิ ท.", "ภูมิ")],
    others: [P("r-hom", "ข้าวหอม พ.", "หอม"), P("r-wipa", "วิภา บ.", "วิว")],
    invites: 0
  };
})();
function demoRole(id, mode){ return mode === "organizer" ? (id === "EV-DEMO-02" ? "lead" : "collaborator") : (id === "EV-DEMO-02" ? "collaborator" : ""); }
function demoManage(id, mode){
  const ev = DEMO.events[id], role = ev ? demoRole(id, mode) : "";
  if (!ev) throw new App.ApiError("Event not found.", "NOT_FOUND");
  if (!role) throw new App.ApiError("You are not on the team of this event.", "FORBIDDEN");
  const meLead = role === "lead";
  const lead = Object.assign({role: "lead", isMe: meLead}, id === "EV-DEMO-02" ? DEMO.lead : {ref: "r-other", name: "อรุณ ท.", nickname: "พี่อรุณ"});
  const team = [lead].concat(DEMO.team[id].map(p => Object.assign({role: "collaborator", isMe: !meLead && p.ref === "r-fon"}, p)));
  if (!meLead && id === "EV-DEMO-03") team.push({ref: "r-me", name: "สมชาย ใ.", nickname: "ชาย", role: "collaborator", isMe: true});
  return {ok: true, now: DEMO.iso(0) + " 10:00", event: ev, myRole: role, editable: true, canEdit: meLead, canRemove: meLead, canSearch: meLead,
    team, max: 20, openInvites: meLead ? DEMO.invites : 0, inviteHours: 72};
}
const onTeam = (id, ref) => ref === "r-lead" || DEMO.team[id].some(p => p.ref === ref);
App.demo["team.mine"] = (b, mode) => ({ok: true, now: DEMO.iso(0) + " 10:00", events: Object.keys(DEMO.events).filter(id => demoRole(id, mode))
  .map(id => Object.assign({}, DEMO.events[id], {myRole: demoRole(id, mode), teamCount: 1 + DEMO.team[id].length + (mode !== "organizer" && id === "EV-DEMO-03" ? 1 : 0), past: false}))});
App.demo["team.manage"] = (b, mode) => demoManage(b.eventId, mode);
App.demo["team.invite"] = () => { DEMO.invites++; return {ok: true, token: "a".repeat(40), expiresAt: DEMO.iso(3) + " 10:00", inviteHours: 72}; };
App.demo["team.cancelInvites"] = () => { const n = DEMO.invites; DEMO.invites = 0; return {ok: true, cancelled: n}; };
App.demo["team.search"] = b => {
  const q = String(b.q || "").trim().toLowerCase();
  if (q.length < 2) return {ok: true, results: [], tooShort: true};
  const all = DEMO.people.concat(DEMO.others, DEMO.team[b.eventId] || []);
  return {ok: true, results: all.filter(p => (p.name + " " + p.nickname).toLowerCase().indexOf(q) >= 0).map(p => Object.assign({onTeam: onTeam(b.eventId, p.ref)}, p)), more: false};
};
App.demo["team.participants"] = b => ({ok: true, results: DEMO.people.map(p => Object.assign({onTeam: onTeam(b.eventId, p.ref)}, p))});
App.demo["team.add"] = (b, mode) => {
  const p = DEMO.people.concat(DEMO.others).find(x => x.ref === b.ref);
  if (!p) throw new App.ApiError("This member was not found. Search again.", "NOT_FOUND");
  const already = onTeam(b.eventId, p.ref);
  if (!already) DEMO.team[b.eventId].push(p);
  return Object.assign(demoManage(b.eventId, mode), {added: already ? "" : p.name, already});
};
App.demo["team.remove"] = (b, mode) => {
  const list = DEMO.team[b.eventId], i = list.findIndex(x => x.ref === b.ref);
  if (i < 0) throw new App.ApiError("This person is not a collaborator of this event (any more).", "NOT_FOUND");
  const p = list.splice(i, 1)[0];
  return Object.assign(demoManage(b.eventId, mode), {removed: p.name});
};
// demo tokens: "a" x 40 = a fresh link, "b" x 40 = used, "c" x 40 = expired
App.demo["team.invitePreview"] = b => {
  const tok = String(b.token || "");
  const st = tok === "a".repeat(40) ? "open" : tok === "b".repeat(40) ? "used" : tok === "c".repeat(40) ? "expired" : "";
  if (!st) throw new App.ApiError("This invite link is not valid.", "NOT_FOUND");
  return {ok: true, now: DEMO.iso(0) + " 10:00", state: st, eventId: "", expiresAt: st === "open" ? DEMO.iso(3) + " 10:00" : "",
    event: st === "open" ? DEMO.events["EV-DEMO-03"] : null, leadName: st === "open" ? "อรุณ ท." : ""};
};
App.demo["team.acceptInvite"] = () => ({ok: true, already: false, eventId: "EV-DEMO-03"});

/* ---------- form pieces (DESIGN.md "Form field": label above, red *, 48 tall, error under with an icon) ---------- */
let uid = 0;
function field(key, control, o){

function input(key, value, attrs){

function choices(key, options, value, cols3, onPick){
  const name = "members-c-" + key + "-" + (++uid);

  options.forEach(([v, text]) => {

    radio.checked = v === value;
    const lab = h("label", {class: "members-choice" + (v === value ? " members-sel" : "")}, radio, cols3 ? null : h("span", {class: "members-dot", "aria-hidden": "true"}), h("span", {text}));
    radio.addEventListener("change", () => {
      App.$$("label", box).forEach(l => l.classList.toggle("members-sel", l.contains(radio)));
      if (onPick) onPick(v);

}

// One question, by name
function question(key, v){
  v = v || {};

  if (key === "lastName") return field(key, input(key, v.lastName, {autocomplete: "family-name", maxlength: 60}));
  if (key === "nickname") return field(key, input(key, v.nickname, {autocomplete: "nickname", maxlength: 40}));
  if (key === "birthDate") return field(key, input(key, v.birthDate, {type: "date", min: "1930-01-01", max: today()}));
  if (key === "homeProvince") {
    const opts = PROVINCES.map(([th, e]) => [th, en() ? e : th]).sort((a, b) => a[1].localeCompare(b[1], en() ? "en" : "th")).concat([["ต่างประเทศ", t("abroad")]]);
    return field(key, select(key, opts, v.homeProvince));

  if (key === "phone") return field(key, input(key, v.phone, {type: "tel", inputmode: "tel", autocomplete: "tel", maxlength: 20, placeholder: t("ph_phone")}));
  if (key === "email") return field(key, input(key, v.email, {type: "email", inputmode: "email", autocomplete: "email", maxlength: 120, placeholder: t("ph_email"), autocapitalize: "off"}));

  if (key === "hsGrade") return field(key, select(key, [1, 2, 3, 4, 5, 6].map(n => [String(n), t("grade", {n})]), v.hsGrade));

  const ph = {hsProgram: t("ph_hsProgram"), otherNow: t("ph_otherNow")}[key];

// Current status + the one matching study/work section (changing status clears the other answers, brief 10.2)

/* ---------- reading and checking a form (same rules as the server; the server checks again) ---------- */
function read(root){
  const out = {};
  App.$$("input[type=text],input[type=tel],input[type=email],input[type=date],select", root).forEach(el => { out[el.name] = el.value.trim(); });
  App.$$("input[type=radio]:checked", root).forEach(el => { out[el.dataset.key] = el.value; });
  App.$$("fieldset[data-key]", root).forEach(fs => { if (!(fs.dataset.key in out)) out[fs.dataset.key] = ""; });
  if ("instagram" in out) out.instagram = out.instagram.replace(/^@+/, "");
  return out;
}
function problem(k, v){
  if (!v) return OPTIONAL[k] ? null : (k === "title" || k === "currentStatus" ? "errPick" : "errReq");
  if (k === "phone"){ let d = v.replace(/\D/g, ""); if (/^66\d{9}$/.test(d)) d = "0" + d.slice(2); return /^0\d{8,9}$/.test(d) ? null : "errPhone"; }
  if (k === "email") return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v) ? null : "errEmail";
  if (k === "instagram") return /^[A-Za-z0-9._]{1,30}$/.test(v) ? null : "errIg";
  if (k === "birthDate") return /^\d{4}-\d{2}-\d{2}$/.test(v) && v >= "1930-01-01" && v <= today() ? null : "errDate";
  if ((k === "hsSchool" || k === "uniName" || k === "company") && v.length < 2) return "errReq";
  return null;
}
function check(root){
  const vals = read(root);
  let first = null;
  App.$$("[data-key].members-field", root).forEach(f => {
    const k = f.dataset.key, msg = problem(k, vals[k]);
    const err = $(".members-err", f);
    f.classList.toggle("members-bad", !!msg);
    if (msg){ err.replaceChildren(App.icon("alert"), t(msg)); err.hidden = false; if (!first) first = f; }
    else err.hidden = true;
    const c = $(".members-input", f); if (c) c.setAttribute("aria-invalid", msg ? "true" : "false");
  });
  return {vals, first};
}
function clearErr(e){
  const f = e.target.closest && e.target.closest(".members-field");
  if (f && f.classList.contains("members-bad")){ f.classList.remove("members-bad"); const err = $(".members-err", f); if (err) err.hidden = true; }
}
function focusFirst(f){
  f.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center"});
  const c = $("input,select", f); if (c) setTimeout(() => c.focus({preventScroll: true}), 250);
}

  if (st.member) drawMe(st.member); else meBody.replaceChildren(App.skeleton([56, 400]));
}
function statusChip(d){
  const sid = d.serviceId || "";
  if (d.status === "approved") return h("span", {class: "chip ok", id: "members-chip"}, App.icon("check"), t("chipMember", {sid}));
  if (d.status === "pending") return h("span", {class: "chip warn", id: "members-chip"}, App.icon("clock"), t("chipPending", {sid}));
  if (d.status === "rejected") return h("span", {class: "chip bad", id: "members-chip"}, App.icon("alert"), t("chipRejected", {sid}));
  return null;
}
function drawMe(d){
  if (!meBody) return;
  // decorate the shell's LINE card with the membership chip (and the role, if any)
  const info = meCardEl && meCardEl.lastChild;
  if (info){
    const old = $("#members-chips"); if (old) old.remove();
    const roleChip = d.status === "approved" && (d.role === "organizer" || d.role === "approver") ? h("span", {class: "chip info", text: t(d.role === "organizer" ? "chipOrganizer" : "chipApprover")}) : null;
    const chip = statusChip(d);
    if (chip || roleChip) info.append(h("div", {class: "members-chip-row", id: "members-chips"}, chip, roleChip));
  }
  App.setBadge("me", (d.status === "approved" || d.status === "pending") && !!d.needsProfile);

  if (d.status === "none"){
    meBody.replaceChildren(h("div", {class: "card members-status"}, h("b", {text: t("noneT")}), h("span", {class: "t-small muted", text: t("noneD")}),
      h("button", {type: "button", class: "btn", id: "members-join", onclick: () => App.go("signup"), text: t("noneBtn")})));
    return;
  }
  if (d.status === "rejected"){
    meBody.replaceChildren(h("div", {class: "card members-status"}, h("b", {text: t("rejectedT")}), h("span", {class: "t-small muted", text: t("rejectedD", {sid: d.serviceId})}),
      h("button", {type: "button", class: "btn secondary", onclick: () => copy(d.serviceId), text: t("copySid")})));
    return;
  }
  const kids = [];
  if (d.status === "pending") kids.push(h("div", {class: "banner info"}, App.icon("clock"), h("span", {text: t("pendingBanner")})));
  if (!d.consentCurrent) kids.push(h("button", {type: "button", class: "banner", id: "members-todo", onclick: () => App.go("signup")}, App.icon("alert"), h("span", {text: t("consentBanner", {v: App.consent().version})}), App.icon("chevron")));
  else if (d.needsProfile) kids.push(h("button", {type: "button", class: "banner", id: "members-todo", onclick: () => App.go("signup")}, App.icon("alert"), h("span", {text: t("missingBanner", {n: (d.missing || []).length})}), App.icon("chevron")));
  const p = d.profile || {};
  const miss = k => !p[k];
  const row = (key, group, value, missing) => h("button", {type: "button", class: "row", "data-group": group, id: "members-row-" + key, onclick: () => editGroup(group)},
    h("span", {class: "grow"}, h("span", {class: "members-row-k", text: label(key)}),
      h("span", {class: "members-row-v" + (missing ? " members-missing" : ""), text: missing ? t("notFilled") : value})), App.icon("chevron", "chev"));
  const fullName = [titleText(p.title || ""), en() && p.title ? " " : "", p.firstName || "", " ", p.lastName || ""].join("").trim();
  kids.push(h("section", {class: "section", style: "margin-top:8px"},
    h("div", {class: "section-head"}, h("h2", {text: t("secProfile")})),
    h("div", {class: "rows", id: "members-rows"},
      row("fullName", "name", fullName, !p.firstName),
      row("nickname", "name", p.nickname, miss("nickname")),
      row("birthDate", "birth", p.birthDate ? App.fmt.date(p.birthDate, {weekday: undefined}) : "–", false),   // optional
      row("homeProvince", "province", provinceText(p.homeProvince), miss("homeProvince")),
      row("phone", "phone", p.phone, miss("phone")),
      row("email", "email", p.email, miss("email")),
      row("instagram", "instagram", p.instagram ? "@" + p.instagram : "", miss("instagram")),
      row("currentStatus", "work", p.currentStatus ? t("st_" + p.currentStatus) : "", miss("currentStatus")),
      p.currentStatus ? row("work", "work", workSummary(p), workMissing(p)) : null),
    h("p", {class: "members-note", text: t("profileNote")})));
  meBody.replaceChildren(...kids);
}
function workSummary(p){
  if (p.currentStatus === "highschool") return [p.hsSchool, p.hsGrade ? t("gradeShort", {n: p.hsGrade}) : "", p.hsProgram].filter(Boolean).join(" · ");
  if (p.currentStatus === "university") return [p.uniName, p.uniFaculty, p.uniMajor, p.uniYear ? t("year", {n: p.uniYear}) : ""].filter(Boolean).join(" · ");
  if (p.currentStatus === "working") return [p.jobTitle, p.company, p.industry].filter(Boolean).join(" · ");
  return p.otherNow || "–";
}
function workMissing(p){ return (STATUS_FIELDS[p.currentStatus] || []).some(k => !OPTIONAL[k] && !p[k]); }
function copy(text){
  try{ navigator.clipboard.writeText(text).then(() => App.toast(t("copied")), () => App.toast(text)); }catch(e){ App.toast(text); }
}

// Me: edit one part in a bottom sheet (member.update). Needs the current consent; otherwise the full form asks for it first.
function editGroup(group){
  const d = st.member;
  if (!d) return;
  if (!d.consentCurrent || !d.profile){ App.toast(t("needConsentFirst")); App.go("signup"); return; }
  const p = d.profile;
  const form = h("form", {class: "members-sheet-form", novalidate: true});
  if (group === "work") form.append(...workPart(p));
  else GROUPS[group].forEach(k => form.append(question(k, p)));
  const save = h("button", {type: "submit", class: "btn", id: "members-save", text: t("saveBtn")});
  form.append(save);
  form.addEventListener("input", clearErr); form.addEventListener("change", clearErr);
  form.addEventListener("submit", async e => {
    e.preventDefault();
    if (st.sending) return;
    const {vals, first} = check(form);
    if (first){ focusFirst(first); return; }
    const body = {};
    (group === "work" ? ["currentStatus"].concat(STATUS_FIELDS[vals.currentStatus] || []) : GROUPS[group]).forEach(k => { body[k] = vals[k] || ""; });
    st.sending = true; save.disabled = true; save.textContent = t("saving");
    try{
      const r = await App.api("member.update", {group, profile: body});
      st.member = r; App.closeSheet();
      App.toast(App.isDemo ? t("demoSaved") : (r.changed && r.changed.length ? t("sentSave") : t("nothingChanged")));
      drawMe(r);
    }catch(err){
      if (err.code === "CONSENT"){ App.closeSheet(); App.go("signup"); }
      App.toast(err.message);
    }finally{ st.sending = false; save.disabled = false; save.textContent = t("saveBtn"); }
  });
  const what = group === "name" ? t("f_fullName") : group === "work" ? t("f_work") : label(GROUPS[group][0]);
  App.sheet(t("editT", {what: en() ? what.toLowerCase() : what}), form);
}

/* ---------- sign-up v2 (#signup): new application, edit while pending, or complete / re-accept consent ---------- */
const suBody = $("#members-suBody");
function suMode(d){ return !d || d.status === "none" ? "apply" : d.status === "pending" ? "edit" : "complete"; }
async function showSignup(){
  const fresh = st.member && Date.now() - st.loadedAt < 60e3;
  if (!fresh){
    suBody.replaceChildren(App.skeleton([48, 120, 300]));
    try{ const d = await App.api("member.bootstrap"); st.member = d; st.loadedAt = Date.now(); }
    catch(e){ suBody.replaceChildren(App.emptyState(App.t("errLoad"), e.message, {text: App.t("retry"), onclick: showSignup})); return; }
  }
  drawSignup();
}
function drawSignup(draft){
  const d = st.member;
  App.setTitle();
  if (d.status === "rejected"){
    suBody.replaceChildren(h("div", {class: "card members-status"}, h("b", {text: t("rejectedT")}), h("span", {class: "t-small muted", text: t("rejectedD", {sid: d.serviceId})})));
    return;
  }
  const mode = suMode(d), p = Object.assign({}, d.profile || {}, (draft && draft.vals) || {});
  const consent = App.consent();
  const steps = h("div", {class: "members-steps", "aria-hidden": "true"},
    h("div", {class: "members-step members-on"}, h("i"), t("step1")),
    h("div", {class: "members-step" + (p.currentStatus ? " members-on" : ""), id: "members-step2"}, h("i"), t("step2")));
  const av = h("span", {class: "avatar", "aria-hidden": "true", text: (App.user.name || "?").trim().charAt(0).toUpperCase()});
  const lineAs = h("div", {class: "members-lineas"}, av, h("span", {text: t("lineAs", {name: App.user.name || "LINE"})}));
  const form = h("form", {class: "members-form", id: "members-form", novalidate: true},
    h("h2", {class: "members-sec", text: t("secBasics")}),
    question("title", p),
    h("div", {class: "members-two"}, question("firstName", p), question("lastName", p)),
    h("div", {class: "members-two"}, question("nickname", p), question("birthDate", p)),
    question("homeProvince", p), question("phone", p), question("email", p), question("instagram", p),
    h("h2", {class: "members-sec", text: t("secWork")}),
    ...workPart(p, () => { $("#members-step2").classList.add("members-on"); }));
  const tick = h("input", {type: "checkbox", id: "members-consent"});
  tick.checked = !!(draft && draft.ticked);
  const consentErr = h("p", {class: "members-err", id: "members-consent-err", hidden: true});
  tick.addEventListener("change", () => { consentErr.hidden = true; });
  form.append(h("div", {class: "members-field"},
    h("label", {class: "members-consent", for: "members-consent"}, tick,
      h("span", {}, consent.consent + " ", h("button", {type: "button", class: "members-link", onclick: e => { e.preventDefault(); App.privacySheet(); }, text: t("consentRead", {v: consent.version})}))),
    consentErr));
  form.addEventListener("input", clearErr); form.addEventListener("change", clearErr);
  form.addEventListener("submit", e => { e.preventDefault(); submit(mode); });
  // the sticky action bar lives inside this screen, so it disappears with it when another screen is shown
  const btn = h("button", {type: "button", class: "btn", id: "members-submit", onclick: () => submit(mode), text: t(mode === "apply" ? "submitApply" : "submitSave")});
  suBody.replaceChildren(steps, lineAs, form, h("div", {class: "members-bar", id: "members-bar"}, btn));
}
async function submit(mode){
  if (st.sending) return;
  const form = $("#members-form");
  const {vals, first} = check(form);
  const tick = $("#members-consent");
  if (!tick.checked){ const e = $("#members-consent-err"); e.replaceChildren(App.icon("alert"), t("errConsent")); e.hidden = false; }
  if (first || !tick.checked){ App.toast(t("errFix")); focusFirst(first || tick.closest(".members-field")); return; }
  const profile = {};
  ["title", "firstName", "lastName", "nickname", "birthDate", "homeProvince", "phone", "email", "instagram", "currentStatus"].concat(STATUS_FIELDS[vals.currentStatus] || [])
    .forEach(k => { profile[k] = vals[k] || ""; });
  const btn = $("#members-submit");
  st.sending = true; btn.disabled = true; btn.textContent = t("sending");
  try{
    const r = await App.api("member.apply", {profile, consent: true, consentVersion: App.consent().version});
    st.member = r; st.loadedAt = Date.now();
    App.toast(App.isDemo ? t("demoSaved") : t(mode === "apply" ? "sentApply" : "sentSave"));
    App.go("me");
  }catch(e){ App.toast(e.message); }
  finally{ st.sending = false; if (btn.isConnected){ btn.disabled = false; btn.textContent = t(mode === "apply" ? "submitApply" : "submitSave"); } }
}

App.register({
  name: "members",
  tab: "me",
  screen: "members-screen",
  title: () => t("title"),
  show(ctx){
    frame();
    if (ctx.first) view.start().then(() => {      // ?tab=me&signup=1 (from an invite or the old sign-up page): open the form for newcomers
      if (ctx.params && ctx.params.get("signup") === "1" && st.member && st.member.status === "none") App.go("signup");
    });
    else if (Date.now() - st.loadedAt > 60e3) view.refresh();   // at most once a minute when switching tabs
  },
  onLang(){
    if (!$("#members-screen").hidden) frame();
    else if (!$("#members-signup").hidden && st.member){          // keep what was typed when the language changes
      const f = $("#members-form"), tick = $("#members-consent");
      drawSignup(f ? {vals: read(f), ticked: !!(tick && tick.checked)} : null);
    }
  },
  routes: {
    signup: {
      screen: "members-signup",
      title: () => { const m = suMode(st.member); return {title: t(m === "apply" ? "suTitleApply" : m === "edit" ? "suTitleEdit" : "suTitleComplete"), sub: t(m === "apply" ? "suSubApply" : "suSubComplete")}; },
      show(){ showSignup(); }
    }
  }
});

/* ---------- demo mode (no API_URL): ?demo=participant | organizer | new | visitor | pending | rejected ---------- */
const DEMO_P = { title: "นาย", firstName: "ต้นกล้า", lastName: "ใจดี", nickname: "ต้นกล้า", birthDate: "1998-03-12", homeProvince: "ขอนแก่น",
  phone: "0861112222", email: "tonkla@example.com", instagram: "tonkla.example", currentStatus: "working",
  hsSchool: "", hsGrade: "", hsProgram: "", uniName: "", uniFaculty: "", uniMajor: "", uniYear: "", jobTitle: "Data Analyst", company: "บริษัท ตัวอย่าง จำกัด",
  industry: "Information Technology", otherNow: "", occupation: "working", organization: "บริษัท ตัวอย่าง จำกัด" };
let demoState = null;
function demoMember(mode){
  if (demoState) return demoState;
  const base = {ok: true, serviceId: "SV-2611-0007", lineName: "Kim (demo)", role: "participant", profile: Object.assign({}, DEMO_P),
    profileComplete: true, needsProfile: false, missing: [], consentCurrent: true, consentVersion: App.consent().version, appliedAt: "2026-11-01 10:00"};
  if (mode === "visitor") return (demoState = Object.assign(base, {status: "none", serviceId: "", profile: null, profileComplete: false, needsProfile: true, missing: ["title"], consentCurrent: false}));
  if (mode === "pending") return (demoState = Object.assign(base, {status: "pending"}));
  if (mode === "rejected") return (demoState = Object.assign(base, {status: "rejected", profile: null}));
  if (mode === "new"){                                 // approved before sign-up v2: older consent, v2 answers missing
    const p = Object.assign({}, DEMO_P, {title: "", nickname: "", birthDate: "", homeProvince: "", instagram: "", currentStatus: "", jobTitle: "", company: "", industry: "", firstName: "มานี", lastName: "ทดสอบ"});
    return (demoState = Object.assign(base, {status: "approved", serviceId: "SV-2611-0003", profile: p, needsProfile: true, consentCurrent: false,
      missing: ["title", "nickname", "homeProvince", "instagram", "currentStatus"]}));
  }
  return (demoState = Object.assign(base, {status: "approved", role: mode === "organizer" ? "organizer" : "participant"}));
}
App.demo["member.bootstrap"] = (body, mode) => demoMember(mode);
App.demo["member.apply"] = (body, mode) => {
  const d = demoMember(mode);
  d.profile = Object.assign({}, d.profile || {}, body.profile); d.consentCurrent = true; d.needsProfile = false; d.missing = []; d.changed = Object.keys(body.profile);
  if (d.status === "none"){ d.status = "pending"; d.serviceId = "SV-DEMO-0001"; }
  return d;
};
App.demo["member.update"] = (body, mode) => {
  const d = demoMember(mode);
  if (body.group === "work") STATUSES.forEach(s => STATUS_FIELDS[s].forEach(k => { d.profile[k] = ""; }));
  Object.assign(d.profile, body.profile); d.changed = Object.keys(body.profile);
  return d;
};
});
/* ---------- start: draw at once (saved copy or skeleton), then sign in with LINE, then refresh ---------- */
async function initLiff(){
  if (S.demo || !CONFIG.LIFF_ID || !window.liff){ S.name = "Kim (demo)"; S.owner = "demo"; return true; }
  await liff.init({liffId: CONFIG.LIFF_ID});
  if (!liff.isLoggedIn()){ liff.login({redirectUri: location.href}); return false; }
  S.inClient = liff.isInClient();
  S.token = liff.getIDToken();               // LINE ID token (openid scope); Code.gs checks it with LINE, then answers with a session
  const dec = (liff.getDecodedIDToken && liff.getDecodedIDToken()) || {};
  S.name = dec.name || ""; S.picture = dec.picture || "";
  let sub = dec.sub || "";
  if (!S.name || !sub){ try{ const p = await liff.getProfile(); S.name = S.name || p.displayName || ""; S.picture = S.picture || p.pictureUrl || ""; sub = sub || p.userId || ""; }catch(e){} }
  S.owner = await ownerOf(sub);
  if (!store.get("app.lang") && !store.get("home.lang")){ const l = ((liff.getLanguage && liff.getLanguage()) || "").toLowerCase(); if (l) S.lang = l.startsWith("th") ? "th" : "en"; }
  return true;
}
(async function boot(){
  S.lang = store.get("app.lang") || store.get("home.lang") || CONFIG.DEFAULT_LANG;
  S.theme = store.get("app.theme") || "auto";
  applyTheme();
  buildTabs();
  $("#tabbar").hidden = false;
  $("#demoBanner").hidden = !S.demo;
  applyLang();
  $("#shell-loading").hidden = true;
  booted = true;
  render(initialRoute());                    // instant: what this phone saw last time, or a skeleton
  try{ if (!(await initLiff())) return; }
  catch(e){ console.error(e); fatal(tShell("liffFail"), tShell("errLoadD")); return; }
  S.liffDone = true;
  // a saved copy from another LINE account on this phone is dropped before anything new is shown
  const c = store.get(cacheName());
  if (c && c.owner && S.owner && c.owner !== S.owner){ cacheClear(); VIEWS.forEach(v => { if (v.meta && v.meta.stale) v.reset(); }); }
  if (S.route) history.replaceState(null, "", location.pathname + location.search + "#" + encodeURIComponent(S.route.name) + (S.route.arg ? "/" + encodeURIComponent(S.route.arg) : ""));
  renderAvatar();
  applyLang();
  readyResolve();
})();
</script>
